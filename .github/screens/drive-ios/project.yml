# The iOS app screenshots' driver (../apps.md): a UI test that drives an
# installed app by its bundle id, as a person would, and the empty app
# XCUITest insists a UI test has. Nothing of the apps' own is built here.
name: Drive
options:
  bundleIdPrefix: dev.arkui.screens
  deploymentTarget:
    iOS: "17.0"
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        # The iPhone and the iPad: the same driver on each simulator.
        TARGETED_DEVICE_FAMILY: "1,2"
  Drive:
    type: bundle.ui-testing
    platform: iOS
    sources: [Drive]
    dependencies:
      - target: Host
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Host
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Drive:
    build:
      targets:
        Host: all
        Drive: [test]
    test:
      targets: [Drive]
