# The Android app, as `nix build .#harken-apk` assembles it: debug-signed,
# from a recorded Maven graph (harken/android/deps.json), with aapt2 compiled
# from the Android sources (nix/aapt2.nix) and an SDK assembled by hand
# (nix/android-sdk.nix).
#
# How long it takes — an estimate, not a measurement on a hosted runner: a
# cold run (no cache) fetches the toolchain from cache.nixos.org, compiles
# aapt2 from about two hundred C++ files (a few minutes on the runner's four
# cores), replays the Maven graph and runs gradle over the Kotlin runtime and
# the app — expect 20 to 40 minutes. With the store restored below, aapt2
# and the SDK are already built, and a run is gradle's own assemble, around
# 10 minutes. GitHub's cache is 10 GB per repository, shared with
# pages.yml's, so the store is collected down before it is saved; aapt2 and
# the SDK are made gc roots first so the collection keeps them.
name: apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # A tag's release is created with GITHUB_TOKEN.
  contents: write
  # cache-nix-action deletes the caches it superseded.
  actions: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The hosted image carries ~30 GB of toolchains this build never uses;
      # the nix store, a JDK, gradle's state and the aapt2 build want the room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-apk-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**', 'harken/android/deps.json', 'kotlin/deps.json') }}
          restore-prefixes-first-match: nix-apk-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-apk-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build aapt2 and the SDK (kept as gc roots)
        run: nix build .#aapt2 .#android-sdk --out-link "$RUNNER_TEMP/android" --print-build-logs

      - name: Build the APK
        run: nix build .#harken-apk --print-build-logs

      - uses: actions/upload-artifact@v4
        with:
          name: harken-debug-apk
          path: result/harken-debug.apk
          if-no-files-found: error

      # A tag is a release: the same APK, attached to it. Debug-signed, so it
      # installs anywhere and belongs nowhere public (harken/android/README.md).
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: result/harken-debug.apk
          generate_release_notes: true
