# The apps' screenshots, from the builds that were published: the APKs
# build.yaml put in the F-Droid repository and the commit ios.yaml sent to
# TestFlight, signed in to each app's own server run here with something in
# it, and driven from outside as a person would. The how is in
# .github/screens/apps.md.
#
# **Nothing here names an app.** An app is taken when it has
# <app>/screens/shots.json — its package ids, and each shot as the steps
# that open it — and, if it signs in to a server, <app>/screens/server.sh,
# which starts that server with something in it. Its builds are the
# artifacts `apk-<app>` (build.yaml) and `simulator-<app>` (ios.yaml).
#
# **After the publish, from what it published.** This runs when build or ios
# finishes and takes that run's own artifacts: an APK is in build's run only
# when its inputs moved and it was built (and so offered on F-Droid), and a
# simulator build is in ios's only when that app was sent to TestFlight. An
# app neither run built is not taken again; what the branch has of it stays.
#
# **The screenshots' own scripts changed, nothing rebuilt.** A push to main
# that moves only what takes the shots (.github/screens/, an app's screens/,
# this file) takes every app again from what was last published, building
# nothing: each APK as the F-Droid repository offers it (its index's newest
# for the package), and each iPhone build as main's newest `simulator-<app>`
# artifact, which main makes only when it sends that app to TestFlight
# (kept 90 days; an older one is said, and that app's iOS shots are kept).
#
# **On main, published**: to the `screens` branch beside the docs' shots, as
# apps/<app>/<phone>/<theme>/<id>.png with apps/<app>/manifest.json. **On a
# pull request** (build and ios run there too, publishing nothing), each
# shot is compared with the branch's, and the PR gets one comment, kept up
# to date, showing the shots that changed, before and after; the images go
# to a branch of the PR's own, `screens-pr-<number>`.
#
# A workflow_run workflow runs as this file is on the default branch, with
# this repository's token, whoever's run started it: it checks out the
# scripts from main, never the PR's, and of a PR's run it reads only its
# artifacts (an APK installed on an emulator, an app on a simulator, PNGs
# compared).
name: app-screens

on:
  workflow_run:
    workflows: [build, ios]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/screens/**"
      - "*/screens/**"
      - ".github/workflows/app-screens.yaml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: app-screens-${{ github.event.workflow_run.name || 'published' }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

env:
  # The run whose builds are taken; none for a push or a run by hand, which
  # take what was published.
  RUN: ${{ github.event.workflow_run.id }}
  WORKFLOW: ${{ github.event.workflow_run.name }}
  BRANCH: ${{ github.event.workflow_run.head_branch }}
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  FDROID: https://k2on.github.io/apps/fdroid/repo

jobs:
  # What there is to take, and what for: `release` (main, published),
  # `pr` (a pull request's, compared), or nothing.
  which:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.which.outputs.mode }}
      pr: ${{ steps.which.outputs.pr }}
      android: ${{ steps.which.outputs.android }}
      ios: ${{ steps.which.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - id: which
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event.workflow_run.event }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
        run: |
          repo=${{ github.repository }}
          pr=
          # The scripts moved, or a run by hand: every app, from what was published.
          if [ -z "$RUN" ]; then
            android="" ios=""
            for shots in */screens/shots.json; do
              a=${shots%%/*}
              jq -e .android "$shots" > /dev/null && android="$android $a"
              jq -e .ios "$shots" > /dev/null && ios="$ios $a"
            done
            { echo "mode=release"; echo "pr="; echo "android=${android# }"; echo "ios=${ios# }"; } | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BRANCH" = main ] && [ "$EVENT" = push ]; then
            mode=release
            # From build, only once the F-Droid repository is up.
            if [ "$WORKFLOW" = build ]; then
              deploy=$(gh api "repos/$repo/actions/runs/$RUN/jobs" --paginate --jq '.jobs[] | select(.name == "deploy") | .conclusion')
              [ "$deploy" = success ] || mode=
            fi
          else
            pr=${PR:-$(gh api "repos/$repo/pulls?state=open&head=$OWNER:$BRANCH" --jq '.[0].number // empty')}
            mode=${pr:+pr}
          fi
          made=$(gh api "repos/$repo/actions/runs/$RUN/artifacts" --paginate --jq '.artifacts[] | select(.expired | not) | .name')
          # Every app with shots, and of those what this run built.
          android="" ios=""
          for shots in */screens/shots.json; do
            a=${shots%%/*}
            if [ "$WORKFLOW" = build ] && grep -qx "apk-$a" <<< "$made" && jq -e .android "$shots" > /dev/null; then
              android="$android $a"
            fi
            if [ "$WORKFLOW" = ios ] && grep -qx "simulator-$a" <<< "$made" && jq -e .ios "$shots" > /dev/null; then
              ios="$ios $a"
            fi
          done
          { echo "mode=$mode"; echo "pr=$pr"; echo "android=${android# }"; echo "ios=${ios# }"; } | tee -a "$GITHUB_OUTPUT"

  android:
    needs: which
    if: needs.which.outputs.mode != '' && needs.which.outputs.android != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APPS: ${{ needs.which.outputs.android }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # The APKs the run built — what F-Droid offers, or the PR's — each in
      # apk-<app>/; with no run, each as the F-Droid repository offers it.
      - if: env.RUN != ''
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: ${{ runner.temp }}/apk
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}
      - if: env.RUN == ''
        run: bash .github/screens/published.sh android "$RUNNER_TEMP/apk" $APPS
        env:
          GH_TOKEN: ${{ github.token }}

      # For the servers an app's server.sh builds.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: app-screens-servers

      - name: The servers
        run: |
          for a in $APPS; do
            if [ -f "$a/screens/server.sh" ]; then bash .github/screens/app-server.sh "$a" "$RUNNER_TEMP/server/$a"; fi
          done

      # As screens.yaml, with its retries.
      - name: The system image
        run: |
          sdk=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          image='system-images;android-34;google_apis;x86_64'
          for try in 1 2 3 4; do
            if yes 2>/dev/null | "$sdk" --install "$image" --channel=0 > /dev/null &&
              [ -f "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/system.img" ]; then
              exit 0
            fi
            echo "::warning::system image, try $try failed"
            "$sdk" --uninstall "$image" > /dev/null || true
            sleep $((try * 10))
          done
          exit 1

      # Each app in turn (app-android.sh); one that fails is said, and the
      # others still taken. One line: the action runs each line of `script`
      # as its own command.
      - name: Capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/screens/apps-android.sh "$RUNNER_TEMP/out" "$RUNNER_TEMP/apk" $APPS

      - name: The servers' logs
        if: always()
        run: tail -n 40 "$RUNNER_TEMP"/server/*/server.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screens-android
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore

  ios:
    needs: which
    if: needs.which.outputs.mode != '' && needs.which.outputs.ios != ''
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APPS: ${{ needs.which.outputs.ios }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::no Xcode 26 on this runner image"; exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"

      # As screens.yaml: the newest iPhone Pro, booting under the rest.
      - name: Start booting a simulator
        run: |
          bash .github/screens/meanwhile.sh start boot bash -c '
            device=$(xcrun simctl list devices available -j | jq -r "
              .devices | to_entries | map(select(.key | test(\"iOS\"))) | sort_by(.key) | last | .value
              | map(select(.name | test(\"^iPhone [0-9]+ Pro$\"))) | sort_by(.name) | last | .name")
            echo "Booting $device"
            echo "$device" > "$RUNNER_TEMP/device"
            xcrun simctl boot "$device" && xcrun simctl bootstatus "$device" -b'

      # The simulator builds of the commit sent to TestFlight, or the PR's;
      # each simulator-<app>/simulator.tgz, one .app inside. With no run,
      # main's newest of each: the last sent to TestFlight.
      - if: env.RUN != ''
        uses: actions/download-artifact@v4
        with:
          pattern: simulator-*
          path: ${{ runner.temp }}/apps
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}
      - if: env.RUN == ''
        run: bash .github/screens/published.sh ios "$RUNNER_TEMP/apps" $APPS
        env:
          GH_TOKEN: ${{ github.token }}
      - run: for d in "$RUNNER_TEMP"/apps/simulator-*; do tar -xzf "$d/simulator.tgz" -C "$d"; done

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: app-screens-servers

      - name: The servers, and the driver's tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          for a in $APPS; do
            if [ -f "$a/screens/server.sh" ]; then bash .github/screens/app-server.sh "$a" "$RUNNER_TEMP/server/$a"; fi
          done

      - name: The simulator, booted
        run: bash .github/screens/meanwhile.sh wait boot

      - name: Capture
        env:
          RESULTS: ${{ runner.temp }}/results
        run: bash .github/screens/apps-ios.sh "$RUNNER_TEMP/out" "$RUNNER_TEMP/apps" "$(cat "$RUNNER_TEMP/device")" $APPS

      # The driver's results (its log, and the test's recording of the
      # screen), when a capture failed: what to look at.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-driver-results
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore

      - name: The servers' logs
        if: always()
        run: tail -n 40 "$RUNNER_TEMP"/server/*/server.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screens-ios
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore

  # Main's, onto the `screens` branch: each app and phone taken whole this
  # run replaced, the rest as it was.
  publish:
    needs: [which, android, ios]
    if: ${{ !cancelled() && needs.which.outputs.mode == 'release' }}
    runs-on: ubuntu-latest
    # One writer of the branch at a time, with screens.yaml's publish.
    concurrency:
      group: screens-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: app-screens-*
          merge-multiple: true
          path: ${{ runner.temp }}/new
      - name: Lay out the branch
        run: |
          branch="$RUNNER_TEMP/branch"
          mkdir -p "$branch"
          if git fetch --depth 1 origin screens; then
            git --work-tree="$branch" checkout FETCH_HEAD -- .
          fi
          bash .github/screens/apps-lay.sh "$RUNNER_TEMP/new" "$branch/apps"
          shopt -s nullglob
          for a in "$branch"/apps/*/; do
            python3 -I .github/screens/manifest.py "$a" "${{ github.run_id }}" "$SHA"
          done
      - name: Publish
        working-directory: ${{ runner.temp }}/branch
        run: |
          git init -q -b screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "app screens from $SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screens

  # A PR's, compared with main's and shown on the PR.
  compare:
    needs: [which, android, ios]
    if: ${{ !cancelled() && needs.which.outputs.mode == 'pr' }}
    runs-on: ubuntu-latest
    # The PR's comment and its branch, one run at a time.
    concurrency:
      group: app-screens-pr-${{ needs.which.outputs.pr }}
      cancel-in-progress: false
    env:
      PR: ${{ needs.which.outputs.pr }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: app-screens-*
          merge-multiple: true
          path: ${{ runner.temp }}/new
      - name: Compare, and keep the images on the PR's branch
        run: |
          sudo apt-get install -y -qq imagemagick > /dev/null
          main="$RUNNER_TEMP/main"
          mkdir -p "$main"
          ref=screens
          if git fetch --depth 1 origin screens; then
            ref=$(git rev-parse FETCH_HEAD)
            git --work-tree="$main" checkout FETCH_HEAD -- . 2>/dev/null || true
          fi
          # What the PR's branch has from the other workflow's run (build's
          # Android, ios's iOS), with this run's laid over it.
          keep="$RUNNER_TEMP/pr"
          mkdir -p "$keep"
          if git fetch --depth 1 origin "screens-pr-$PR"; then git --work-tree="$keep" checkout FETCH_HEAD -- . 2>/dev/null || true; fi
          bash .github/screens/apps-lay.sh "$RUNNER_TEMP/new" "$keep"
          python3 -I .github/screens/compare.py "$main/apps" "$keep" "${{ github.repository }}" "$ref" "screens-pr-$PR" "$SHA" > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md"
          cd "$keep"
          git init -q -b "screens-pr-$PR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "app screens for #$PR at $SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "screens-pr-$PR"
      - name: The PR's comment
        run: |
          body="$RUNNER_TEMP/comment.md"
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- app-screens -->"))) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@"$body" > /dev/null
          else
            gh api "repos/${{ github.repository }}/issues/$PR/comments" -F body=@"$body" > /dev/null
          fi
