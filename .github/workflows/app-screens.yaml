# The apps' screenshots: Android's from the APKs build.yaml put in the
# F-Droid repository, the iPhone's from nix's build of the commit ios.yaml
# sent to TestFlight, the desktop window's from nix's build of the commit
# build.yaml builds; each signed in to its own server run here with
# something in it, and driven from outside as a person would. The how is in
# .github/screens/apps.md.
#
# **Nothing here names an app.** The apps are the flake's one list
# (`publish`: its APKs, its iPhone apps), and of those an app is taken when
# it has <app>/screens/shots.json — each shot as the steps that open it —
# and, if it signs in to a server, <app>/screens/server.sh, which starts
# that server with something in it. Its builds are the
# artifacts `apk-<app>` (build.yaml), for the iPhone `nix build
# .#<app>-ios-simulator` at the commit (flake.nix, `iosSimulator`), and for
# the desktop `nix build .#<app>-iced` at the commit (flake.nix, `icedApp`;
# `publish.desktop` the list), photographed with no window by arkui-shots.
# The larger screens: Android's tablet and Fold each a job beside each
# phone's, from the same APK; the iPad on the iPhone's Mac, only for an
# app whose build takes it (its UIDeviceFamily), and the Mac's own window,
# only for an app whose commit has `<app>-macos` (apps.md, "The larger
# screens"). An app with neither boots nothing more.
#
# **After the publish.** This runs when build finishes (Android) and when
# ios has ended (the iPhone, which builds the commit itself, after ios, so as
# to fetch what ios built and pushed to the cache: the kernel's simulator
# slice and, on a PR, the app; one kernel per commit). Android takes
# that run's own APKs: one is there only when its inputs moved and it was
# built (and so offered on F-Droid). The iPhone takes nix's build at that
# run's commit, of each app whose shots would differ from those kept: what
# they are taken from hashed on Linux (ios-inputs.sh: the app's store path,
# evaluated, and what takes the shots), and held against the hash kept
# beside the branch's shots (<app>/ios/inputs), main's or the PR's own. An
# app whose hash is the same is not taken, and no Mac is asked for when no
# app's moved; the rest are taken on one Mac, in turn. The desktop as soon
# as build has started: nix's build at that commit, the cache's when
# unchanged. An app none takes is not taken again; what
# the branch has of it stays.
#
# **The screenshots' own scripts changed.** A push to main that moves only
# what takes the shots (.github/screens/, an app's screens/, this file)
# takes every app again: each APK as the F-Droid repository offers it (its
# index's newest for the package), each iPhone app as nix builds main (of
# those whose hash moved: an Android script moves none).
#
# **A pull request no longer open** is taken nothing of: a run queued behind
# others (a Mac's queue is often an hour) can start after its PR was merged
# or closed. `which` asks, and asks no Mac then; the iPhone's job asks again
# when it starts, and if the PR has gone, does nothing, and nothing is
# compared.
#
# **On main, published**: to the `screens` branch beside the docs' shots, as
# apps/<app>/<phone>/<theme>/<id>.png with apps/<app>/manifest.json. **On a
# pull request** (build and ios run there too, publishing nothing), each
# shot is compared with the branch's, and the PR gets one comment, kept up
# to date, showing the shots that changed, before and after; the images go
# to a branch of the PR's own, `screens-pr-<number>`.
#
# A workflow_run workflow runs as this file is on the default branch, with
# this repository's token, whoever's run started it: it checks out the
# scripts from main, never the PR's. Of a PR's run Android reads only its
# artifacts (an APK installed on an emulator); the iPhone and the desktop
# build the PR's commit, only for a branch of this repository, with a token
# that can only read. `which` evaluates the PR's flake (ios-inputs.sh) and
# builds nothing of it, with a token that can only read.
#
# **The cache, and whose code goes in it.** What a job here builds goes to
# Cachix (CACHIX_NAME, with the secret CACHIX_AUTH_TOKEN) only when every
# line it builds and runs is this repository's own: main's, a branch's of
# this repository (its PR's run, or a run by hand), never a fork's. A
# workflow_run job has this repository's secrets whoever's run started it,
# and nix trusts what the cache signed, not what is in it: a job holding the
# token while it ran a fork's code could put anything under any hash every
# later build fetches. So the token is asked for only by a step whose `if`
# says the run's head repository is this one (SAME_REPO, below: the
# triggering run's `head_repository`, not its branch's name, which a fork
# chooses). A fork's run is read-only on the cache: Android's jobs install
# its APK and push nothing; the iPhone's and the desktop's do not run.
# Nothing built with Xcode goes there either (Apple's licence): the Mac's
# push filters it out, as ios.yaml's does.
name: app-screens

on:
  # The iPhone once ios has ended: it builds the commit itself, and ios
  # has by then built and pushed to the cache (main's and a PR's of this
  # repository's) the kernel and app it would otherwise build a second time,
  # a Mac's five to twelve minutes. A pull request's Android as
  # soon as build has started too: its emulator boots and its server
  # starts while the APK builds, and each app is taken once its APK is
  # uploaded (await-apk.sh), not once the run (its tests) has ended. Main's
  # Android once build has ended and deployed, so that what is published
  # is what F-Droid offers. The desktop as soon as build has started, on main
  # and on a PR: it builds the commit itself. Both events of both; `which`
  # says which one this run is for.
  workflow_run:
    workflows: [build, ios]
    types: [requested, completed]
  push:
    branches: [main]
    paths:
      - ".github/screens/**"
      - "*/screens/**"
      # What the servers are seeded with.
      - "*/seed/**"
      - ".github/workflows/app-screens.yaml"
  # By hand: every app again, from what was published. Or, given a pull
  # request's number, that PR's iPhone shots, at its head, of each app whose
  # hash moved (none of its build's runs needed): after a Mac's run failed,
  # or to try this file as a branch has it, on that branch's PR.
  workflow_dispatch:
    inputs:
      pr:
        description: "A pull request's number: its iPhone shots, not every app's"
        required: false
        default: ""
      # Every app taken as by hand, and nothing published (no `screens`
      # branch): to try this file as a branch has it, run on that branch,
      # before it is merged. Its builds still go to the cache, as every run
      # of this repository's code.
      dry:
        description: "Without a PR: take every app, publish nothing"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  # An event of its own: build's `completed` must not cancel the Android
  # shots its `requested` started.
  group: app-screens-${{ github.event.workflow_run.name || 'published' }}-${{ github.event.action || 'run' }}-${{ github.event.workflow_run.head_branch || github.ref_name }}-${{ inputs.pr }}
  cancel-in-progress: true

env:
  # The run whose builds are taken; none for a push or a run by hand, which
  # take what was published.
  RUN: ${{ github.event.workflow_run.id }}
  WORKFLOW: ${{ github.event.workflow_run.name }}
  BRANCH: ${{ github.event.workflow_run.head_branch }}
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  FDROID: https://k2on.github.io/apps/fdroid/repo
  # `true` when the code this run builds and runs is this repository's own
  # (see the top): a push to main or a run by hand (by someone who can
  # write here; a PR's by hand only of a branch here, `which` says), or a
  # workflow_run whose run was of this repository's head. Only then does a
  # job push to the cache.
  SAME_REPO: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository }}

jobs:
  # What there is to take, and what for: `release` (main, published),
  # `pr` (a pull request's, compared), or nothing.
  which:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    # It reads, and evaluates the commit's flake (ios-inputs.sh), building
    # nothing of it: no more than that.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      mode: ${{ steps.which.outputs.mode }}
      pr: ${{ steps.which.outputs.pr }}
      # The commit taken, and its branch (the iPhone's taken one at a time on it).
      sha: ${{ steps.which.outputs.sha }}
      branch: ${{ steps.which.outputs.branch }}
      android: ${{ steps.which.outputs.android }}
      ios: ${{ steps.which.outputs.ios }}
      desktop: ${{ steps.which.outputs.desktop }}
      # The same, as JSON lists: each app a job of its own.
      android-json: ${{ steps.which.outputs.android-json }}
      ios-json: ${{ steps.which.outputs.ios-json }}
      desktop-json: ${{ steps.which.outputs.desktop-json }}
      # Each iPhone app taken, and the hash of what it is taken from
      # (ios-inputs.sh), as a JSON object: kept beside its shots.
      ios-inputs: ${{ steps.which.outputs.ios-inputs }}
      # The Macs' jobs: [{app, device}], device iphone, ipad or mac.
      ios-matrix: ${{ steps.which.outputs.ios-matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The apps, as the flake lists them (`publish`): each phone's, of those
      # with <app>/screens/shots.json, and the desktop's, of those whose
      # shots.json has `desktop`.
      - uses: DeterminateSystems/nix-installer-action@main
      - name: The apps
        run: |
          nix eval --json .#publish.x86_64-linux --apply 'p: { android = map (a: a.name) p.apks; ios = map (a: a.name) p.ios; desktop = map (a: a.name) (p.desktop or [ ]); }' > "$RUNNER_TEMP/apps.json"
          cat "$RUNNER_TEMP/apps.json"
      - id: which
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event.workflow_run.event }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          repo=${{ github.repository }}
          pr="" mode="" sha=$SHA branch=${BRANCH:-$GITHUB_REF_NAME}
          android="" ios="" desktop="" inputs='{}'
          # Each list also as JSON, for the jobs' matrices.
          lists() {
            for k in android ios desktop; do
              printf '%s-json=%s\n' "$k" "$(tr ' ' '\n' <<< "${!k}" | jq -Rsc 'split("\n") | map(select(. != ""))')"
            done
          }
          # The commit's tree, fetched once (ios-inputs.sh evaluates it;
          # the Macs' matrix reads its projects).
          src=$RUNNER_TEMP/src
          fetched() {
            [ -d "$src/.git" ] && return 0
            git init -q "$src"
            git -C "$src" fetch -q --depth 1 "https://github.com/$repo" "$sha"
            git -C "$src" checkout -q FETCH_HEAD
          }
          # The Macs' jobs, one per app and device, at once (the `ios`
          # matrix): each iPhone app's iPhone; its iPad when its project
          # may take it (a TARGETED_DEVICE_FAMILY with 2: the built app's
          # UIDeviceFamily, ios-family.sh, still decides, so a job for one
          # that does not passes over it in seconds); its Mac window when
          # the commit has <app>-macos (by name, nothing evaluated).
          macs() {
            local a names=[] rows=()
            [ -n "${ios// /}" ] || { echo '[]'; return; }
            fetched
            names=$(nix eval --json "$src#packages.aarch64-darwin" --apply builtins.attrNames 2> /dev/null) || names=[]
            for a in $ios; do
              rows+=("$a iphone")
              if grep -qE 'TARGETED_DEVICE_FAMILY: *"?[0-9,]*2' "$src/$a/ios/project.yml" 2> /dev/null; then rows+=("$a ipad"); fi
              if jq -e --arg p "$a-macos" 'index($p) != null' <<< "$names" > /dev/null; then rows+=("$a mac"); fi
            done
            printf '%s\n' "${rows[@]}" | jq -Rsc 'split("\n") | map(select(. != "") | split(" ") | {app: .[0], device: .[1]})'
          }
          # What was decided, as the jobs read it. Nothing for this event
          # (ios's start, a PR's build ending, a PR closed, nothing moved):
          # nothing to do, publish included.
          said() {
            android=${android# } ios=${ios# } desktop=${desktop# }
            [ -n "$android$ios$desktop" ] || mode=
            {
              echo "mode=$mode"; echo "pr=$pr"; echo "sha=$sha"; echo "branch=$branch"
              echo "android=$android"; echo "ios=$ios"; echo "desktop=$desktop"; echo "ios-inputs=$inputs"
              echo "ios-matrix=$(macs)"
              lists
            } | tee -a "$GITHUB_OUTPUT"
          }
          shots() { [ -f "$1/screens/shots.json" ]; }
          # An app whose shots.json has the desktop's shots.
          desktop() { shots "$1" && jq -e '.desktop.shots | length > 0' "$1/screens/shots.json" > /dev/null; }
          iphones() { for a in $(jq -r '.ios[]' "$RUNNER_TEMP/apps.json"); do if shots "$a"; then echo "$a"; fi; done; }
          # The hash kept beside an app's iPhone shots on a branch
          # (<dir>/ios/inputs), or nothing: none kept, or no such branch.
          kept() {
            local h
            h=$(gh api -H "Accept: application/vnd.github.raw" "repos/$repo/contents/$2/ios/inputs?ref=$1" 2> /dev/null) || return 0
            grep -x '[0-9a-f]\{32\}' <<< "$h" || true
          }
          # Of the iPhone apps named, those to take: each whose hash
          # (ios-inputs.sh, of the commit's flake, evaluated) is not that of
          # the shots kept for it. On a PR, its own last shots' (on
          # screens-pr-<number>), or main's when it has none of its own or
          # its own are main's (the comment then shows main's, "not
          # rebuilt"); on main, those published. Each said, and why.
          iphone() {
            [ $# -gt 0 ] || return 0
            local a hash main mine
            fetched
            while read -r a hash; do
              main=$(kept screens "apps/$a") mine=""
              if [ "$mode" = pr ]; then mine=$(kept "screens-pr-$pr" "$a"); fi
              if [ "$hash" = - ]; then
                echo "$a (iPhone): what it is taken from could not be said; taken"
              elif [ "$mode" = pr ] && [ "$hash" = "$mine" ]; then
                echo "$a (iPhone): $hash, as this PR's last shots; not taken"
                continue
              elif [ "$mode" = pr ] && [ "$hash" = "$main" ] && { [ -z "$mine" ] || [ "$mine" = "$main" ]; }; then
                echo "$a (iPhone): $hash, as main's; not taken (the comment shows main's)"
                continue
              elif [ "$mode" = release ] && [ "$hash" = "$main" ]; then
                echo "$a (iPhone): $hash, as published; not taken"
                continue
              else
                ours=""
                if [ "$mode" = pr ]; then ours=", this PR's ${mine:-none}"; fi
                echo "$a (iPhone): $hash, moved (main's ${main:-none}$ours); taken"
              fi
              ios="$ios $a"
              inputs=$(jq -c --arg a "$a" --arg h "$hash" '. + {($a): $h}' <<< "$inputs")
            done < <(bash .github/screens/ios-inputs.sh . "$src" "$@")
          }

          # By hand, for a pull request: its iPhone shots, at its head, if
          # it is open, into main, and of a branch of this repository's.
          if [ "$BY_HAND" = true ] && [ -n "$INPUT_PR" ]; then
            pr=$INPUT_PR
            read -r state base head sha branch < <(gh api "repos/$repo/pulls/$pr" --jq '"\(.state) \(.base.ref) \(.head.repo.full_name) \(.head.sha) \(.head.ref)"')
            if [ "$state" != open ]; then
              echo "#$pr is $state: nothing to take"
            elif [ "$base" != main ]; then
              echo "#$pr is into $base, not main: its iPhone's are not taken"
            elif [ "$head" != "$repo" ]; then
              echo "#$pr is of $head: its code is not built here"
            else
              mode="pr"
              # shellcheck disable=SC2046
              iphone $(iphones)
            fi
            said
            exit 0
          fi
          # The scripts moved, or a run by hand: every app, from what was
          # published; the iPhone's, by hand every one, after a push those
          # whose hash moved.
          if [ -z "$RUN" ]; then
            mode=release
            for a in $(jq -r '.android[]' "$RUNNER_TEMP/apps.json"); do if shots "$a"; then android="$android $a"; fi; done
            for a in $(jq -r '.desktop[]' "$RUNNER_TEMP/apps.json"); do if desktop "$a"; then desktop="$desktop $a"; fi; done
            if [ "$BY_HAND" = true ]; then
              for a in $(iphones); do ios="$ios $a"; done
            else
              # shellcheck disable=SC2046
              iphone $(iphones)
            fi
            said
            exit 0
          fi
          if [ "$BRANCH" = main ] && [ "$EVENT" = push ]; then
            mode=release
            # From build, only once the F-Droid repository is up.
            if [ "$WORKFLOW" = build ] && [ "$ACTION" = completed ]; then
              deploy=$(gh api "repos/$repo/actions/runs/$RUN/jobs" --paginate --jq '.jobs[] | select(.name == "deploy") | .conclusion')
              [ "$deploy" = success ] || mode=
            fi
          else
            pr=${PR:-$(gh api "repos/$repo/pulls?state=open&head=$OWNER:$BRANCH" --jq '.[0].number // empty')}
            mode=${pr:+pr}
          fi
          # A PR's only while it is open: this run may have waited behind
          # others until after it was merged or closed. Only for the PR's
          # head: a run of an older commit (a job of it re-run, a run that
          # waited) would cancel the head's shots in the same concurrency
          # group and publish the older commit's over them. And its base:
          # the iPhone's are taken only for a PR into main.
          base=
          if [ "$mode" = pr ]; then
            read -r state base headsha < <(gh api "repos/$repo/pulls/$pr" --jq '"\(.state) \(.base.ref) \(.head.sha)"')
            if [ "$state" != open ]; then
              echo "#$pr is $state: nothing to take"
              mode=
            elif [ -n "$headsha" ] && [ "$headsha" != "$SHA" ]; then
              echo "#$pr is at ${headsha:0:7} now, not ${SHA:0:7}: nothing to take"
              mode=
            fi
          fi
          made=
          if [ "$WORKFLOW" = build ] && [ "$ACTION" = completed ] && [ "$mode" = release ]; then
            made=$(gh api "repos/$repo/actions/runs/$RUN/artifacts" --paginate --jq '.artifacts[] | select(.expired | not) | .name')
          fi
          # Every app with shots, and of those what this run built: an APK
          # in build's run; each iPhone app whose hash moved once ios ends,
          # and every desktop window as build starts, as nix has it.
          if [ -n "$mode" ]; then
            for a in $(jq -r '.android[]' "$RUNNER_TEMP/apps.json"); do
              shots "$a" || continue
              # Main's: what the ended run built. A PR's: every app, from the
              # run's start, each waiting for its APK (or for none).
              if [ "$WORKFLOW" = build ] && [ "$ACTION" = completed ] && [ "$mode" = release ] && grep -qx "apk-$a" <<< "$made"; then android="$android $a"; fi
              if [ "$WORKFLOW" = build ] && [ "$ACTION" = requested ] && [ "$mode" = pr ]; then android="$android $a"; fi
            done
            # The iPhone's only for main and for a pull request into main: a
            # Mac is the scarce runner, and a piece of work merged into a
            # larger branch is shot again when that branch's pull request
            # runs. Android's and the desktop's (Linux) are shot for every
            # one. And only of a branch of this repository's: a fork's flake
            # is not even evaluated.
            if [ "$WORKFLOW" = ios ] && [ "$ACTION" = completed ] && [ "$HEAD_REPO" = "$repo" ] && { [ "$mode" != pr ] || [ "$base" = main ]; }; then
              # shellcheck disable=SC2046
              iphone $(iphones)
            fi
            for a in $(jq -r '.desktop[]' "$RUNNER_TEMP/apps.json"); do
              if [ "$WORKFLOW" = build ] && [ "$ACTION" = requested ] && desktop "$a"; then desktop="$desktop $a"; fi
            done
          fi
          said

  # A job per app, at once: each its own emulator.
  android:
    needs: which
    if: needs.which.outputs.mode != '' && needs.which.outputs.android != ''
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.which.outputs.android-json) }}
        # Each theme on an emulator of its own: a light run and a dark run
        # at once rather than one after the other (harken's was eight
        # minutes of its ten). Their captures meet in the same
        # <app>/android/ (merge-multiple), whole when both are there.
        theme: [light, dark]
        # The phone (a Pixel 7), a Pixel Tablet in landscape, and a Pixel
        # Fold open and then folded (apps-android.sh): the same APK, driver
        # and shots on each, each its own job. The tablet and the Fold were
        # one job, one emulator after the other, to pay one nix, one server
        # and one wait for the APK; that job was the longest of a run
        # (harken's 16.7 minutes in app-screens 42728322097, the Fold's 10.3
        # after the tablet's 5.1), and those are a minute or two each.
        device: [phone, tablet, fold]
    name: android (${{ matrix.app }}, ${{ matrix.theme }}, ${{ matrix.device }})
    runs-on: ubuntu-latest
    # One of each app's at a time on a branch: a newer commit's (or the
    # same commit's again, from another event: on main both a script
    # change and build) takes over from the one going.
    concurrency:
      group: app-screens-android-${{ github.event.workflow_run.head_branch || github.ref_name }}-${{ matrix.app }}-${{ matrix.theme }}-${{ matrix.device }}
      cancel-in-progress: true
    timeout-minutes: 90
    env:
      APPS: ${{ matrix.app }}
      THEMES: ${{ matrix.theme }}
      # A run still going: its APK awaited (await-apk.sh), not downloaded.
      EARLY: ${{ github.event.action == 'requested' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # In the background: nothing needs the room until the emulator does.
      - name: Free disk space
        run: nohup sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost > /dev/null 2>&1 &

      # The APKs the run built — what F-Droid offers, or the PR's — each in
      # apk-<app>/; with no run, each as the F-Droid repository offers it.
      - if: env.RUN != '' && env.EARLY != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: ${{ runner.temp }}/apk
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}
      - if: env.RUN == ''
        run: bash .github/screens/published.sh android "$RUNNER_TEMP/apk" $APPS
        env:
          GH_TOKEN: ${{ github.token }}
          # A dry run: the APKs build made at the branch's commit, where it made any.
          COMMIT: ${{ inputs.dry == true && github.sha || '' }}

      # The app's server, as nix builds it (its server.sh): the cache's,
      # which build.yaml's own build of the servers fills, or else built,
      # under the system image's download and the emulator's boot; waited
      # for only once the emulator is up.
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://k2on.cachix.org
            extra-trusted-public-keys = k2on.cachix.org-1:oI4Db0uW5ER+s4Te/MrXSmjWUWkOc9rmKdzsgUDxQP8=

      # What it builds (the server and its seed, when build.yaml's have not
      # landed yet) to the cache, for the next job: only of this
      # repository's run. A fork's APK runs in this job, so a fork's never
      # holds the token (see the top).
      - if: env.SAME_REPO == 'true' && vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Start the server
        run: |
          bash .github/screens/meanwhile.sh start servers bash -c '
            for a in $APPS; do
              if [ -f "$a/screens/server.sh" ]; then bash .github/screens/app-server.sh "$a" "$RUNNER_TEMP/server/$a"; fi
            done'

      # As screens.yaml, with its retries.
      - name: The system image
        run: |
          sdk=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          image='system-images;android-34;google_apis;x86_64'
          for try in 1 2 3 4; do
            if yes 2>/dev/null | "$sdk" --install "$image" --channel=0 > /dev/null &&
              [ -f "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/system.img" ]; then
              exit 0
            fi
            echo "::warning::system image, try $try failed"
            "$sdk" --uninstall "$image" > /dev/null || true
            sleep $((try * 10))
          done
          exit 1

      # Each app in turn (app-android.sh); one that fails is said, and the
      # others still taken. One line: the action runs each line of `script`
      # as its own command.
      - name: Capture
        if: matrix.device == 'phone'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The emulator boots first, under the APK's build; then the APK,
          # if the run is still making it (none: apps-android.sh skips it).
          script: bash .github/screens/meanwhile.sh wait servers && { [ "$EARLY" != true ] || bash .github/screens/await-apk.sh "$RUN" "$APPS" "$RUNNER_TEMP/apk" || [ $? = 3 ]; } && RESULTS="$RUNNER_TEMP/steps" bash .github/screens/apps-android.sh "$RUNNER_TEMP/out" "$RUNNER_TEMP/apk" $APPS

      # The larger screens: the same, on a Pixel Tablet held in landscape
      # (<app>/android-tablet/), or on a Pixel Fold, open and then folded
      # (<app>/fold-unfolded/, <app>/fold-folded/), each its own job.
      - name: Capture (tablet)
        if: matrix.device == 'tablet'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          avd-name: tablet
          # Not saved at the end: nothing boots it again, and saving took fourteen seconds.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash .github/screens/meanwhile.sh wait servers && { [ "$EARLY" != true ] || bash .github/screens/await-apk.sh "$RUN" "$APPS" "$RUNNER_TEMP/apk" || [ $? = 3 ]; } && DEVICE=tablet RESULTS="$RUNNER_TEMP/steps" bash .github/screens/apps-android.sh "$RUNNER_TEMP/out" "$RUNNER_TEMP/apk" $APPS
      # The Fold's hardware profile, as this runner's avdmanager has it: the
      # Pixel Fold's own where it is listed, else the emulator's 7.6-inch
      # foldable, the Pixel Fold's inner screen, which folds the same way
      # (the runner's command-line tools have had only that one).
      - id: fold
        if: matrix.device == 'fold'
        name: The Fold's profile
        run: |
          ids=$("$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list device -c)
          if grep -qx pixel_fold <<< "$ids"; then
            echo "profile=pixel_fold" >> "$GITHUB_OUTPUT"; echo "name=Pixel Fold" >> "$GITHUB_OUTPUT"
          else
            profile=$(grep -x '7.6in Foldable' <<< "$ids" || grep -i -m1 'foldable' <<< "$ids" || true)
            echo "profile=$profile" >> "$GITHUB_OUTPUT"; echo "name=$profile" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - name: Capture (Fold)
        if: matrix.device == 'fold' && steps.fold.outputs.profile != ''
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FOLD_NAME: ${{ steps.fold.outputs.name }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ steps.fold.outputs.profile }}
          avd-name: fold
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash .github/screens/meanwhile.sh wait servers && { [ "$EARLY" != true ] || bash .github/screens/await-apk.sh "$RUN" "$APPS" "$RUNNER_TEMP/apk" || [ $? = 3 ]; } && DEVICE=fold RESULTS="$RUNNER_TEMP/steps" bash .github/screens/apps-android.sh "$RUNNER_TEMP/out" "$RUNNER_TEMP/apk" $APPS

      - name: The servers' logs
        if: always()
        run: tail -n 40 "$RUNNER_TEMP"/server/*/server.log || true

      # The screen after each step of each shot: what to read when a shot
      # is not what its steps say.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-steps-${{ matrix.app }}-${{ matrix.theme }}-${{ matrix.device }}
          path: ${{ runner.temp }}/steps
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screens-android-${{ matrix.app }}-${{ matrix.theme }}-${{ matrix.device }}
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore

  # The Macs: a job per app and device, at once (`which`'s ios-matrix):
  # each app's iPhone, its iPad (upright and on its side, signed in once)
  # when its build takes it, and its Mac window when the commit has one.
  # One Mac did them all in turn, the iPad's after every iPhone's, so the
  # loop waited for the sum (an iPhone app's shots some five minutes, an
  # iPad's some ten); each job now pays its own nix, servers and boot (a
  # few minutes, under which the app and the driver come from the cache)
  # and the loop waits for the longest. Each job's
  # shots are its <app>/<device dir>/ in an artifact of its own; whether
  # they were taken whole is its `ios-status-*` artifact, which
  # `ios-inputs` reads to keep an app's hash only when every job of it was.
  ios:
    needs: which
    # Built from the run's own commit, so only a run of this repository's.
    if: >-
      needs.which.outputs.mode != '' && needs.which.outputs.ios != '' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.which.outputs.ios-matrix) }}
    name: ios (${{ matrix.app }}, ${{ matrix.device }})
    runs-on: macos-15
    # One of each at a time on a branch: a newer commit's (or the same
    # commit's again, from another event: on main a push that moves the
    # scripts and starts ios) takes over from the one going, rather than a
    # second Mac.
    concurrency:
      group: app-screens-ios-${{ needs.which.outputs.branch }}-${{ matrix.app }}-${{ matrix.device }}
      cancel-in-progress: true
    timeout-minutes: 150
    # It builds the commit's code, one step of it outside nix's sandbox
    # (flake.nix, `iosSimulator`): it can read and nothing more. What it
    # builds goes to the cache, as it runs only for this repository's code.
    permissions:
      contents: read
      pull-requests: read
    env:
      APPS: ${{ matrix.app }}
      DEVICE: ${{ matrix.device }}
      SOURCE: ${{ needs.which.outputs.sha }}
      PR: ${{ needs.which.outputs.pr }}
    steps:
      # The queue for a Mac can be an hour: a PR merged or closed meanwhile
      # is taken nothing of. Every step after says `open`, so the job ends
      # here, in seconds and not failed.
      - id: open
        name: The pull request, still open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=true
          if [ -n "$PR" ]; then
            # Not known (the API not answering): taken, as before it asked.
            read -r state head < <(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '"\(.state) \(.head.sha)"') || state=open
            if [ "$state" != open ]; then
              open=false
              echo "::notice::#$PR is $state now: nothing taken"
            elif [ -n "$head" ] && [ "$head" != "$SHA" ]; then
              # A newer commit came while this one waited for a runner:
              # its own run takes its shots, and these would be stale.
              open=false
              echo "::notice::#$PR is at ${head:0:7} now, not ${SHA:0:7}: nothing taken"
            fi
          fi
          echo "open=$open" >> "$GITHUB_OUTPUT"
          # The driver (app-ios.sh), nix's, under the boot; and each app any of whose shots failed (apps-ios.sh,
          # apps-mac.sh), for which no hash is kept.
          { echo "DRIVER=$RUNNER_TEMP/driver"; echo "PARTIAL=$RUNNER_TEMP/partial"; } >> "$GITHUB_ENV"
          # What `ios-inputs` reads: closed, or (below) whole or partial.
          mkdir -p "$RUNNER_TEMP/status/$APPS"
          [ "$open" = true ] || echo closed > "$RUNNER_TEMP/status/$APPS/$DEVICE"

      # The scripts, main's; and the commit whose apps are built, beside them.
      - if: steps.open.outputs.open == 'true'
        uses: actions/checkout@v4
      - if: steps.open.outputs.open == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          path: src
          persist-credentials: false

      # The Xcode the flake pins (flake.nix, `xcode`): its simulators boot
      # here, and if an app must be built, it is put in the store as it is.
      - if: steps.open.outputs.open == 'true'
        name: The pinned Xcode
        run: bash .github/xcode-pinned.sh src

      # Relaxed: every build is sandboxed but the one that says __noChroot
      # (the app's own xcodebuild, flake.nix says why). Its build users
      # are set up before the servers' and the apps' builds start.
      - if: steps.open.outputs.open == 'true'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            sandbox = relaxed
            extra-substituters = https://k2on.cachix.org
            extra-trusted-public-keys = k2on.cachix.org-1:oI4Db0uW5ER+s4Te/MrXSmjWUWkOc9rmKdzsgUDxQP8=
            ${{ env.XCODE_NIX_CONF }}

      # Its builds go to the cache — the servers and seeds for this Mac, the
      # kernel's and the app's crates — from main's run, a PR's of a branch
      # here and a run by hand alike (the job's `if` already refuses a fork's;
      # SAME_REPO says so again where the token is): the next run on any
      # branch fetches what has not moved rather than spend most of an hour
      # compiling it. Xcode never (Apple's licence).
      - if: steps.open.outputs.open == 'true' && env.SAME_REPO == 'true' && vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: "[Xx]code([^Gg]|$)"

      # The servers' packages (each server.sh's `.#<name>`) and the app
      # (ios-build.sh's), evaluated once, with nothing beside them: under the
      # servers' build, each evaluating a flake at once, it took one to five
      # minutes. Their builds then find them in nix's evaluation cache.
      - if: steps.open.outputs.open == 'true'
        name: The servers' packages and the apps, evaluated
        run: |
          refs=()
          for a in $APPS; do
            if [ -f "$a/screens/server.sh" ]; then
              while read -r p; do refs+=(".#$p"); done < <(grep -o '\.#[A-Za-z0-9_-]*' "$a/screens/server.sh" | cut -c3- | sort -u)
            fi
          done
          start=$(date +%s)
          # A dry run: a package may be a source path, not a derivation
          # (harken-covers), which `path-info --derivation` refuses. Only a
          # warm-up: what fails here is said again by the build after.
          if [ ${#refs[@]} -gt 0 ]; then nix build --dry-run "${refs[@]}" 2> /dev/null || echo "::warning::the servers' packages did not all evaluate"; fi
          echo "evaluated ${refs[*]} in $(( $(date +%s) - start ))s"
          # An app the commit has none of is said by ios-build.sh. The Mac's
          # window is built by apps-mac.sh.
          if [ "$DEVICE" != mac ]; then
            start=$(date +%s)
            for a in $APPS; do
              nix build --dry-run "git+file://$PWD/src#packages.aarch64-darwin.$a-ios-simulator" 2> /dev/null || true
            done
            echo "evaluated the apps in $(( $(date +%s) - start ))s"
          fi

      # The simulator, booting under the servers', the driver's and the
      # app's fetch: only once nix is installed and the packages evaluated,
      # which a booting simulator (CoreSimulator coming up) slowed from
      # seconds to minutes (nix's install 0.5 -> 1.6, cachix's 0.1 -> 4.8,
      # the evaluation 0.6 -> 2.2, app-screens 42820636768).
      # The newest iPhone Pro, or the newest iPad Pro 13-inch (else an iPad
      # Air 13-inch, else the newest iPad); none for the Mac's window.
      - if: steps.open.outputs.open == 'true' && matrix.device != 'mac'
        name: Start booting a simulator
        run: |
          bash .github/screens/meanwhile.sh start boot bash -c '
            if [ "$DEVICE" = ipad ]; then kinds="[\"^iPad Pro 13-inch\", \"^iPad Air 13-inch\", \"^iPad\"]"; else kinds="[\"^iPhone [0-9]+ Pro$\"]"; fi
            read -r udid name < <(xcrun simctl list devices available -j | jq -r --argjson k "$kinds" "
              .devices | to_entries | map(select(.key | test(\"iOS\"))) | sort_by(.key) | last | .value as \$d
              | \$k | map(. as \$p | \$d | map(select(.name | test(\$p))) | sort_by(.name) | last) | map(select(. != null)) | first
              | \"\(.udid) \(.name)\"")
            echo "Booting $name ($udid)"
            echo "$name" > "$RUNNER_TEMP/device"
            start=$(date +%s)
            xcrun simctl boot "$udid" && xcrun simctl bootstatus "$udid" -b > /dev/null
            echo "booted in $(( $(date +%s) - start ))s"'

      # The app's server, as nix builds it (its server.sh): the cache's
      # once main's run has pushed it, or else built, under the app's build.
      - if: steps.open.outputs.open == 'true'
        name: Start the servers
        run: |
          bash .github/screens/meanwhile.sh start servers bash -c '
            for a in $APPS; do
              if [ -f "$a/screens/server.sh" ]; then bash .github/screens/app-server.sh "$a" "$RUNNER_TEMP/server/$a"; fi
            done'

      # The UI test that drives the apps (drive-ios/), as nix builds it with
      # the pinned Xcode (flake.nix, `screens-drive-ios`), from the scripts'
      # checkout: the cache's, built once per change to its sources, or
      # built here under the boot. XcodeGen from the flake, as every other
      # tool here (no Homebrew), for app-ios.sh should the driver not build.
      # Not for the Mac's window, which it does not drive.
      - if: steps.open.outputs.open == 'true' && matrix.device != 'mac'
        name: The driver, and its tools
        run: |
          bash .github/screens/meanwhile.sh start driver bash -c '
            line=$(bash .github/nix-xcode.sh . "$XCODE" screens-drive-ios) || exit 1
            mkdir -p "$DRIVER"
            cp -R "${line#* }"/. "$DRIVER/"
            chmod -R u+w "$DRIVER"
            ls "$DRIVER"'
          bash .github/screens/tools.sh get xcodegen

      # The app as nix has it at the commit (ios-build.sh): the cache's
      # (what ios built and pushed, as this run starts once it has ended),
      # or built. The Mac's window is built by apps-mac.sh.
      - if: steps.open.outputs.open == 'true' && matrix.device != 'mac'
        id: build
        name: The apps, built by nix
        run: bash .github/screens/ios-build.sh src "$XCODE" "$RUNNER_TEMP/apps" $APPS

      - if: steps.open.outputs.open == 'true'
        name: The servers
        run: bash .github/screens/meanwhile.sh wait servers

      - if: steps.open.outputs.open == 'true' && matrix.device != 'mac'
        name: The driver, and the simulator, booted
        run: |
          # Built here if nix could not: app-ios.sh builds it then.
          bash .github/screens/meanwhile.sh wait driver || echo "::warning::the driver from nix failed; app-ios.sh builds it"
          bash .github/screens/meanwhile.sh wait boot

      # The iPhone's: the app on the one simulator (apps-ios.sh).
      - if: steps.open.outputs.open == 'true' && matrix.device == 'iphone'
        name: Capture
        env:
          RESULTS: ${{ runner.temp }}/results
        run: bash .github/screens/apps-ios.sh "$RUNNER_TEMP/out" "$RUNNER_TEMP/apps" "$(cat "$RUNNER_TEMP/device")" $APPS

      # The iPad's: the app, if its build takes it (ios-family.sh), upright
      # and then on its side, light and dark, on the same driver
      # (apps-ios.sh, FAMILY=ipad); else said, and nothing taken.
      - if: steps.open.outputs.open == 'true' && matrix.device == 'ipad'
        name: Capture (iPad)
        env:
          RESULTS: ${{ runner.temp }}/results
          FAMILY: ipad
        run: |
          if [ -z "$(bash .github/screens/ios-family.sh "$RUNNER_TEMP/apps" "$APPS")" ]; then
            echo "$APPS: its build does not take the iPad; nothing taken"
            exit 0
          fi
          bash .github/screens/apps-ios.sh "$RUNNER_TEMP/out" "$RUNNER_TEMP/apps" "$(cat "$RUNNER_TEMP/device")" $APPS

      # The Mac's own window, of an app whose commit has a Mac build
      # (`<app>-macos`, apps-mac.sh): signed in to the same server.
      - if: steps.open.outputs.open == 'true' && matrix.device == 'mac'
        name: Capture (Mac)
        run: bash .github/screens/apps-mac.sh "$RUNNER_TEMP/out" src $APPS

      # Whether this job's shots were taken whole, for `ios-inputs`: a
      # failed build or shot, or the iPhone's not there in both themes, is
      # partial, and no hash is kept for the app (it is taken again).
      - if: always() && steps.open.outputs.open == 'true'
        name: Taken whole?
        run: |
          state=whole
          if [ -f "$PARTIAL" ] && grep -qx "$APPS" "$PARTIAL"; then state=partial; fi
          if [ "${{ steps.build.outcome }}" = failure ]; then state=partial; fi
          case "${{ job.status }}" in success) ;; *) state=partial ;; esac
          at=$RUNNER_TEMP/out/$APPS/ios
          if [ "$DEVICE" = iphone ] && ! { [ -f "$at/device.json" ] && [ -d "$at/light" ] && [ -d "$at/dark" ]; }; then state=partial; fi
          echo "$state" > "$RUNNER_TEMP/status/$APPS/$DEVICE"
          echo "$APPS $DEVICE: $state"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-status-${{ matrix.app }}-${{ matrix.device }}
          path: ${{ runner.temp }}/status

      # The driver's results (its log, and the test's recording of the
      # screen), when a capture failed: what to look at.
      - uses: actions/upload-artifact@v4
        if: failure() && steps.open.outputs.open == 'true'
        with:
          name: ios-driver-results-${{ matrix.app }}-${{ matrix.device }}
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore

      - if: always() && steps.open.outputs.open == 'true'
        name: The servers' logs
        run: tail -n 40 "$RUNNER_TEMP"/server/*/server.log || true

      # Its shots, <app>/ios/ (or ipad-portrait/ and ipad-landscape/, or
      # mac/): compare and publish lay the app-screens-* artifacts over each
      # other as one tree.
      - uses: actions/upload-artifact@v4
        if: always() && steps.open.outputs.open == 'true'
        with:
          name: app-screens-ios-${{ matrix.app }}-${{ matrix.device }}
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore

  # Beside each iPhone app's shots, when every Mac job of it took them
  # whole, the hash of what they were taken from (`which`, ios-inputs.sh):
  # the next run that has the same takes none. One taken in part keeps
  # none, and is taken again. And whether a Mac found its PR gone, for
  # `compare`.
  ios-inputs:
    needs: [which, ios]
    if: ${{ always() && needs.ios.result != 'skipped' && needs.which.outputs.ios != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      # `false` when its PR had been merged or closed (or moved on) by the
      # time a Mac took it up: nothing was taken, and nothing is compared.
      open: ${{ steps.kept.outputs.open }}
    env:
      APPS: ${{ needs.which.outputs.ios }}
      INPUTS: ${{ needs.which.outputs.ios-inputs }}
      MATRIX: ${{ needs.which.outputs.ios-matrix }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ios-status-*
          merge-multiple: true
          path: ${{ runner.temp }}/status
      - id: kept
        name: What each app's shots were taken from
        run: |
          open=true
          for a in $APPS; do
            hash=$(jq -r --arg a "$a" '.[$a] // empty' <<< "$INPUTS")
            whole=true
            for d in $(jq -r --arg a "$a" '.[] | select(.app == $a) | .device' <<< "$MATRIX"); do
              s=$(cat "$RUNNER_TEMP/status/$a/$d" 2> /dev/null || echo missing)
              [ "$s" != closed ] || open=false
              [ "$s" = whole ] || { echo "$a $d: $s"; whole=false; }
            done
            if [ "$whole" = true ] && [ -n "$hash" ]; then
              mkdir -p "$RUNNER_TEMP/out/$a/ios"
              echo "$hash" > "$RUNNER_TEMP/out/$a/ios/inputs"
              echo "$a: $hash"
            else
              echo "$a: not taken whole; no hash kept"
            fi
          done
          echo "open=$open" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: app-screens-ios-inputs
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore

  # The desktop windows: each app's built by nix at the run's commit, as the
  # iPhone's are, and photographed with no window (arkui-shots) on Linux.
  desktop:
    needs: which
    # Built from the run's own commit and then run, so only a run of this
    # repository's.
    if: >-
      needs.which.outputs.mode != '' && needs.which.outputs.desktop != '' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.which.outputs.desktop-json) }}
    name: desktop (${{ matrix.app }})
    runs-on: ubuntu-latest
    # As the phones': one of each app's at a time on a branch.
    concurrency:
      group: app-screens-desktop-${{ github.event.workflow_run.head_branch || github.ref_name }}-${{ matrix.app }}
      cancel-in-progress: true
    timeout-minutes: 90
    # It builds the commit's code and runs it: it can read and nothing
    # more. What it builds (the window, and nothing build.yaml builds) goes
    # to the cache, as it runs only for this repository's code.
    permissions:
      contents: read
    env:
      APPS: ${{ matrix.app }}
      SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # The scripts, main's; and the commit whose windows are built, beside them.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          path: src
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://k2on.cachix.org
            extra-trusted-public-keys = k2on.cachix.org-1:oI4Db0uW5ER+s4Te/MrXSmjWUWkOc9rmKdzsgUDxQP8=

      # The window to the cache: the next commit's, and main's once this
      # is merged, fetch it rather than compile iced and wgpu again.
      - if: env.SAME_REPO == 'true' && vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The app's server, as nix builds it (its server.sh), under the window's build.
      - name: Start the server
        run: |
          bash .github/screens/meanwhile.sh start servers bash -c '
            for a in $APPS; do
              if [ -f "$a/screens/server.sh" ]; then bash .github/screens/app-server.sh "$a" "$RUNNER_TEMP/server/$a"; fi
            done'

      # Each window as nix has it at the commit (desktop-build.sh): the
      # cache's when its inputs have not moved, or built.
      - name: The windows, built by nix
        # One that fails is said; the others are still taken.
        continue-on-error: true
        run: bash .github/screens/desktop-build.sh ./src "$RUNNER_TEMP/windows" $APPS

      - name: The server
        run: bash .github/screens/meanwhile.sh wait servers

      # With no window and no GPU: wgpu on Mesa's lavapipe (app-desktop.sh).
      - name: Capture
        run: bash .github/screens/apps-desktop.sh "$RUNNER_TEMP/out" "$RUNNER_TEMP/windows" $APPS

      - name: The servers' logs
        if: always()
        run: tail -n 40 "$RUNNER_TEMP"/server/*/server.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screens-desktop-${{ matrix.app }}
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore

  # Main's, onto the `screens` branch: each app and phone taken whole this
  # run replaced, the rest as it was.
  publish:
    needs: [which, android, ios, ios-inputs, desktop]
    if: ${{ !cancelled() && needs.which.outputs.mode == 'release' && inputs.dry != true }}
    runs-on: ubuntu-latest
    # One writer of the branch at a time, with screens.yaml's publish.
    concurrency:
      group: screens-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: app-screens-*
          merge-multiple: true
          path: ${{ runner.temp }}/new
      - name: Lay out the branch
        run: |
          branch="$RUNNER_TEMP/branch"
          mkdir -p "$branch"
          if git fetch --depth 1 origin screens; then
            git --work-tree="$branch" checkout FETCH_HEAD -- .
          fi
          bash .github/screens/apps-lay.sh "$RUNNER_TEMP/new" "$branch/apps"
          shopt -s nullglob
          for a in "$branch"/apps/*/; do
            python3 -I .github/screens/manifest.py "$a" "${{ github.run_id }}" "$SHA"
          done
      # Pillow and Inter from the flake's nixpkgs, as every tool these jobs use.
      - uses: DeterminateSystems/nix-installer-action@main
      # The README's heroes, from the captures just laid out: each app with a
      # `hero` in its shots.json gets apps/<app>/hero-{light,dark}.png.
      - name: Draw the heroes
        run: |
          branch="$RUNNER_TEMP/branch"
          py=$(nix build --no-link --print-out-paths .#screens-python)
          inter=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#inter)
          for shots in */screens/shots.json; do
            app=${shots%%/*}
            [ -d "$branch/apps/$app" ] || continue
            "$py/bin/python3" -I .github/screens/hero.py "$shots" "$branch/apps/$app" "$inter/share/fonts/truetype/Inter.ttc"
          done
      - name: Publish
        working-directory: ${{ runner.temp }}/branch
        run: |
          git init -q -b screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "app screens from $SHA"
          # Tried again, as compare's: GitHub now and then refuses a push.
          for try in 1 2 3 4; do
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screens && break
            [ "$try" != 4 ] || exit 1
            echo "::warning::the push, try $try failed"
            sleep $((try * 20))
          done

  # A PR's, compared with main's and shown on the PR.
  compare:
    needs: [which, android, ios, ios-inputs, desktop]
    # Only when this run took something: a run with no build of its own says
    # nothing. Nor one whose PR had gone by the time the iPhone's Mac came.
    if: ${{ !cancelled() && needs.which.outputs.mode == 'pr' && needs.ios-inputs.outputs.open != 'false' && (needs.which.outputs.android != '' || needs.which.outputs.ios != '' || needs.which.outputs.desktop != '') }}
    runs-on: ubuntu-latest
    # The PR's comment and its branch, one run at a time.
    concurrency:
      group: app-screens-pr-${{ needs.which.outputs.pr }}
      cancel-in-progress: false
    env:
      PR: ${{ needs.which.outputs.pr }}
      # The commit taken: the run's, or by hand the PR's head.
      SHA: ${{ needs.which.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Still open, as `which` found it? The phones' jobs can take long
      # enough for it to be merged or closed meanwhile: then its branch and
      # its comment are left as they are.
      - id: open
        name: The pull request, still open
        run: |
          read -r state head < <(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '"\(.state) \(.head.sha)"') || state=open
          # Not compared or published once the PR has a newer commit: its own run does that.
          if [ "$state" = open ] && [ -n "$head" ] && [ "$head" != "$SHA" ]; then state=moved; fi
          [ "$state" = open ] || echo "::notice::#$PR is $state now (${head:0:7}, not ${SHA:0:7}): nothing compared"
          echo "open=$([ "$state" = open ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.open.outputs.open == 'true'
        uses: actions/checkout@v4
      # ImageMagick from the flake's nixpkgs, as every tool these jobs use, not the image's apt.
      - if: steps.open.outputs.open == 'true'
        uses: DeterminateSystems/nix-installer-action@main
      - if: steps.open.outputs.open == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: app-screens-*
          merge-multiple: true
          path: ${{ runner.temp }}/new
      - if: steps.open.outputs.open == 'true'
        name: Compare, and keep the images on the PR's branch
        run: |
          PATH="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#imagemagick)/bin:$PATH"
          main="$RUNNER_TEMP/main"
          mkdir -p "$main"
          ref=screens
          if git fetch --depth 1 origin screens; then
            ref=$(git rev-parse FETCH_HEAD)
            git --work-tree="$main" checkout FETCH_HEAD -- . 2>/dev/null || true
          fi
          # What the PR's branch has from the other workflow's run (build's
          # Android and desktop, ios's iOS), with this run's laid over it.
          keep="$RUNNER_TEMP/pr"
          mkdir -p "$keep"
          if git fetch --depth 1 origin "screens-pr-$PR"; then git --work-tree="$keep" checkout FETCH_HEAD -- . 2>/dev/null || true; fi
          bash .github/screens/apps-lay.sh "$RUNNER_TEMP/new" "$keep"
          python3 -I .github/screens/compare.py "$main/apps" "$keep" "${{ github.repository }}" "$ref" "screens-pr-$PR" "$SHA" > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md"
          cd "$keep"
          git init -q -b "screens-pr-$PR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "app screens for #$PR at $SHA"
          # Tried again: GitHub now and then refuses a push outright ("fatal
          # error in commit_refs"), and the shots behind it took a Mac.
          for try in 1 2 3 4; do
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "screens-pr-$PR" && break
            [ "$try" != 4 ] || exit 1
            echo "::warning::the push, try $try failed"
            sleep $((try * 20))
          done
      - if: steps.open.outputs.open == 'true'
        name: The PR's comment
        run: |
          body="$RUNNER_TEMP/comment.md"
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- app-screens -->"))) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@"$body" > /dev/null
          else
            gh api "repos/${{ github.repository }}/issues/$PR/comments" -F body=@"$body" > /dev/null
          fi
