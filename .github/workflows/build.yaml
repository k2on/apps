# Everything a push to main publishes, in one run: the browser peer at
# https://k2on.github.io/apps/harken/ and the Android apps' F-Droid repository
# at https://k2on.github.io/apps/fdroid/repo, harken's and Revelation's
# (revelation/, plain Kotlin and none of ArkDB). A `v*` tag builds the APKs
# alone and attaches them to a release.
#
# `web`, `checks`, `apk` (harken) and `revelation-apk` build in parallel and
# `deploy` publishes once, after the page and both APKs. They used to be two
# workflows, apk.yml and pages.yml, with pages.yml running again when apk.yml
# finished: every push deployed twice and built the browser peer twice.
#
# A build is skipped when its inputs have not moved. Each job hashes the files
# its nix derivation reads (the flake's source filters: `rustDirs` for the
# page; the Rust workspace, harken's domain and ffi crates and the Android
# app for harken's APK, which embeds the kernel through harken/ffi; the app
# alone for Revelation's) and asks the actions cache whether that hash was
# built before. The page's output is the cache entry, so a hit restores it in
# seconds. An APK's version code is the commit time, so its derivation moves
# on every commit even when nothing in it did: a hit there means "this APK
# was already published", and the repository keeps offering it rather than
# gaining a copy under a new number.
#
# The nix store comes from Cachix when the repository variable CACHIX_NAME is
# set (with the secret CACHIX_AUTH_TOKEN to push): every path is pushed once by
# its hash and substituted after, so aapt2, the toolchains and an unchanged
# browser peer are never built twice. Until then, nix-community/cache-nix-action
# keeps the store in GitHub's actions cache as before (10 GB per repository).
# The Android SDK is Google's and its licence does not allow redistributing
# it, so it is never pushed to Cachix; the APK jobs keep it in the actions
# cache either way.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # A tag's release is created with GITHUB_TOKEN.
  contents: write
  pages: write
  id-token: write
  # cache-nix-action deletes the caches it superseded.
  actions: write

# A newer push supersedes a run still building; deploys are serialised below.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The page's inputs: the Rust workspace and harken's crates (the flake's
      # `rustDirs`), and the flake itself.
      - id: built
        uses: actions/cache@v4
        with:
          path: web-out
          key: harken-web-${{ hashFiles('rust/**', 'harken/domain/**', 'harken/player/**', 'harken/server/**', 'harken/iced/**', 'harken/ffi/**', 'flake.nix', 'flake.lock') }}

      - if: steps.built.outputs.cache-hit != 'true'
        uses: DeterminateSystems/nix-installer-action@main

      - if: steps.built.outputs.cache-hit != 'true' && vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - if: steps.built.outputs.cache-hit != 'true' && vars.CACHIX_NAME == ''
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-web-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust/Cargo.lock') }}
          restore-prefixes-first-match: nix-web-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-web-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build the browser peer
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          nix build .#harken-web --print-build-logs
          cp -rL result web-out
          chmod -R u+w web-out

      - uses: actions/upload-artifact@v4
        with:
          name: harken-web
          path: web-out
          if-no-files-found: error

  # The flake's Linux checks. Each is a few test runs over one shared
  # build of the workspace (flake.nix: crane's layers), so building them
  # all costs about one workspace build; with Cachix the dependency layer
  # is substituted and only the workspace and its tests are compiled.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - if: vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the checks
        run: |
          nix build --print-build-logs --no-link \
            .#checks.x86_64-linux.fmt .#checks.x86_64-linux.clippy \
            .#checks.x86_64-linux.rust .#checks.x86_64-linux.ffi \
            .#checks.x86_64-linux.traces .#checks.x86_64-linux.vectors \
            .#checks.x86_64-linux.fuzz-smoke .#checks.x86_64-linux.versions \
            .#checks.x86_64-linux.harken-domain .#checks.x86_64-linux.harken-module

  apk:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      # The APK's inputs: the kernel and harken's domain and ffi crates (the
      # app embeds them through harken-android-lib), the Android app, the
      # flake, and nix/ (aapt2, the SDK, the F-Droid tooling). Only looked
      # up here; the entry is written after a successful build, below.
      - id: seen
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/cache/restore@v4
        with:
          path: apk-seen
          key: harken-apk-${{ hashFiles('rust/**', 'harken/domain/**', 'harken/ffi/**', 'harken/android/**', 'flake.nix', 'flake.lock', 'nix/**') }}
          lookup-only: true

      # The hosted image carries ~30 GB of toolchains this build never uses;
      # the nix store, a JDK, gradle's state, the Android NDK targets and the
      # aapt2 build want the room.
      - name: Free disk space
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - if: steps.seen.outputs.cache-hit != 'true'
        uses: DeterminateSystems/nix-installer-action@main

      - if: steps.seen.outputs.cache-hit != 'true' && vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Google's SDK and the zips it is assembled from stay out of a
          # public cache (see the top of this file).
          pushFilter: "(android-sdk-for-gradle|platform-35_r01\\.zip|build-tools_r35_linux\\.zip)"

      - if: steps.seen.outputs.cache-hit != 'true'
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-apk-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**', 'rust/Cargo.lock', 'harken/android/deps.json') }}
          restore-prefixes-first-match: nix-apk-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-apk-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build aapt2 and the SDK (kept as gc roots)
        if: steps.seen.outputs.cache-hit != 'true'
        run: nix build .#aapt2 .#android-sdk --out-link "$RUNNER_TEMP/android" --print-build-logs

      # The kernel for every ABI first, so its failure reads on its own.
      - name: Build the kernel for Android
        if: steps.seen.outputs.cache-hit != 'true'
        run: nix build .#harken-android-lib --out-link "$RUNNER_TEMP/android-lib" --print-build-logs

      - name: Build the APK
        id: build
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          nix build .#harken-apk --print-build-logs
          cp result/harken.apk harken.apk

      - if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: harken-apk
          path: harken.apk
          if-no-files-found: error

      # Remember these inputs as published. Saved only once the APK exists,
      # so a failed build is tried again on the next push.
      - name: Mark these inputs as built
        if: steps.build.outcome == 'success' && !startsWith(github.ref, 'refs/tags/v')
        run: mkdir -p apk-seen && git rev-parse HEAD > apk-seen/commit
      - if: steps.build.outcome == 'success' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/cache/save@v4
        with:
          path: apk-seen
          key: ${{ steps.seen.outputs.cache-primary-key }}

  # Revelation (revelation/android): the same shape as `apk` without the
  # kernel, since the app is plain Kotlin with no native library. Its inputs
  # are the app, the flake and nix/ (aapt2, the SDK, the F-Droid tooling).
  revelation-apk:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - id: seen
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/cache/restore@v4
        with:
          path: apk-seen
          key: revelation-apk-${{ hashFiles('revelation/**', 'flake.nix', 'flake.lock', 'nix/**') }}
          lookup-only: true

      # The nix store, a JDK, gradle's state and the aapt2 build want the
      # room the hosted image's unused toolchains take.
      - name: Free disk space
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - if: steps.seen.outputs.cache-hit != 'true'
        uses: DeterminateSystems/nix-installer-action@main

      - if: steps.seen.outputs.cache-hit != 'true' && vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Google's SDK and the zips it is assembled from stay out of a
          # public cache (see the top of this file).
          pushFilter: "(android-sdk-for-gradle|platform-35_r01\\.zip|build-tools_r35_linux\\.zip)"

      - if: steps.seen.outputs.cache-hit != 'true'
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-revelation-apk-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**', 'revelation/android/deps.json') }}
          restore-prefixes-first-match: nix-revelation-apk-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-revelation-apk-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build aapt2 and the SDK (kept as gc roots)
        if: steps.seen.outputs.cache-hit != 'true'
        run: nix build .#aapt2 .#android-sdk --out-link "$RUNNER_TEMP/android" --print-build-logs

      - name: Build the APK
        id: build
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          nix build .#revelation-apk --print-build-logs
          cp result/revelation.apk revelation.apk

      - if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: revelation-apk
          path: revelation.apk
          if-no-files-found: error

      # Remember these inputs as published, once the APK exists.
      - name: Mark these inputs as built
        if: steps.build.outcome == 'success' && !startsWith(github.ref, 'refs/tags/v')
        run: mkdir -p apk-seen && git rev-parse HEAD > apk-seen/commit
      - if: steps.build.outcome == 'success' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/cache/save@v4
        with:
          path: apk-seen
          key: ${{ steps.seen.outputs.cache-primary-key }}

  # A tag is a release: both APKs, attached to it, by one job so the two
  # builds never race to create the same release. The keys are public, so
  # the APKs install anywhere and belong nowhere public
  # (harken/android/README.md).
  release:
    needs: [apk, revelation-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: harken-apk
          path: apks
      - uses: actions/download-artifact@v4
        with:
          name: revelation-apk
          path: apks
      - uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true

  deploy:
    needs: [web, apk, revelation-apk]
    # A failed APK does not hold the page back: the site goes up with the
    # repository as it was, plus whichever APK did build.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    # One deployment at a time; a deploy in flight finishes before the next.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: harken-web
          path: _site/harken

      - if: needs.apk.outputs.built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: harken-apk
          path: ${{ runner.temp }}/apk

      - if: needs.revelation-apk.outputs.built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: revelation-apk
          path: ${{ runner.temp }}/apk

      - uses: DeterminateSystems/nix-installer-action@main

      - if: vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The phones' F-Droid repository, one for both apps
      # (harken/android/fdroid/README.md).
      #
      # Pages deploys the site whole, so the versions the live repository
      # already offers are fetched back and kept, of each app the newest
      # three by version code, and the index is signed again over all of
      # them: with the committed key, or with FDROID_KEYSTORE when that
      # secret is set (nix/fdroid.nix says why). An app with no new APK (its
      # inputs had not moved, or its build failed) is offered as it was.
      #
      # Nothing here fails the deploy. No APK anywhere, the live repository
      # unreachable, or fdroid itself failing, and the site goes up without
      # fdroid/, saying so.
      - name: Lay out the F-Droid repository
        env:
          FDROID_KEYSTORE: ${{ secrets.FDROID_KEYSTORE }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: |
          shopt -s nullglob
          apks=("$RUNNER_TEMP"/apk/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::notice::No new APK in this run; the F-Droid repository offers what it already had."
          fi
          if [ -z "$FDROID_KEYSTORE" ]; then
            echo "Signing the F-Droid index with the committed key; FDROID_KEYSTORE is not set."
          fi
          if nix run .#apps-fdroid -- repo --keep https://k2on.github.io/apps/fdroid/repo \
            "$RUNNER_TEMP/fdroid" "${apks[@]}"; then
            mkdir -p _site/fdroid
            cp -r "$RUNNER_TEMP/fdroid" _site/fdroid/repo
          else
            echo "::warning::No F-Droid repository in this deploy; the site goes up without fdroid/."
          fi

      - name: Assemble the site
        run: |
          chmod -R u+w _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>apps</title>
          <style>body{font:16px/1.5 system-ui,sans-serif;max-width:40em;margin:4em auto;padding:0 1em;color-scheme:light dark}</style></head>
          <body>
          <h1>apps</h1>
          <p>ArkDB is a local-first sync engine: one runtime in Rust, a domain
          written in plain Rust, and the phones embedding the same kernel.
          harken, a music library with playlists, is the first app on it.
          <a href="harken/">harken/</a> is its browser peer — the same engine
          compiled to wasm. Open it <em>alone</em> to run it entirely in this
          tab, or point it at a harken server. The source is at
          <a href="https://github.com/k2on/apps">github.com/k2on/apps</a>.</p>
          <p>Revelation, the second app, is the Bible as one scroll zoomed
          like a map: an Android app in plain Kotlin, on none of ArkDB.</p>
          </body>
          </html>
          HTML
          if [ -d _site/fdroid/repo ]; then
            sed -i 's|^</body>|<p><a href="fdroid/repo/">fdroid/repo</a> is both Android apps as an F-Droid repository: add that address in F-Droid and each APK built from main arrives as an update.</p>\n</body>|' _site/index.html
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
