# Everything a push to main publishes, in one run: each page at
# https://k2on.github.io/apps/<name>/ (the browser peer at harken/, arkui's
# docs at docs/, …) and every Android app in one F-Droid repository at
# https://k2on.github.io/apps/fdroid/repo. A `v*` tag builds the APKs alone
# and attaches them to a release.
#
# **What there is to publish is not written here.** It is the flake's
# `publish` output (flake.nix): a list of pages and a list of APKs, each with
# a name, the package that builds it and a key. `plan` reads it, and `page`
# and `apk` are one job per entry. A new demo, docs site or app is an entry
# there and nothing in this file.
#
# **A build is skipped when its inputs have not moved, and nix says whether
# they have.** An entry's key is its derivation's hash — every file, flag and
# dependency the build reads, and nothing else — so a prose edit moves no key
# and a change to a crate moves exactly the pages that link it. Each job asks
# the actions cache whether that key was built before. A page's output is the
# cache entry, so a hit restores it in seconds. An APK's version code is the
# commit time, which would move its derivation on every commit; its key is
# the same build without the version (flake.nix says how), and a hit there
# means "this APK was already published": the repository keeps offering it
# rather than gaining a copy under a new number.
#
# The nix store comes from Cachix when the repository variable CACHIX_NAME is
# set (with the secret CACHIX_AUTH_TOKEN to push): every path is pushed once by
# its hash and substituted after, so what does have to build pulls every
# unchanged dependency — aapt2, the toolchains, the kernel — instead of
# compiling it. Until then, nix-community/cache-nix-action keeps each job's
# store in GitHub's actions cache (10 GB per repository). The Android SDK is
# Google's and its licence does not allow redistributing it, so it is never
# pushed to Cachix; the APK jobs keep it in the actions cache either way.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # A tag's release is created with GITHUB_TOKEN.
  contents: write
  pages: write
  id-token: write
  # cache-nix-action deletes the caches it superseded.
  actions: write

# A newer push supersedes a run still building; deploys are serialised below.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What there is to build, and the key each is built under: evaluated, not
  # built, so this takes the time to install nix and read the flake.
  plan:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.plan.outputs.pages }}
      apks: ${{ steps.plan.outputs.apks }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - id: plan
        run: |
          nix eval --json .#publish.x86_64-linux > plan.json
          jq . plan.json
          echo "pages=$(jq -c .pages plan.json)" >> "$GITHUB_OUTPUT"
          echo "apks=$(jq -c .apks plan.json)" >> "$GITHUB_OUTPUT"

  page:
    needs: plan
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        page: ${{ fromJSON(needs.plan.outputs.pages) }}
    name: page (${{ matrix.page.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: built
        uses: actions/cache@v4
        with:
          path: page-out
          key: page-${{ matrix.page.name }}-${{ matrix.page.key }}

      - if: steps.built.outputs.cache-hit != 'true'
        uses: DeterminateSystems/nix-installer-action@main

      - if: steps.built.outputs.cache-hit != 'true' && vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - if: steps.built.outputs.cache-hit != 'true' && vars.CACHIX_NAME == ''
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-page-${{ matrix.page.name }}-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust/Cargo.lock') }}
          restore-prefixes-first-match: nix-page-${{ matrix.page.name }}-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-page-${{ matrix.page.name }}-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build ${{ matrix.page.package }}
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          nix build .#${{ matrix.page.package }} --print-build-logs
          cp -rL result page-out
          chmod -R u+w page-out

      - uses: actions/upload-artifact@v4
        with:
          name: page-${{ matrix.page.name }}
          path: page-out
          if-no-files-found: error

  # The flake's Linux checks. Each is a few test runs over one shared
  # build of the workspace (flake.nix: crane's layers), so building them
  # all costs about one workspace build; with Cachix the dependency layer
  # is substituted and only the workspace and its tests are compiled.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - if: vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the checks
        run: |
          nix build --print-build-logs --no-link \
            .#checks.x86_64-linux.fmt .#checks.x86_64-linux.clippy \
            .#checks.x86_64-linux.rust .#checks.x86_64-linux.ffi \
            .#checks.x86_64-linux.traces .#checks.x86_64-linux.vectors \
            .#checks.x86_64-linux.fuzz-smoke .#checks.x86_64-linux.versions \
            .#checks.x86_64-linux.harken-domain .#checks.x86_64-linux.harken-module \
            .#checks.x86_64-linux.docs

  apk:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        apk: ${{ fromJSON(needs.plan.outputs.apks) }}
    name: apk (${{ matrix.apk.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only looked up here; the entry is written after a successful build,
      # below. A tag builds whatever it finds.
      - id: seen
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/cache/restore@v4
        with:
          path: apk-seen
          key: apk-${{ matrix.apk.name }}-${{ matrix.apk.key }}
          lookup-only: true

      # The hosted image carries ~30 GB of toolchains this build never uses;
      # the nix store, a JDK, gradle's state, the Android NDK targets and the
      # aapt2 build want the room.
      - name: Free disk space
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - if: steps.seen.outputs.cache-hit != 'true'
        uses: DeterminateSystems/nix-installer-action@main

      - if: steps.seen.outputs.cache-hit != 'true' && vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Google's SDK and the zips it is assembled from stay out of a
          # public cache (see the top of this file).
          pushFilter: "(android-sdk-for-gradle|platform-35_r01\\.zip|build-tools_r35_linux\\.zip)"

      - if: steps.seen.outputs.cache-hit != 'true'
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-apk-${{ matrix.apk.name }}-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**', 'rust/Cargo.lock', format('{0}/android/deps.json', matrix.apk.name)) }}
          restore-prefixes-first-match: nix-apk-${{ matrix.apk.name }}-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-apk-${{ matrix.apk.name }}-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build aapt2 and the SDK (kept as gc roots)
        if: steps.seen.outputs.cache-hit != 'true'
        run: nix build .#aapt2 .#android-sdk --out-link "$RUNNER_TEMP/android" --print-build-logs

      # What the entry asks to have built first, so that its failure reads
      # on its own (harken's kernel for every ABI).
      - name: Build what comes first
        if: steps.seen.outputs.cache-hit != 'true' && join(matrix.apk.first, '') != ''
        run: |
          for p in ${{ join(matrix.apk.first, ' ') }}; do
            nix build ".#$p" --out-link "$RUNNER_TEMP/first-$p" --print-build-logs
          done

      - name: Build ${{ matrix.apk.package }}
        id: build
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          nix build .#${{ matrix.apk.package }} --print-build-logs
          cp result/${{ matrix.apk.file }} ${{ matrix.apk.file }}

      - if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.apk.name }}
          path: ${{ matrix.apk.file }}
          if-no-files-found: error

      # Remember these inputs as published. Saved only once the APK exists,
      # so a failed build is tried again on the next push.
      - name: Mark these inputs as built
        if: steps.build.outcome == 'success' && !startsWith(github.ref, 'refs/tags/v')
        run: mkdir -p apk-seen && git rev-parse HEAD > apk-seen/commit
      - if: steps.build.outcome == 'success' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/cache/save@v4
        with:
          path: apk-seen
          key: ${{ steps.seen.outputs.cache-primary-key }}

  # A tag is a release: every APK, attached to it, by one job so the builds
  # never race to create the same release. The keys are public, so the APKs
  # install anywhere and belong nowhere public (harken/android/README.md).
  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: apks
      - uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true

  deploy:
    needs: [plan, page, apk]
    # Every page, or none: Pages deploys the site whole, so a page that failed
    # would vanish from it. A failed APK does not hold the site back: it goes
    # up with the repository as it was, plus whichever APKs did build.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.page.result == 'success' }}
    runs-on: ubuntu-latest
    # One deployment at a time; a deploy in flight finishes before the next.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: page-*
          path: ${{ runner.temp }}/pages

      # Only the APKs that built this run exist; none is not an error.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: apk-*
          merge-multiple: true
          path: ${{ runner.temp }}/apk

      - name: Lay out the pages
        env:
          PAGES: ${{ needs.plan.outputs.pages }}
        run: |
          mkdir -p _site
          for name in $(jq -r '.[].name' <<<"$PAGES"); do
            cp -r "$RUNNER_TEMP/pages/page-$name" "_site/$name"
          done

      - uses: DeterminateSystems/nix-installer-action@main

      - if: vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The phones' F-Droid repository, one for every app
      # (harken/android/fdroid/README.md).
      #
      # Pages deploys the site whole, so the versions the live repository
      # already offers are fetched back and kept, of each app the newest
      # three by version code, and the index is signed again over all of
      # them: with the committed key, or with FDROID_KEYSTORE when that
      # secret is set (nix/fdroid.nix says why). An app with no new APK (its
      # inputs had not moved, or its build failed) is offered as it was.
      #
      # Nothing here fails the deploy. No APK anywhere, the live repository
      # unreachable, or fdroid itself failing, and the site goes up without
      # fdroid/, saying so.
      - name: Lay out the F-Droid repository
        env:
          FDROID_KEYSTORE: ${{ secrets.FDROID_KEYSTORE }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: |
          shopt -s nullglob
          apks=("$RUNNER_TEMP"/apk/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::notice::No new APK in this run; the F-Droid repository offers what it already had."
          fi
          if [ -z "$FDROID_KEYSTORE" ]; then
            echo "Signing the F-Droid index with the committed key; FDROID_KEYSTORE is not set."
          fi
          if nix run .#apps-fdroid -- repo --keep https://k2on.github.io/apps/fdroid/repo \
            "$RUNNER_TEMP/fdroid" "${apks[@]}"; then
            mkdir -p _site/fdroid
            cp -r "$RUNNER_TEMP/fdroid" _site/fdroid/repo
          else
            echo "::warning::No F-Droid repository in this deploy; the site goes up without fdroid/."
          fi

      # The site's front page: what this is, then a line per page from the
      # plan, then the F-Droid repository if this deploy has one.
      - name: Assemble the site
        env:
          PAGES: ${{ needs.plan.outputs.pages }}
        run: |
          chmod -R u+w _site
          {
            cat <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>apps</title>
          <style>body{font:16px/1.5 system-ui,sans-serif;max-width:40em;margin:4em auto;padding:0 1em;color-scheme:light dark}</style></head>
          <body>
          <h1>apps</h1>
          <p>ArkDB is a local-first sync engine: one runtime in Rust, a domain
          written in plain Rust, and the phones embedding the same kernel.
          harken, a music library with playlists, is the first app on it.
          Revelation, the second app, is the Bible as one scroll zoomed like
          a map: an Android app in plain Kotlin, on none of ArkDB. The source
          is at <a href="https://github.com/k2on/apps">github.com/k2on/apps</a>.</p>
          <ul>
          HTML
            jq -r '.[] | "<li><a href=\"\(.name)/\">\(.title)</a>: \(.about)</li>"' <<<"$PAGES"
            echo '</ul>'
            if [ -d _site/fdroid/repo ]; then
              echo '<p><a href="fdroid/repo/">fdroid/repo</a> is every Android app as an F-Droid repository: add that address in F-Droid and each APK built from main arrives as an update.</p>'
            fi
            echo '</body>'
            echo '</html>'
          } > _site/index.html
          cat _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
