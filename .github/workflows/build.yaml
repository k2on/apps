# Everything the site publishes, in two release channels
# (docs/releasing.md, .github/channels.sh), each deploy one of them:
#
#   a push to main  the unstable channel: every Android app's `.unstable`
#                   twin (" Unstable", its icon banded) in the F-Droid
#                   repository https://k2on.github.io/apps/fdroid/unstable/repo,
#                   each browser app's page at /apps/unstable/<app>/, and
#                   the docs at /apps/docs/.
#   a `v*` tag      the stable channel: every Android app under its own id
#                   in https://k2on.github.io/apps/fdroid/repo, each browser
#                   app's page at /apps/<app>/, and the APKs attached to a
#                   GitHub release.
#
# Pages deploys the site whole, so each deploy carries the other channel
# forward from the live site unchanged. A pull request, and any other
# branch, deploys nothing: a PR builds the stable APKs whose inputs moved
# (app-screens.yaml photographs them), and a run by hand builds the
# channel it is asked for (stable when not).
#
# **What there is to publish is not written here.** It is the flake's
# `publish` output (flake.nix): a list of pages and a list of APKs, each with
# a name, the package that builds it and a key. `plan` reads it, and `page`
# and `apk` are one job per entry. A new demo, docs site or app is an entry
# there and nothing in this file.
#
# **A build is skipped when its inputs have not moved, and nix says whether
# they have.** An entry's key is its derivation's hash — every file, flag and
# dependency the build reads, and nothing else — so a prose edit moves no key
# and a change to a crate moves exactly the pages that link it. Each job asks
# the actions cache whether that key was built before. A page's output is the
# cache entry, so a hit restores it in seconds. An APK's version code is the
# commit time, which would move its derivation on every commit; its key is
# the same build without the version (flake.nix says how), and a hit there
# means "this APK was already published": the repository keeps offering it
# rather than gaining a copy under a new number.
#
# The nix store comes from Cachix when the repository variable CACHIX_NAME is
# set (with the secret CACHIX_AUTH_TOKEN to push): every path is pushed once by
# its hash and substituted after, so what does have to build pulls every
# unchanged dependency — aapt2, the toolchains, the kernel — instead of
# compiling it. Every Rust crate is a derivation of its own (nix/rust.nix), so
# that holds crate by crate: a lockfile that moves one crate compiles that crate
# and what depends on it, and the rest of the graph is Cachix's. Until then, nix-community/cache-nix-action keeps each job's
# store in GitHub's actions cache (10 GB per repository). The Android SDK is
# Google's and its licence does not allow redistributing it, so it is never
# pushed to Cachix; the APK jobs keep it in the actions cache either way.
#
# **Only this repository's code is ever pushed.** A pull request from a fork
# runs here under `pull_request`, which GitHub gives no secrets: its
# CACHIX_AUTH_TOKEN is empty, and cachix-action then only reads the cache.
# Never move this workflow to `pull_request_target`, and never hand the token
# to a step some other way: nix trusts what the cache signed, not what is in
# it, so one push of a fork's build would be every later build's.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  # A PR builds the APKs whose inputs moved, and publishes nothing: they are
  # what app-screens.yaml takes the PR's screenshots from.
  pull_request:
    paths:
      - "harken/**"
      - "money/**"
      - "revelation/**"
      - "ui/**"
      - "modules/**"
      - "rust/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "docs/site/**"
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel's APKs and pages to build (nothing is deployed off main and tags)"
        type: choice
        options: [stable, unstable]
        default: stable

permissions:
  # A tag's release is created with GITHUB_TOKEN.
  contents: write
  pages: write
  id-token: write
  # cache-nix-action deletes the caches it superseded.
  actions: write

# A newer push supersedes a run still building; deploys are serialised below.
# A run by hand on a branch is keyed by its commit too: two dispatches at
# two commits (two agents' pushes to one branch) both finish, so a dry run
# of app-screens waiting on one for its APKs (published.sh) is never left
# with a cancelled run (43069089760, cancelled by 43070587909); a second
# dispatch at the same commit still supersedes the first. main's and a
# PR's runs are as they were.
concurrency:
  group: build-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  # What there is to build, and the key each is built under: evaluated, not
  # built, so this takes the time to install nix and read the flake.
  # The run's channel picks each APK's package (the app's own, or its
  # `.unstable` twin's) and the pages it builds (.github/channels.sh).
  plan:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      pages: ${{ steps.plan.outputs.pages }}
      all-pages: ${{ steps.plan.outputs.all-pages }}
      apks: ${{ steps.plan.outputs.apks }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - id: plan
        env:
          CHANNEL_INPUT: ${{ inputs.channel }}
        run: |
          nix eval --json .#publish.x86_64-linux > plan.json
          jq . plan.json
          bash .github/channels.sh plan plan.json | tee -a "$GITHUB_OUTPUT"

  # After `crates`, which has built every crate of the docs (docs-site
  # builds the same page), or without it if it failed. The run's channel's
  # pages: main's and a tag's, which deploy them, and a run by hand's.
  page:
    needs: [plan, crates]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.pages != '[]' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        page: ${{ fromJSON(needs.plan.outputs.pages) }}
    name: page (${{ matrix.page.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: built
        uses: actions/cache@v4
        with:
          path: page-out
          key: page-${{ matrix.page.name }}-${{ matrix.page.key }}

      - if: steps.built.outputs.cache-hit != 'true'
        uses: DeterminateSystems/nix-installer-action@main

      - if: steps.built.outputs.cache-hit != 'true' && vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - if: steps.built.outputs.cache-hit != 'true' && vars.CACHIX_NAME == ''
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-page-${{ matrix.page.name }}-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust/Cargo.lock') }}
          restore-prefixes-first-match: nix-page-${{ matrix.page.name }}-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-page-${{ matrix.page.name }}-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build ${{ matrix.page.package }}
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          nix build .#${{ matrix.page.package }} --print-build-logs
          cp -rL result page-out
          chmod -R u+w page-out

      - uses: actions/upload-artifact@v4
        with:
          name: page-${{ matrix.page.name }}
          path: page-out
          if-no-files-found: error

  # The docs site (docs/site, an ArkUI app written as static HTML): built
  # as it is published, and every page shot at a phone's width and a
  # desktop's, light and dark, with script and without. With script a page
  # fails on any console error or word of hydration (docs-shots.js).
  # Nothing is published: the shots are this run's artifact. After `crates`,
  # as `page` (which builds the same site on main).
  docs-site:
    needs: crates
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - if: vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build the site
        run: nix build .#docs --out-link "$RUNNER_TEMP/docs" --print-build-logs

      - name: Playwright's Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Every page, with script and without
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node .github/screens/docs-shots.js "$RUNNER_TEMP/docs" docs-site

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs-site
          if-no-files-found: ignore

  # The flake's Linux checks: each member's tests and lints a derivation of
  # its own over the crates' (flake.nix, nix/rust.nix), so with Cachix a
  # commit compiles and runs only what its change reaches. First `crates`:
  # every crate the checks' test and lint builds depend on (resolved once
  # for the whole workspace, as `cargo test --workspace` resolves them, so
  # each is one build), the docs' crates, and every crate two of the run's
  # other jobs both reach (`server`, the APKs: flake.nix, `ci-crates`),
  # compiled once and pushed. Then the checks fan out, a job per group, and
  # the server, the docs and the APKs start, each fetching those crates and
  # building only what is its own: no crate is compiled by two jobs. The
  # checks were one job of 16 to 22 minutes, nearly all of it one step on
  # one runner's four cores; and before `ci-crates` the APKs, the server and
  # the checks each compiled the crates they share at once (build
  # 42923951723: 107 crates compiled twice or more).
  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - if: vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The crates every build is made of are each workspace's Cargo.nix,
      # which crate2nix writes from the lockfile: a lockfile changed without
      # them is said here, with the command that writes them.
      - name: Cargo.nix is the lockfiles'
        run: |
          nix run .#update-cargo-nix
          git diff --exit-code -- rust/Cargo.nix docs/site/Cargo.nix || {
            echo "::error::rust/Cargo.nix or docs/site/Cargo.nix is not the lockfile's: nix run .#update-cargo-nix"
            exit 1
          }
      - name: Build the run's shared crates
        run: nix build --print-build-logs --no-link .#ci-crates

  checks:
    needs: crates
    strategy:
      fail-fast: false
      matrix:
        # Each group a job; together every check the one job built. The
        # checks a group names share its test builds' crates with no other
        # group's beyond `crates`.
        group:
          - { name: rust, checks: "rust" }
          - { name: clippy, checks: "clippy" }
          - { name: ffi, checks: "ffi harken-domain harken-module traces vectors fuzz-smoke versions" }
          - { name: docs, checks: "docs" }
          - { name: lint, checks: "fmt theme theme-contrast layers channels" }
          - { name: apps, checks: "prebuild money-native revelation-native money-web-sync" }
    name: checks (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - if: vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the checks
        env:
          CHECKS: ${{ matrix.group.checks }}
        run: |
          refs=()
          for c in $CHECKS; do refs+=(".#checks.x86_64-linux.$c"); done
          nix build --print-build-logs --no-link "${refs[@]}"

  # What a server runs — the harken and money NixOS modules' packages — built and
  # pushed to Cachix, which ark substitutes from: a deploy of a commit this
  # job has built downloads them rather than compiling them on the host.
  # No browser client yet: iced is the desktop's alone, and the web client
  # (Leptos, ui/docs/app.md) is not written, so a server serves the socket.
  # With the seeds the screenshots' servers start on (<app>/demo/server.sh):
  # each of app-screens' Linux jobs, a dozen at once, then fetches them
  # rather than every one compiling the same seed and its crates.
  server:
    needs: crates
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - if: vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build what the server runs
        run: nix build --print-build-logs --no-link .#harken-server .#money-server .#arkdb .#harken-seed .#money-seed

  # ArkUI's Kotlin (ui/kotlin), each of its libraries compiled once
  # (flake.nix, `arkuiKotlin`) and pushed, before the APKs, which link it:
  # compiled here, not once in each of their jobs. A
  # commit that leaves ui/kotlin alone fetches it from Cachix in seconds.
  arkui-kotlin:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - if: vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: "(android-sdk-for-gradle|platform-35_r01\\.zip|build-tools_r35_linux\\.zip)"
      - name: Build ArkUI's Kotlin
        run: nix build --print-build-logs --no-link .#arkui-kotlin-shots .#arkui-kotlin

  # After `crates` too (the crates both apps' libraries and the checks
  # share), or without it if it failed: an APK is not held back by a check.
  apk:
    needs: [plan, crates, arkui-kotlin]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.arkui-kotlin.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        apk: ${{ fromJSON(needs.plan.outputs.apks) }}
    name: apk (${{ matrix.apk.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only looked up here; the entry is written after a successful build,
      # below. A tag builds whatever it finds.
      - id: seen
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/cache/restore@v4
        with:
          path: apk-seen
          key: apk-${{ matrix.apk.name }}-${{ matrix.apk.key }}
          lookup-only: true

      # The hosted image carries ~30 GB of toolchains this build never uses;
      # the nix store, a JDK, gradle's state, the Android NDK targets and the
      # aapt2 build want the room.
      # In the background: deleting them takes a minute and a half, and the
      # build wants the room only once nix and the SDK are in.
      - name: Free disk space
        if: steps.seen.outputs.cache-hit != 'true'
        run: nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost > /dev/null 2>&1 &

      - if: steps.seen.outputs.cache-hit != 'true'
        uses: DeterminateSystems/nix-installer-action@main

      - if: steps.seen.outputs.cache-hit != 'true' && vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Google's SDK and the zips it is assembled from stay out of a
          # public cache (see the top of this file).
          pushFilter: "(android-sdk-for-gradle|platform-35_r01\\.zip|build-tools_r35_linux\\.zip)"

      - if: steps.seen.outputs.cache-hit != 'true'
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-apk-${{ matrix.apk.name }}-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**', 'rust/Cargo.lock', format('{0}/android/deps.json', matrix.apk.name)) }}
          restore-prefixes-first-match: nix-apk-${{ matrix.apk.name }}-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-apk-${{ matrix.apk.name }}-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build aapt2 and the SDK (kept as gc roots)
        if: steps.seen.outputs.cache-hit != 'true'
        run: nix build .#aapt2 .#android-sdk --out-link "$RUNNER_TEMP/android" --print-build-logs

      # What the entry asks to have built first, so that its failure reads
      # on its own (harken's kernel for every ABI).
      - name: Build what comes first
        if: steps.seen.outputs.cache-hit != 'true' && join(matrix.apk.first, '') != ''
        run: |
          for p in ${{ join(matrix.apk.first, ' ') }}; do
            nix build ".#$p" --out-link "$RUNNER_TEMP/first-$p" --print-build-logs
          done

      # The version the phone shows (flake.nix, `versionFlags`): a `v*`
      # tag's own (`v1.2` is 1.2), and anything else
      # `<last tag>-unstable+<commit>` (.github/channels.sh). The version
      # code is the commit's time either way.
      - name: The version name
        if: steps.seen.outputs.cache-hit != 'true'
        run: echo "APPS_VERSION_NAME=$(bash .github/channels.sh version-name)" | tee -a "$GITHUB_ENV"

      # Impure only so that the version name above is read.
      - name: Build ${{ matrix.apk.package }}
        id: build
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          nix build --impure .#${{ matrix.apk.package }} --print-build-logs
          cp result/${{ matrix.apk.file }} ${{ matrix.apk.file }}

      - if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.apk.name }}
          path: ${{ matrix.apk.file }}
          if-no-files-found: error

      # Remember these inputs as published, so the next push does not build
      # them again: only main's pushes (a PR's APK is published nowhere, and
      # a tag builds whatever it finds), and only once the APK has built, so
      # a failed build is tried again on the next push. The key is the
      # unstable twin's, which only main builds.
      - if: steps.build.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: mkdir -p apk-seen && git rev-parse HEAD > apk-seen/commit
      - name: Mark these inputs as built
        if: steps.build.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: apk-seen
          key: apk-${{ matrix.apk.name }}-${{ matrix.apk.key }}

  # A tag is a release: every APK (the stable channel's, the apps' own
  # ids), attached to it, by one job so the builds never race to create
  # the same release. The keys are public, so the APKs install anywhere
  # and belong nowhere public (harken/android/README.md). The same APKs go
  # to the stable F-Droid repository (`deploy`).
  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: apks
      - uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true

  # A push to main deploys the unstable channel, a `v*` tag the stable
  # one; each carries the other forward from the live site
  # (.github/channels.sh). Nothing else deploys: not a run by hand on
  # main, whose channel is whatever it was asked.
  deploy:
    needs: [plan, page, apk]
    # Every page of the channel, or none: Pages deploys the site whole, so
    # a page that failed would vanish from it. A failed APK does not hold
    # the site back: it goes up with the repository as it was, plus
    # whichever APKs did build.
    if: ${{ !cancelled() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) && (needs.page.result == 'success' || (needs.page.result == 'skipped' && needs.plan.outputs.pages == '[]')) }}
    runs-on: ubuntu-latest
    # One deployment at a time; a deploy in flight finishes before the next,
    # so each reads the other channel as the last deploy left it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: page-*
          path: ${{ runner.temp }}/pages

      # Only the APKs that built this run exist; none is not an error.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: apk-*
          merge-multiple: true
          path: ${{ runner.temp }}/apk

      - uses: DeterminateSystems/nix-installer-action@main

      - if: vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The whole site (.github/channels.sh): this channel's pages and
      # F-Droid repository from this run, the other channel's as the live
      # site has them, and the front page over both. Each F-Droid index is
      # signed with the committed key, or with FDROID_KEYSTORE when that
      # secret is set (nix/fdroid.nix says why). An app with no new APK (its
      # inputs had not moved, or its build failed) is offered as it was. A
      # channel that could not be carried forward fails the deploy rather
      # than vanish from the site.
      - name: Lay out the site
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          PAGES: ${{ needs.plan.outputs.all-pages }}
          PAGES_DIR: ${{ runner.temp }}/pages
          APK_DIR: ${{ runner.temp }}/apk
          SITE_URL: https://k2on.github.io/apps
          FDROID_KEYSTORE: ${{ secrets.FDROID_KEYSTORE }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: bash .github/channels.sh deploy _site

      - uses: actions/configure-pages@v5

      # Named for the attempt: a deploy re-run uploads its site beside the
      # first attempt's in the same run, and deploy-pages refuses a name it
      # finds twice ("Multiple artifacts named github-pages").
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          # Pages can take longer than the default ten minutes to report a
          # deployment done when it is busy; waiting longer beats a failed
          # deploy of a site that would have gone up.
          timeout: 1800000
