# harken and money for iOS: each app's archive built by nix (flake.nix,
# `<app>-ios-archive`), signed and sent to TestFlight from main. The same
# derivations as the apps' iPhone screenshots (`<app>-ios-simulator`): one
# kernel, each slice built only where linked (the simulator's,
# `<app>-ios-kernel-simulator`, for the tests and the shots; the phone's for
# the archive), one pinned Xcode.
#
# **Built by nix, Xcode pinned by its version.** flake.nix pins the Xcode of
# GitHub's macos-15 image by its version and build number (`xcode`);
# ../xcode-pinned.sh selects and checks it, and ../nix-xcode.sh builds each
# app with it where the image installs it, or takes it from the cache when
# nothing it is built from moved. Xcode itself is never put in the store, so
# it is never fetched from or pushed to Cachix (Apple's licence). The kernel
# is built under nix's strict sandbox, with only the Xcode directory let in;
# the app's own xcodebuild is the one step that cannot be (flake.nix says
# why), so the runner's nix is relaxed, where every other build is still
# sandboxed. Main's builds go to Cachix.
#
# **The archive is unsigned on purpose**, and given its build number after it
# is built (../ios-archive.sh): the commit's time, always rising and never
# the same twice, as App Store Connect insists; nix builds it with
# project.yml's, so its hash moves only with what it is built from. Signed,
# it would be signed for development, and a fresh runner has no development
# certificate, so every run had Xcode make one through the API, until the
# team held as many as Apple allows. Unsigned, nothing is made per run;
# ../ios-upload.sh's export signs for the App Store with the cloud's
# certificate (automatic signing with an App Store Connect API key) and
# sends it with `destination: upload`, after which it appears in TestFlight.
# Off main it is signed the same way and sent nowhere (`destination:
# export`): what a branch checks. money's tests run on a simulator against
# the demo's household, over the same kernel.
#
# **The apps are the flake's list** (`publish.ios`), one job each: an app is
# sent only when its archive is new to TestFlight (its key, its derivation's
# hash, not seen sent before, as build.yaml's APKs), and only when the list
# says it goes there; its tests run when the list says so.
#
# Repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   ASC_KEY_ID          the API key's Key ID
#   ASC_ISSUER_ID       the Issuer ID shown above the keys list
#   ASC_KEY_P8          the .p8 file's whole contents, BEGIN/END lines included
#   APPLE_TEAM_ID       the ten-character Team ID
#   CACHIX_AUTH_TOKEN   to push main's builds to the cache (CACHIX_NAME, a
#                       variable, names it)
# Repository variables (the Variables tab):
#   CACHIX_NAME            the cache main's builds are pushed to
# (An app's bundle id is its project.yml's; whether it goes to TestFlight is
# the flake's list.)
name: ios

# Main's pushes (TestFlight) and pull requests: not every branch's push,
# each holding a macOS runner per app for an archive nothing uploads.
on:
  push:
    branches: [main]
    paths: &paths
      - "harken/ios/**"
      - "harken/ffi/**"
      - "harken/domain/**"
      - "harken/player/**"
      - "money/ios/**"
      - "money/ffi/**"
      - "money/domain/**"
      # The demo's household, which money's library links for its demo.
      - "money/seed/**"
      # The crates the phones link, not the whole workspace: arkui, arkdb
      # and the desktop apps are none of an iPhone's.
      - "rust/ark/**"
      - "rust/ark-macros/**"
      - "rust/ark-auth/**"
      - "rust/ark-peer/**"
      - "rust/ark-ffi/**"
      - "rust/ark-format/**"
      - "ui/rust/router/**"
      - "ui/rust/router-macros/**"
      - "rust/Cargo.lock"
      - "rust/Cargo.toml"
      - "ui/swift/**"
      - ".github/workflows/ios.yaml"
      - ".github/ios-upload.sh"
      - ".github/ios-archive.sh"
      - ".github/nix-xcode.sh"
      - ".github/xcode-pinned.sh"
      # What the archives are built by.
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a build still running; TestFlight only wants the
# latest.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# nix's macOS sandbox, relaxed: every build is sandboxed but the one that
# says __noChroot, each app's own xcodebuild (flake.nix says why).
env:
  NIX_CONFIG: |
    sandbox = relaxed
    extra-substituters = https://k2on.cachix.org
    extra-trusted-public-keys = k2on.cachix.org-1:oI4Db0uW5ER+s4Te/MrXSmjWUWkOc9rmKdzsgUDxQP8=

jobs:
  # The iPhone apps, as the flake lists them (`publish.ios`): evaluated,
  # not built.
  plan:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.plan.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - id: plan
        run: |
          nix eval --json .#publish.x86_64-linux.ios > ios.json
          # A pull request's: only the apps with tests to run. Each app's
          # Swift is built for the simulator by the PR's screenshots
          # (app-screens.yaml) anyway, and off main an archive goes nowhere.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then jq -c 'map(select(.test))' ios.json > t && mv t ios.json; fi
          jq . ios.json
          echo "ios=$(jq -c . ios.json)" >> "$GITHUB_OUTPUT"

  app:
    needs: plan
    if: needs.plan.outputs.ios != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.ios) }}
    name: ${{ matrix.app.name }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Whether this archive was sent before: its key is its derivation's
      # hash, which moves only with what it is built from, so an app whose
      # inputs have not moved is not sent again (as build.yaml's APKs).
      - id: seen
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          path: ios-seen
          key: ios-${{ matrix.app.name }}-${{ matrix.app.key }}
          lookup-only: true

      # Where it goes: to TestFlight from main, when it is new and the list
      # says so; off main, signed and sent nowhere, to check the signing.
      - name: Where it goes (PRs nowhere, other branches signed only, main to TestFlight)
        env:
          SEEN: ${{ steps.seen.outputs.cache-hit }}
          TESTFLIGHT: ${{ matrix.app.testflight }}
        run: |
          # A pull request's is built and tested, and signed by nothing: a
          # fork's has no keys, and what an export would prove the archive
          # already has.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then send=
          elif [ "$GITHUB_REF" != refs/heads/main ]; then send="export"
          elif [ "$TESTFLIGHT" = true ] && [ "$SEEN" != true ]; then send="upload"
          else send=; fi
          echo "SEND=$send" | tee -a "$GITHUB_ENV"

      - name: The pinned Xcode
        run: bash .github/xcode-pinned.sh .

      # And the pinned Xcode's directory let into the kernel's sandbox
      # (XCODE_NIX_CONF, from xcode-pinned.sh).
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            ${{ env.NIX_CONFIG }}
            ${{ env.XCODE_NIX_CONF }}

      # Main's builds, and a pull request's of this repository's (a fork's
      # has no token), go to the cache: app-screens' Mac takes them from it.
      - if: (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Anything named for Xcode (not XcodeGen), though none is in the
          # store any more: Apple's licence keeps it off any cache.
          pushFilter: "[Xx]code([^Gg]|$)"

      # What the next step builds, evaluated with nothing beside it; the
      # build then finds it in nix's evaluation cache.
      - name: The packages, evaluated
        env:
          APP: ${{ matrix.app.name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then attrs="$APP-ios-kernel-simulator $APP-ios-simulator"
          else attrs="$APP-ios-archive $APP-ios-kernel-simulator"; fi
          refs=()
          for a in $attrs; do refs+=("git+file://$PWD#packages.aarch64-darwin.$a"); done
          start=$(date +%s)
          nix build --dry-run "${refs[@]}" 2> /dev/null || echo "::warning::not all evaluated; the build says why"
          echo "evaluated in $(( $(date +%s) - start ))s"

      # The tests' simulator, booting under the nix build (meanwhile.sh), as
      # app-screens' does: a cold boot after the build was up to nine
      # minutes before the first test. Started once nix is installed and the
      # packages evaluated: a booting CoreSimulator slowed both (the
      # evaluation to four minutes). The newest iPhone the image has for the
      # newest iOS 26 runtime, its id left in $RUNNER_TEMP/udid.
      - if: matrix.app.test
        name: Start booting the tests' simulator
        run: |
          bash .github/screens/meanwhile.sh start boot bash -c '
            id=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)[\"devices\"]
          rts = sorted((k for k in d if \"iOS-26\" in k), key=lambda k: [int(x) for x in k.split(\"iOS-\")[1].split(\"-\")])
          phones = [x for k in reversed(rts) for x in d[k] if x[\"name\"].startswith(\"iPhone\")]
          print(phones[0][\"udid\"] if phones else \"\")")
            [ -n "$id" ] || { echo "no iOS 26 iPhone simulator on this image"; exit 1; }
            echo "$id" > "$RUNNER_TEMP/udid"
            echo "Booting $id"
            xcrun simctl boot "$id" && xcrun simctl bootstatus "$id" -b'

      # nix's archive (flake.nix, `<app>-ios-archive`, over the phone's
      # slice alone), the cache's when nothing it is built from moved, and
      # the simulator's slice for the tests (`<app>-ios-kernel-simulator`);
      # the archive given its build number, the commit's time in seconds.
      #
      # **One kernel per commit.** A pull request's of this repository's
      # goes to the cache too (the push above; a fork's has no token), with
      # the screenshots' app over the same slice: app-screens takes a PR's
      # iPhone shots once this run has ended, so its Mac fetches both rather
      # than build them a second time.
      - name: Build the kernel, and the archive (not on PRs), with nix
        env:
          APP: ${{ matrix.app.name }}
          NAME: ${{ matrix.app.App }}
        run: |
          # A pull request's: the kernel its tests link and the screenshots'
          # app, and no archive, which nothing would sign or send.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            bash .github/nix-xcode.sh . "$XCODE" "$APP-ios-kernel-simulator" "$APP-ios-simulator" > "$RUNNER_TEMP/built"
          else
            bash .github/nix-xcode.sh . "$XCODE" "$APP-ios-archive" "$APP-ios-kernel-simulator" > "$RUNNER_TEMP/built"
          fi
          cat "$RUNNER_TEMP/built"
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            bash .github/ios-archive.sh "$NAME" "$(awk -v p="$APP-ios-archive" '$1 == p {print $2}' "$RUNNER_TEMP/built")" "$(git log -1 --format=%ct)"
          fi
          kernel=$(awk -v p="$APP-ios-kernel-simulator" '$1 == p {print $2}' "$RUNNER_TEMP/built")
          mkdir -p "$APP/ffi/ios" && cp -R "$kernel"/*.xcframework "$kernel"/swift "$APP/ffi/ios/" && chmod -R u+w "$APP/ffi/ios"

      # Its tests, when the list says it has them run: on the simulator
      # booted meanwhile, the app built here over the same kernel (the
      # simulator's slice, as the screenshots' app links).
      - name: Test
        if: matrix.app.test
        working-directory: ${{ matrix.app.name }}/ios
        env:
          NAME: ${{ matrix.app.App }}
        run: |
          # XcodeGen from the flake (the cache's), as the screens jobs have it: no Homebrew.
          "$(nix build --no-link --print-out-paths "$GITHUB_WORKSPACE#xcodegen")/bin/xcodegen" generate
          # The simulator booted under the build.
          bash "$GITHUB_WORKSPACE/.github/screens/meanwhile.sh" wait boot
          id=$(cat "$RUNNER_TEMP/udid")
          xcodebuild test \
            -project "$NAME.xcodeproj" \
            -scheme "$NAME" \
            -destination "id=$id" \
            -resultBundlePath "$RUNNER_TEMP/$NAME-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Keep the test results
        if: always() && matrix.app.test
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.App }}-tests.xcresult
          path: ${{ runner.temp }}/${{ matrix.app.App }}-tests.xcresult
          if-no-files-found: ignore

      - name: Sign (not on PRs), and send to TestFlight (main only)
        if: env.SEND != ''
        env:
          DESTINATION: ${{ env.SEND }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/ios-upload.sh "${{ matrix.app.App }}"

      - name: Remove the API key (not on PRs)
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

      # Remember it as sent, once it has been.
      - name: Mark this archive as sent to TestFlight (main only)
        if: success() && env.SEND == 'upload'
        run: mkdir -p ios-seen && git rev-parse HEAD > ios-seen/commit
      - if: success() && env.SEND == 'upload'
        uses: actions/cache/save@v4
        with:
          path: ios-seen
          key: ios-${{ matrix.app.name }}-${{ matrix.app.key }}
