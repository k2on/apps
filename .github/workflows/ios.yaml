# harken and money for iOS: each app's archive built by nix (flake.nix,
# `<app>-ios-archive`), signed and sent to TestFlight from a `v*` tag
# (a release, docs/releasing.md) and from nothing else. The same
# derivations as the apps' iPhone screenshots (`<app>-ios-simulator`): one
# kernel, each slice built only where linked (the simulator's,
# `<app>-ios-kernel-simulator`, for the shots; the phone's for
# the archive), one pinned Xcode.
#
# **Built by nix, Xcode pinned by its version.** flake.nix pins the Xcode of
# GitHub's macos-15 image by its version and build number (`xcode`);
# ../xcode-pinned.sh selects and checks it, and ../nix-xcode.sh builds each
# app with it where the image installs it, or takes it from the cache when
# nothing it is built from moved. Xcode itself is never put in the store, so
# it is never fetched from or pushed to Cachix (Apple's licence). The kernel
# is not built on the Mac at all: the `kernels` job cross-compiles it on
# Linux (flake.nix, `appleKernel`) and the Mac fetches it; the app's own
# xcodebuild cannot be sandboxed (flake.nix says why), so the runner's nix
# is relaxed, where every other build is still sandboxed. This repository's builds go to Cachix (main's, by hand, and a
# pull request's from a branch here); a fork's never.
#
# **The archive is unsigned on purpose**, and given its build number after it
# is built (../ios-archive.sh): the commit's time, always rising and never
# the same twice, as App Store Connect insists; nix builds it with
# project.yml's, so its hash moves only with what it is built from. Signed,
# it would be signed for development, and a fresh runner has no development
# certificate, so every run had Xcode make one through the API, until the
# team held as many as Apple allows. Unsigned, nothing is made per run;
# ../ios-upload.sh's export signs for the App Store with the cloud's
# certificate (automatic signing with an App Store Connect API key) and
# sends it with `destination: upload`, after which it appears in TestFlight.
# A tag's archive also takes the tag as its version (`v1.2` is 1.2).
#
# **Main is the unstable channel and goes nowhere.** A push to main (and a
# run by hand on a branch) archives and signs the same way and sends
# nothing (`destination: export`): what proves the signing still works
# before a release needs it, and all it does, to keep the Mac's minutes
# low. A pull request builds each app's simulator kernel and the
# screenshots' app (app-screens.yaml fetches them from the cache) and signs
# nothing. No app has iOS unit tests, so nothing here runs any.
#
# **The unstable TestFlight app is a hook, off for every app.** The
# flake's list says `unstable` for an app whose app.toml has
# `[channels] ios-unstable = true` (nix/channels.nix). For such an app a
# push to main would send its archive to TestFlight as a second app, the
# unstable channel's: ../ios-archive.sh given CHANNEL=unstable makes its
# bundle id `<bundle>.unstable` (and each extension's under it) and its
# name "<Name> Unstable" before it is signed. Before turning it on: the
# App Store Connect record for `<bundle>.unstable` (and its extensions'
# ids, app groups and push capability) must exist, and the banded icon is
# not drawn for the iPhone yet (the asset catalog is compiled into the
# archive; ui/prebuild.py's asset catalog is where it would go).
# docs/releasing.md says the same.
#
# **The apps are the flake's list** (`publish.ios`), one job each: a tag
# sends an app when the list says it goes to TestFlight, and every other
# app of a tag is signed and sent nowhere.
#
# Repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   ASC_KEY_ID          the API key's Key ID
#   ASC_ISSUER_ID       the Issuer ID shown above the keys list
#   ASC_KEY_P8          the .p8 file's whole contents, BEGIN/END lines included
#   APPLE_TEAM_ID       the ten-character Team ID
#   CACHIX_AUTH_TOKEN   to push this repository's builds to the cache
#                       (CACHIX_NAME, a variable, names it); never a fork's
# Repository variables (the Variables tab):
#   CACHIX_NAME            the cache this repository's builds are pushed to
# (An app's bundle id is its project.yml's; whether it goes to TestFlight is
# the flake's list.)
name: ios

# Releases (`v*` tags: TestFlight), main's pushes (the signing checked,
# nothing sent) and pull requests: not every branch's push, each holding a
# macOS runner per app for an archive nothing uploads. GitHub does not
# apply `paths` to a tag's push, so every release runs.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: &paths
      - "harken/ios/**"
      - "harken/ffi/**"
      - "harken/domain/**"
      - "harken/player/**"
      - "money/native/ios/**"
      - "money/app.toml"
      - "money/icon.svg"
      - "ui/prebuild.py"
      - "nix/ark-app.nix"
      - "money/core/**"
      # The demo's household, which money's library links for its demo.
      # The crates the phones link, not the whole workspace: arkui, arkdb
      # and the desktop apps are none of an iPhone's.
      - "rust/ark/**"
      - "rust/ark-macros/**"
      - "rust/ark-auth/**"
      - "rust/ark-peer/**"
      - "rust/ark-ffi/**"
      - "rust/ark-format/**"
      - "ui/rust/router/**"
      - "ui/rust/router-macros/**"
      # money's screens run in Rust, and the device modules it lists.
      - "money/app/**"
      - "ui/rust/app/**"
      - "ui/rust/arkui-macros/**"
      - "ui/rust/module/**"
      - "modules/**"
      - "rust/Cargo.lock"
      - "rust/Cargo.toml"
      - "ui/swift/**"
      - ".github/workflows/ios.yaml"
      - ".github/ios-upload.sh"
      - ".github/ios-archive.sh"
      - ".github/nix-xcode.sh"
      - ".github/apple-ahead.sh"
      - ".github/xcode-pinned.sh"
      # What the archives are built by.
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a build still running; a tag's upload is never
# cut off.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# nix's macOS sandbox, relaxed: every build is sandboxed but the one that
# says __noChroot, each app's own xcodebuild (flake.nix says why).
env:
  NIX_CONFIG: |
    sandbox = relaxed
    extra-substituters = https://k2on.cachix.org
    extra-trusted-public-keys = k2on.cachix.org-1:oI4Db0uW5ER+s4Te/MrXSmjWUWkOc9rmKdzsgUDxQP8=

jobs:
  # The iPhone apps, as the flake lists them (`publish.ios`): evaluated,
  # not built.
  plan:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.plan.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - id: plan
        run: |
          nix eval --json .#publish.x86_64-linux.ios > ios.json
          jq . ios.json
          echo "ios=$(jq -c . ios.json)" >> "$GITHUB_OUTPUT"

  # Each app's kernel (and every other part of its Mac build that is
  # built on Linux: flake.nix, `appleKernel`), cross-compiled here before
  # any Mac is asked for, so the Mac only fetches it, links and runs Xcode:
  # a Mac cannot build a Linux derivation. Pushed to the cache for this
  # repository's own code only (the head repository's), and for every run,
  # a fork's too, handed to the Mac as an artifact (unsigned store paths,
  # which only that run's Mac imports).
  kernels:
    needs: plan
    if: needs.plan.outputs.ios != '[]'
    runs-on: ubuntu-latest
    env:
      APPS: ${{ join(fromJSON(needs.plan.outputs.ios).*.name, ' ') }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://k2on.cachix.org
            extra-trusted-public-keys = k2on.cachix.org-1:oI4Db0uW5ER+s4Te/MrXSmjWUWkOc9rmKdzsgUDxQP8=
      - if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Apple's SDK headers that ring's C is compiled against are
          # cache.nixos.org's (nixpkgs fetches them from Apple); never ours.
          pushFilter: "macOS-SDK"
      - name: Build the kernels
        run: |
          attrs=()
          for a in $APPS; do
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then attrs+=("$a-ios-simulator" "$a-ios-kernel-simulator")
            else attrs+=("$a-ios-archive"); fi
          done
          bash .github/apple-ahead.sh . "$RUNNER_TEMP/kernels.txt" "${attrs[@]}"
          nix copy --to "file://$RUNNER_TEMP/kernels" $(cat "$RUNNER_TEMP/kernels.txt")
          cp "$RUNNER_TEMP/kernels.txt" "$RUNNER_TEMP/kernels/paths.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: apple-kernels
          path: ${{ runner.temp }}/kernels
          retention-days: 3

  app:
    needs: [plan, kernels]
    if: needs.plan.outputs.ios != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.ios) }}
    name: ${{ matrix.app.name }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Where it goes: to TestFlight from a `v*` tag when the list says so;
      # anywhere else (main, a branch run by hand), signed and sent nowhere,
      # to check the signing. The hook (top of this file): main's push of an
      # app the list says `unstable` for goes to TestFlight as its unstable
      # app; no app says so yet.
      - name: Where it goes (PRs nowhere, main and branches signed only, tags to TestFlight)
        env:
          TESTFLIGHT: ${{ matrix.app.testflight }}
          UNSTABLE: ${{ matrix.app.unstable }}
        run: |
          # A pull request's is built, and signed by nothing: a
          # fork's has no keys, and what an export would prove the archive
          # already has.
          channel=stable
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then send=
          elif [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "$TESTFLIGHT" = true ]; then send="upload"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$UNSTABLE" = true ]; then send="upload" channel=unstable
          else send="export"; fi
          echo "SEND=$send" | tee -a "$GITHUB_ENV"
          echo "CHANNEL=$channel" | tee -a "$GITHUB_ENV"

      - name: The pinned Xcode
        run: bash .github/xcode-pinned.sh .

      # And the pinned Xcode's directory let into the kernel's sandbox
      # (XCODE_NIX_CONF, from xcode-pinned.sh).
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            ${{ env.NIX_CONFIG }}
            ${{ env.XCODE_NIX_CONF }}

      # Every build of this repository's own code goes to the cache — main's,
      # a run by hand, a pull request's from a branch here — and app-screens'
      # Mac takes it from there. A fork's pull request never: it is the
      # fork's code, and the token is not even asked for (GitHub gives a
      # fork's `pull_request` no secrets anyway). Nix trusts what the cache
      # signed, not what is in it.
      - if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Anything named for Xcode (not XcodeGen), though none is in the
          # store any more: Apple's licence keeps it off any cache.
          pushFilter: "[Xx]code([^Gg]|$)"

      # What the next step builds, evaluated with nothing beside it; the
      # build then finds it in nix's evaluation cache.
      # The kernels the Linux job built (`kernels`), into this Mac's store:
      # from the cache for this repository's code, and from the job's
      # artifact for any (a fork's, which nothing here pushes).
      - uses: actions/download-artifact@v4
        with:
          name: apple-kernels
          path: ${{ runner.temp }}/kernels
      - name: The kernels, from Linux
        run: nix copy --no-check-sigs --from "file://$RUNNER_TEMP/kernels" $(cat "$RUNNER_TEMP/kernels/paths.txt")

      # What this run builds: a pull request's the simulator's kernel and
      # the screenshots' app; otherwise the archive.
      - name: The packages, evaluated
        env:
          APP: ${{ matrix.app.name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then attrs="$APP-ios-kernel-simulator $APP-ios-simulator"
          else attrs="$APP-ios-archive"; fi
          echo "ATTRS=$attrs" >> "$GITHUB_ENV
          refs=()
          for a in $attrs; do refs+=("git+file://$PWD#packages.aarch64-darwin.$a"); done
          start=$(date +%s)
          nix build --dry-run "${refs[@]}" 2> /dev/null || echo "::warning::not all evaluated; the build says why"
          echo "evaluated in $(( $(date +%s) - start ))s"

      # nix's archive (flake.nix, `<app>-ios-archive`, over the phone's
      # slice alone), the cache's when nothing it is built from moved (a
      # pull request's: the simulator's slice and the screenshots' app);
      # the archive given its build number, the commit's time in seconds,
      # and on a `v*` tag its version, the tag's (`v1.2` is 1.2).
      #
      # **One kernel per commit.** A pull request's of this repository's
      # goes to the cache too (the push above; a fork's has no token), with
      # the screenshots' app over the same slice: app-screens takes a PR's
      # iPhone shots once this run has ended, so its Mac fetches both rather
      # than build them a second time.
      - name: Build the archive (on PRs the simulator's kernel and app), with nix
        env:
          APP: ${{ matrix.app.name }}
          NAME: ${{ matrix.app.App }}
        run: |
          # A pull request's: the simulator's kernel and the screenshots'
          # app, and no archive, which nothing would sign or send.
          # shellcheck disable=SC2086
          bash .github/nix-xcode.sh . "$XCODE" $ATTRS > "$RUNNER_TEMP/built"
          cat "$RUNNER_TEMP/built"
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            version=
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; fi
            bash .github/ios-archive.sh "$NAME" "$(awk -v p="$APP-ios-archive" '$1 == p {print $2}' "$RUNNER_TEMP/built")" "$(git log -1 --format=%ct)" $version
          fi

      - name: Sign (not on PRs), and send to TestFlight (v* tags; main only by the unstable hook)
        if: env.SEND != ''
        env:
          DESTINATION: ${{ env.SEND }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/ios-upload.sh "${{ matrix.app.App }}"

      - name: Remove the API key (not on PRs)
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
