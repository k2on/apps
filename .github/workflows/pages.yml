# The browser peer, published at https://k2on.github.io/apps/harken/, and
# the phone's F-Droid repository at https://k2on.github.io/apps/fdroid/repo.
#
# `nix build .#harken-web` is the whole build of the first; the second is
# laid out from the APK apk.yml built (below). What this file adds is a
# landing page above them and the two GitHub Pages actions. The repository's
# Pages source must be "GitHub Actions" (Settings → Pages).
#
# The nix store is kept between runs by nix-community/cache-nix-action, which
# puts it in GitHub's ordinary actions cache: free for a public repository,
# 10 GB per repository, shared with apk.yml. Not magic-nix-cache: it rode
# GitHub's legacy cache API, which GitHub turned off in early 2025, and
# Determinate's successor (FlakeHub Cache) needs an account. Everything but
# the wasm-bindgen CLI (compiled from crates.io at the locked version, a few
# minutes) is substituted from cache.nixos.org anyway, so the cache is worth
# that CLI and the Rust toolchain; the devshell is made a gc root below so
# the collection before saving keeps both.
name: pages

on:
  push:
    branches: [main]
  # Again when an APK is built, so that the F-Droid repository offers it:
  # a push deploys with the APK before it, and apk.yml's own run, a few
  # minutes behind, deploys the new one.
  workflow_run:
    workflows: [apk]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # cache-nix-action deletes the caches it superseded.
  actions: write

# One deployment at a time; a run in flight finishes before the next starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A failed APK run has nothing new to offer.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: nix-community/cache-nix-action@v6
        with:
          # The key names what the store was built from; a miss restores
          # the newest cache with the same prefix and builds the difference.
          primary-key: nix-web-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust/Cargo.lock') }}
          restore-prefixes-first-match: nix-web-${{ runner.os }}-
          # Collect garbage before saving, down to this, so the cache holds
          # what is rooted and not every intermediate ever fetched.
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-web-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Keep the build's tools
        run: nix develop .#harken-web --profile "$RUNNER_TEMP/harken-web-shell" --command true

      - name: Build the browser peer
        run: nix build .#harken-web --print-build-logs

      # The phone's F-Droid repository (harken/android/fdroid/README.md).
      #
      # The APK is not built here. apk.yml builds it with a store of its
      # own, cached at 6 GB against this one's 2 GB in the 10 GB the two
      # share, and building it again here would put gradle, the SDK and
      # aapt2 in this cache as well — or rebuild them on every push. So this
      # takes the newest APK apk.yml uploaded from main, which is why this
      # workflow also runs when apk.yml finishes.
      #
      # Pages deploys the site whole, so the versions the live repository
      # already offers are fetched back and kept, the newest three by
      # version code, and the index is signed again over all of them: with
      # the committed key, or with FDROID_KEYSTORE when that secret is set
      # (nix/fdroid.nix says why). The fdroid tooling is not made a gc root:
      # it is under a gigabyte from cache.nixos.org and two small Python
      # builds, against a cache the wasm toolchain already fills.
      #
      # Nothing here fails the deploy. No APK anywhere, the live repository
      # unreachable, or fdroid itself failing, and the site goes up without
      # fdroid/, saying so. The artifact is `harken-apk` (`harken.apk`); a
      # newest apk.yml run from before that name uploaded `harken-debug-apk`,
      # which is not looked for, and the repository offers what it already had
      # until the next apk.yml run.
      - name: Lay out the F-Droid repository
        env:
          GH_TOKEN: ${{ github.token }}
          FDROID_KEYSTORE: ${{ secrets.FDROID_KEYSTORE }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: |
          apks=()
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow apk.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$run" ] && gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --name harken-apk --dir "$RUNNER_TEMP/apk"; then
            apks=("$RUNNER_TEMP/apk/harken.apk")
          else
            echo "::notice::No APK from apk.yml; the F-Droid repository offers what it already had."
          fi
          if [ -z "$FDROID_KEYSTORE" ]; then
            echo "Signing the F-Droid index with the committed key; FDROID_KEYSTORE is not set."
          fi
          if nix run .#harken-fdroid -- repo --keep https://k2on.github.io/apps/fdroid/repo \
            "$RUNNER_TEMP/fdroid" "${apks[@]}"; then
            mkdir -p _site/fdroid
            cp -r "$RUNNER_TEMP/fdroid" _site/fdroid/repo
          else
            echo "::warning::No F-Droid repository in this deploy; the site goes up without fdroid/."
          fi

      - name: Assemble the site
        run: |
          mkdir -p _site/harken
          cp -r result/. _site/harken/
          chmod -R u+w _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>apps</title>
          <style>body{font:16px/1.5 system-ui,sans-serif;max-width:40em;margin:4em auto;padding:0 1em;color-scheme:light dark}</style></head>
          <body>
          <h1>apps</h1>
          <p>ArkDB is a local-first sync engine whose domain is written once and
          runs natively in Rust, Swift and Kotlin; harken, a music library with
          playlists, is the first app on it. <a href="harken/">harken/</a> is its
          browser peer — the same engine compiled to wasm, applying every entry
          through the interpreter over the module it embeds. Open it
          <em>alone</em> to run it entirely in this tab, or point it at a harken
          server. The source is at
          <a href="https://github.com/k2on/apps">github.com/k2on/apps</a>.</p>
          </body>
          </html>
          HTML
          if [ -d _site/fdroid/repo ]; then
            sed -i 's|^</body>|<p><a href="fdroid/repo/">fdroid/repo</a> is the Android app as an F-Droid repository: add that address in F-Droid and each APK built from main arrives as an update.</p>\n</body>|' _site/index.html
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
