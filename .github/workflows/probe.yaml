# A probe, for a branch: which clock each way of slowing a simulator's
# animations slows. The showcase's `clocks` probe moves three squares across
# the screen in one second each, by UIKit, SwiftUI and the render server,
# and is recorded at life's speed with each way in turn; a slowed square
# takes ten seconds. The recordings are uploaded to be measured.
name: probe

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe.yaml"]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        slowed: [none, render-server, drag-coefficient, layer-speed]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"

      - name: Boot an iPhone 17 Pro
        run: |
          runtime=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | sort_by(.version) | last | .identifier')
          type=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.name == "iPhone 17 Pro") | .identifier')
          udid=$(xcrun simctl create probe "$type" "$runtime")
          echo "$udid" > "$RUNNER_TEMP/udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null

      - name: XcodeGen
        uses: actions/cache@v4
        with:
          path: ~/screens-tools
          key: screens-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', '.github/screens/bundle.sh') }}

      - name: Build the showcase
        working-directory: showcase/ios
        run: |
          ~/screens-tools/bin/xcodegen generate
          xcodebuild build -quiet -project Showcase.xcodeproj -scheme Showcase -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO ARCHS=arm64

      - name: Record the clocks, slowed by ${{ matrix.slowed }}
        run: |
          udid=$(cat "$RUNNER_TEMP/udid")
          xcrun swiftc -O .github/screens/record.swift -o "$RUNNER_TEMP/record"
          xcrun simctl install "$udid" "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/Showcase.app"
          extra=()
          case "${{ matrix.slowed }}" in
            render-server)
              xcrun swiftc -O .github/probe/slow-animations.swift -o "$RUNNER_TEMP/slow-animations"
              "$RUNNER_TEMP/slow-animations" "$udid" on ;;
            drag-coefficient)
              xcrun simctl spawn "$udid" defaults write com.apple.UIKit UIAnimationDragCoefficient -float 10 ;;
            layer-speed)
              extra=(-layerSpeed 0.1) ;;
          esac
          xcrun simctl launch "$udid" dev.arkui.showcase -showcase clocks ${extra[@]+"${extra[@]}"} > /dev/null
          sleep 6
          "$RUNNER_TEMP/record" "$udid" 14 540 "$RUNNER_TEMP/clocks-${{ matrix.slowed }}.mov" &
          sleep 1
          xcrun simctl spawn "$udid" notifyutil -p dev.arkui.showcase.go
          wait

      - uses: actions/upload-artifact@v4
        with:
          name: clocks-${{ matrix.slowed }}
          path: ${{ runner.temp }}/clocks-${{ matrix.slowed }}.mov
