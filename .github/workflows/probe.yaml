# A probe, for a branch: whether timewarp.c (the animating frameworks'
# clocks slowed in the showcase) slows what nothing else did. The `clocks`
# probe moves three squares across the screen in a second each, by UIKit,
# SwiftUI and a CABasicAnimation, and the expanding card zooms; each is
# recorded plainly and with time ten times slower. Uploaded to be measured.
name: probe

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe.yaml"]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        shot: [clocks, expanding-card]
        warp: [1, 10]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"

      - name: Boot an iPhone 17 Pro
        run: |
          runtime=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | sort_by(.version) | last | .identifier')
          type=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.name == "iPhone 17 Pro") | .identifier')
          udid=$(xcrun simctl create probe "$type" "$runtime")
          echo "$udid" > "$RUNNER_TEMP/udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null

      - name: XcodeGen
        uses: actions/cache@v4
        with:
          path: ~/screens-tools
          key: screens-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', '.github/screens/bundle.sh') }}

      - name: Build the showcase, the recorder and the time warp
        run: |
          (cd showcase/ios && ~/screens-tools/bin/xcodegen generate &&
            xcodebuild build -quiet -project Showcase.xcodeproj -scheme Showcase -configuration Debug \
              -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
              -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO ARCHS=arm64)
          xcrun swiftc -O .github/screens/record.swift -o "$RUNNER_TEMP/record"
          xcrun -sdk iphonesimulator clang -arch arm64 -mios-simulator-version-min=17.0 -O2 -Wall \
            -dynamiclib -o "$RUNNER_TEMP/timewarp.dylib" .github/screens/timewarp.c
          codesign --force --sign - "$RUNNER_TEMP/timewarp.dylib"

      - name: Record ${{ matrix.shot }}, ${{ matrix.warp }} times slower
        run: |
          udid=$(cat "$RUNNER_TEMP/udid")
          warp=${{ matrix.warp }}
          xcrun simctl install "$udid" "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/Showcase.app"
          SIMCTL_CHILD_DYLD_INSERT_LIBRARIES="$RUNNER_TEMP/timewarp.dylib" SIMCTL_CHILD_TIMEWARP=$warp \
            xcrun simctl launch "$udid" dev.arkui.showcase -showcase ${{ matrix.shot }} -slow $warp > /dev/null
          sleep 6
          "$RUNNER_TEMP/record" "$udid" $((3 * warp + 3)) 540 "$RUNNER_TEMP/${{ matrix.shot }}-$warp.mov" &
          sleep 1
          xcrun simctl spawn "$udid" notifyutil -p dev.arkui.showcase.go
          wait
          xcrun simctl terminate "$udid" dev.arkui.showcase || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.shot }}-${{ matrix.warp }}
          path: ${{ runner.temp }}/${{ matrix.shot }}-${{ matrix.warp }}.mov
