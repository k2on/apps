# The docs' phone captures (https://k2on.github.io/apps/docs/): every shot
# docs/site/src/components.rs names, taken from a real Android emulator and a
# real iOS simulator, in light and dark, and committed to the `screens`
# branch with a manifest.json saying what is there and on which device.
#
# On its own time, after a push: nothing waits on it, and the docs page reads
# the branch through raw.githubusercontent.com when it loads, so a capture
# appears with nothing redeployed. A phone whose job fails keeps what it had
# on the branch. Pushed from a claude/** branch it captures and uploads, and
# publishes nothing.
#
# The shots come from the showcase apps (showcase/), one per phone: the
# shared components and a screen that draws one shot of them by name, with
# placeholder content — no app's code and no kernel, so neither needs Rust
# or nix to build.
name: screens

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "showcase/**"
      - "swift/ArkUI/**"
      - "harken/android/app/src/main/kotlin/dev/harken/android/ui/**"
      - "docs/site/src/components.rs"
      - ".github/screens/**"
      - ".github/workflows/screens.yaml"
  workflow_dispatch:

permissions:
  # The publish job's push to `screens`.
  contents: write

concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: true

env:
  FPS: "60"
  # How many times slower than life a recording is taken, then sped back up
  # (.github/screens/encode.sh): the CI devices draw too few frames to keep up.
  SLOW: "8"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The emulator wants KVM; the hosted runner has it, behind a udev rule.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The Gradle the showcase's plugins want; the runner's Android SDK.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Built under the nix steps (meanwhile.sh), and waited for before the
      # capture.
      - name: Start building the showcase
        run: |
          bash .github/screens/meanwhile.sh start showcase bash -c '
            gradle -p showcase/android :app:assembleDebug &&
            cp showcase/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/showcase.apk"'

      # The tools from the flake, from the cache once built, in place of
      # apt's and Homebrew's (which took nine minutes for ffmpeg on macOS).
      - uses: DeterminateSystems/nix-installer-action@main

      - if: vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - if: vars.CACHIX_NAME == ''
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-screens-android-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-screens-android-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-screens-android-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: ffmpeg
        run: |
          bin=$(nix build .#screens-ffmpeg --no-link --print-out-paths --print-build-logs | grep -- '-bin$')
          echo "$bin/bin" >> "$GITHUB_PATH"
          "$bin/bin/ffmpeg" -hide_banner -version | head -1

      - name: The showcase, built
        run: bash .github/screens/meanwhile.sh wait showcase

      - name: Capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          # The recordings are of animations: leave them on.
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/screens/android.sh "$RUNNER_TEMP/out/android" "$RUNNER_TEMP/showcase.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: screens-android
          path: ${{ runner.temp }}/out/android
          if-no-files-found: error

  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The newest Xcode 26 on the image, as ios.yaml.
      - name: Select Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::no Xcode 26 on this runner image"; exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      # The simulator boots under everything after it (meanwhile.sh) and is
      # waited for before the capture; even choosing the device is in the
      # background, as the first simctl call starts CoreSimulator and takes
      # a minute and a half. The newest iPhone Pro the newest iOS runtime
      # has, its name left in $RUNNER_TEMP/device.
      - name: Start booting a simulator
        run: |
          bash .github/screens/meanwhile.sh start boot bash -c '
            device=$(xcrun simctl list devices available -j | jq -r "
              .devices | to_entries | map(select(.key | test(\"iOS\"))) | sort_by(.key) | last | .value
              | map(select(.name | test(\"^iPhone [0-9]+ Pro$\"))) | sort_by(.name) | last | .name")
            echo "Booting $device"
            echo "$device" > "$RUNNER_TEMP/device"
            xcrun simctl boot "$device" && xcrun simctl bootstatus "$device" -b'

      # The tools from the flake, from the cache once built, in place of
      # apt's and Homebrew's (which took nine minutes for ffmpeg on macOS).
      - uses: DeterminateSystems/nix-installer-action@main

      - if: vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - if: vars.CACHIX_NAME == ''
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-screens-ios-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-screens-ios-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-screens-ios-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # The showcase builds under the ffmpeg step and the boot: XcodeGen
      # from the flake (upstream's release, pinned), then xcodebuild.
      - name: Start building the showcase for the simulator
        run: |
          xcodegen=$(nix build .#xcodegen --no-link --print-out-paths)
          bash .github/screens/meanwhile.sh start showcase bash -c '
            cd showcase/ios && "$1/bin/xcodegen" generate &&
            xcodebuild build \
              -project Showcase.xcodeproj -scheme Showcase -configuration Debug \
              -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
              -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO' build "$xcodegen"

      - name: ffmpeg
        run: |
          bin=$(nix build .#screens-ffmpeg --no-link --print-out-paths --print-build-logs | grep -- '-bin$')
          echo "$bin/bin" >> "$GITHUB_PATH"
          "$bin/bin/ffmpeg" -hide_banner -version | head -1

      - name: The showcase, built
        run: bash .github/screens/meanwhile.sh wait showcase

      - name: The simulator, booted
        run: bash .github/screens/meanwhile.sh wait boot

      - name: Capture
        run: |
          bash .github/screens/ios.sh "$RUNNER_TEMP/out/ios" \
            "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/Showcase.app" \
            dev.arkui.showcase "$(cat "$RUNNER_TEMP/device")"

      - uses: actions/upload-artifact@v4
        with:
          name: screens-ios
          path: ${{ runner.temp }}/out/ios
          if-no-files-found: error

  # The branch, one commit: what it had, each phone that captured this run
  # replaced, and the manifest written over all of it.
  publish:
    needs: [android, ios]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: screens-*
          path: ${{ runner.temp }}/new

      - name: Lay out the branch
        run: |
          branch="$RUNNER_TEMP/branch"
          mkdir -p "$branch"
          if git fetch --depth 1 origin screens; then
            git --work-tree="$branch" checkout FETCH_HEAD -- .
          fi
          for p in android ios; do
            if [ -d "$RUNNER_TEMP/new/screens-$p" ]; then
              rm -rf "${branch:?}/$p"
              cp -r "$RUNNER_TEMP/new/screens-$p" "$branch/$p"
            fi
          done
          python3 -I .github/screens/manifest.py "$branch" "${{ github.run_id }}" "${{ github.sha }}"
          cat "$branch/manifest.json"

      - name: Publish
        working-directory: ${{ runner.temp }}/branch
        run: |
          git init -q -b screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "screens from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screens
