# An experiment: can the iPhone builds keep nix's strict sandbox, with Xcode
# itself an input in the store? (flake.nix, `strictIos`.)
#
# The runner's Xcode is put in the store by its own hash (`nix-store
# --add-fixed --recursive`): nothing is downloaded, and nothing of Apple's
# goes to a cache (its licence does not allow it). Then four builds, each
# with the strict sandbox and none of them `__noChroot`, each going on
# whether the last built or not, so one run says how far strict reaches:
#
#   A  Xcode from the store runs: xcodebuild, xcrun, swiftc
#   B  a C file compiled and linked for the simulator
#   E  xcodebuild doing work (an xcframework of B's library), with the
#      sandbox as it is and with rules of its own reaching the system's
#      services: the first run's crashed with the sandbox as it is
#   C  money's kernel, as its xcframework (laid out without xcodebuild)
#   D  the money app for the simulator, as app-screens would take it
#
# Run by hand, or by a push that moves this file.
name: xcode-strict

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/xcode-strict.yaml"

permissions:
  contents: read

jobs:
  strict:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The newest Xcode 26, and only it: the others are room the store needs.
      - name: Xcode, and room for it twice
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          [ -n "$xcode" ] || { echo "::error::no Xcode 26 on this image"; exit 1; }
          xcode=$(cd "$xcode" && pwd -P)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          for other in /Applications/Xcode*.app; do
            [ "$(cd "$other" && pwd -P)" = "$xcode" ] || sudo rm -rf "$other"
          done
          du -sh "$xcode"
          df -h /
          echo "XCODE=$xcode" >> "$GITHUB_ENV"

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            sandbox = true
            extra-substituters = https://k2on.cachix.org
            extra-trusted-public-keys = k2on.cachix.org-1:oI4Db0uW5ER+s4Te/MrXSmjWUWkOc9rmKdzsgUDxQP8=

      - name: The sandbox is strict
        run: |
          nix config show sandbox
          [ "$(nix config show sandbox)" = true ] || { echo "::error::the sandbox is not strict"; exit 1; }

      # Its hash is what a flake would pin: the same Xcode gives the same
      # path on any runner, and a different one a different path.
      - name: Xcode, into the store by its hash
        run: |
          start=$(date +%s)
          path=$(nix-store --add-fixed --recursive sha256 "$XCODE")
          echo "added in $(( $(date +%s) - start ))s: $path"
          nix path-info -Sh "$path"
          nix hash path "$path"
          echo "STORE_XCODE=$path" >> "$GITHUB_ENV"
          df -h /

      - name: A, Xcode from the store runs
        id: a
        continue-on-error: true
        run: bash .github/strict-ios.sh a-runs

      - name: B, a C file for the simulator
        id: b
        continue-on-error: true
        run: bash .github/strict-ios.sh b-compiles

      # Why the first run's `xcodebuild -create-xcframework` crashed: the
      # same command over B's library, with the sandbox as it is and with
      # its own rules letting it reach the system's services.
      - name: E, xcodebuild with the sandbox as it is
        id: e1
        continue-on-error: true
        run: bash .github/strict-ios.sh e-xcframework-none

      - name: E, xcodebuild reaching Xcode's and CoreSimulator's services
        id: e2
        continue-on-error: true
        run: bash .github/strict-ios.sh e-xcframework-xcode-services

      - name: E, xcodebuild reaching any service
        id: e3
        continue-on-error: true
        run: bash .github/strict-ios.sh e-xcframework-all-services

      # Is it the sandbox, or the store's copy of Xcode? The same command
      # outside any sandbox: with the store's xcodebuild, and with the
      # runner's own as it is installed. Then what macOS wrote of each
      # crash: where xcodebuild was when it fell.
      - name: E, the same outside the sandbox, from the store and as installed
        id: e4
        continue-on-error: true
        run: |
          set -x
          work=$(mktemp -d)
          cd "$work"
          printf 'int answer(void) { return 42; }\n' > a.c
          mkdir -p h && echo 'int answer(void);' > h/a.h
          tc=$XCODE/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin
          sdk=$XCODE/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk
          "$tc/clang" -target arm64-apple-ios17.0-simulator -isysroot "$sdk" -c a.c -o a.o && "$tc/ar" rcs liba.a a.o
          echo "== installed Xcode, no sandbox"
          DEVELOPER_DIR=$XCODE/Contents/Developer "$XCODE/Contents/Developer/usr/bin/xcodebuild" \
            -create-xcframework -library liba.a -headers h -output installed.xcframework && echo "installed: ok" || echo "installed: exit $?"
          echo "== the store's Xcode, no sandbox"
          DEVELOPER_DIR=$STORE_XCODE/Contents/Developer "$STORE_XCODE/Contents/Developer/usr/bin/xcodebuild" \
            -create-xcframework -library liba.a -headers h -output store.xcframework && echo "store: ok" || echo "store: exit $?"
          echo "== what differs: one framework xcodebuild loads, as installed and as stored"
          f=Contents/SharedFrameworks/DVTFoundation.framework
          ls -la "$XCODE/$f/Versions/A/" | head; ls -la "$STORE_XCODE/$f/Versions/A/" | head
          xattr -l "$XCODE/$f/Versions/A/DVTFoundation" | head -5 || true
          codesign -v "$XCODE/Contents/Developer/usr/bin/xcodebuild" && echo "installed signature: valid"
          codesign -v "$STORE_XCODE/Contents/Developer/usr/bin/xcodebuild" && echo "store signature: valid" || echo "store signature: INVALID"
          codesign -v --deep "$STORE_XCODE/$f" && echo "store DVTFoundation: valid" || echo "store DVTFoundation: INVALID"
          ls -la "$STORE_XCODE/Contents" | head -12

      - name: E, what macOS wrote of xcodebuild's crashes
        if: always()
        run: |
          for d in /Library/Logs/DiagnosticReports ~/Library/Logs/DiagnosticReports; do
            sudo find "$d" -iname '*xcodebuild*' -newer "$GITHUB_ENV" 2>/dev/null
          done | head -5 | while read -r r; do
            echo "===== $r"
            sudo head -c 6000 "$r" | grep -v '^\s*$' | head -80
          done

      - name: C, money's kernel
        id: c
        continue-on-error: true
        run: bash .github/strict-ios.sh c-kernel

      - name: D, the money app, reaching Xcode's and CoreSimulator's services
        id: d1
        continue-on-error: true
        run: bash .github/strict-ios.sh d-app-xcode-services

      - name: D, the money app, reaching any service
        id: d2
        continue-on-error: true
        run: bash .github/strict-ios.sh d-app-all-services

      - name: How far strict reached
        run: |
          {
            echo "### Strict sandbox, Xcode in the store"
            echo
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| A, Xcode runs | ${{ steps.a.outcome }} |"
            echo "| B, C for the simulator | ${{ steps.b.outcome }} |"
            echo "| E, xcodebuild, sandbox as it is | ${{ steps.e1.outcome }} |"
            echo "| E, xcodebuild, Xcode's and CoreSimulator's services | ${{ steps.e2.outcome }} |"
            echo "| E, xcodebuild, any service | ${{ steps.e3.outcome }} |"
            echo "| E, outside the sandbox (see its log) | ${{ steps.e4.outcome }} |"
            echo "| C, money's kernel | ${{ steps.c.outcome }} |"
            echo "| D, the money app, Xcode's services | ${{ steps.d1.outcome }} |"
            echo "| D, the money app, any service | ${{ steps.d2.outcome }} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
