[package]
name = "devices-core"
version = "0.1.0"
workspace = "../../rust"
edition = "2021"
description = "devices' core in plain Rust (docs/plan-v5.md §1.16): the domain of a household's managed phones — the policies a server declares, who each applies to, and what each phone last reported of itself."

[lib]
name = "devices_core"
path = "src/lib.rs"

[dependencies]
ark = { path = "../../rust/ark" }
serde = { workspace = true }
serde_json = { workspace = true }
