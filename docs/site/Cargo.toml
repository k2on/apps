[package]
name = "docs"
version = "0.1.0"
description = "The documentation site, an Ark app (app.toml): a page per shared component in ArkUI's shell, exported as static HTML that works without script and is taken over by its module, with ArkUI's own live specimens and pictures of arkui's drawn by arkui itself."
edition = "2021"
license = "MIT OR Apache-2.0"

# A workspace of its own, with its own lockfile, so that the docs and the
# apps never share a build: an edit here moves no input of ArkDB's kernel or
# of any app's, and an edit there moves the docs only through the crates they
# name (arkui, ark-app and its page's arkui-web now; ArkDB's when its docs
# join).
[workspace]

# The site is an Ark app: its part of its host (`app::Docs`), its routes,
# its pages, said in the views every toolkit draws, and no toolkit named.
# Its page is generated from app.toml (ui/prebuild.py's `web`), as every
# app's is: `docs-web`, the module for wasm32 and, natively, the export
# that writes every page (ui/docs/app.md, "Export"), which runs
# `export::prepare` first (feature `native`): the desktop pictures drawn by
# iced's own renderer on the CPU (tiny-skia, no window and no GPU) and
# catalogue.json.
[lib]
name = "docs"
path = "src/lib.rs"

[dependencies]
ark-app = { path = "../../ui/rust/app" }
# The site's routes, declared once (`routes`), as every app's are.
ark-router = { path = "../../ui/rust/router" }
arkui-glyphs = { path = "../../ui/rust/glyphs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arkui = { path = "../../ui/rust/arkui", features = ["app"], optional = true }
# The apps' iced (rust/Cargo.toml says which and why), at the same revision.
iced = { git = "https://github.com/pop-os/iced", rev = "d5d638c3a3022396fcf5b9b588b3446820dc11ad", default-features = false, features = ["winit", "wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "x11", "wayland", "a11y", "smol", "svg", "image", "advanced", "fira-sans"], optional = true }
# A UserInterface built, drawn and read back off screen: iced_test's
# Simulator, less the part that keeps the pixels to itself.
iced_runtime = { git = "https://github.com/pop-os/iced", rev = "d5d638c3a3022396fcf5b9b588b3446820dc11ad", optional = true }
# The pictures, as lossless WebP: a third smaller than a PNG of flat colour.
image = { version = "0.25", default-features = false, features = ["webp"], optional = true }

[dev-dependencies]
# The tests drive the site as its page does, and export it: the browser's
# host (arkui-web's `ssr` side), never the app's own code's.
arkui-web = { path = "../../ui/rust/web", default-features = false, features = ["ssr"] }

[features]
default = ["native"]
native = ["dep:arkui", "dep:iced", "dep:iced_runtime", "dep:image"]
# What `#[view]` writes beside each view under its crate's features:
# `web(&record)` and `iced(&record)`. Unused here; said so cargo knows them.
web = []
iced = []
