[package]
name = "docs"
version = "0.1.0"
description = "The documentation site, generated: a page of HTML per shared component, with pictures of arkui's drawn by arkui itself."
edition = "2021"
license = "MIT OR Apache-2.0"

# A workspace of its own, with its own lockfile, so that the docs and the
# apps never share a build: an edit here moves no input of ArkDB's kernel or
# of any app's, and an edit there moves the docs only through the crates they
# name (arkui now; ArkDB's when its docs join).
[workspace]

# A generator, run once at build time: `cargo run -- <dir>` writes the site,
# plain HTML and CSS with a few lines of script, into <dir>. A desktop
# component's picture is the component, drawn by iced's own renderer on the
# CPU (tiny-skia, no window and no GPU), so a picture of a menu cannot drift
# from the menu. `--json` prints the catalogue instead.

[dependencies]
arkui = { path = "../../rust/arkui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iced = { version = "0.14", features = ["smol", "svg", "image", "advanced", "fira-sans"] }
# A UserInterface built, drawn and read back off screen: iced_test's
# Simulator, less the part that keeps the pixels to itself.
iced_runtime = "0.14"
# The pictures, as lossless WebP: a third smaller than a PNG of flat colour.
image = { version = "0.25", default-features = false, features = ["webp"] }
