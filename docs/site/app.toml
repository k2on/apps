# The docs as an Ark app (ui/docs/app.md, "The App's Files"): a static site
# with no data of its own, no server and no first run. Its page is
# generated from this, as every app's is (ui/prebuild.py's `web`), and its
# export writes every page (ui/docs/app.md, "Export";
# `nix run .#docs-export-web`). Nothing generated is committed.

name = "ArkUI"
id = "docs"
version = "0.1"
# ui/theme.toml's [accent.blue].
accent = "blue"
platforms = ["web"]
# Its crate is this directory's (no core, server or demo beside it), and
# its part of its host is the `App` it declares (src/lib.rs).

[icon]
svg = "icon.svg"

[web]
# Every page written ahead, whole without script, and taken over by its
# module (ui/docs/app.md, "The Browser's Modes").
modes = ["ssg"]
# Its own styles after ArkUI's, what every page's <head> says besides, and
# the files its pages load, written beside them as they are (Expo's
# `public/`).
css = ["public/docs.css"]
head = "public/head.html"
files = ["public/docs.js"]
# What its export works out natively before its pages are written: the
# desktop pictures, drawn by arkui itself, and catalogue.json.
prepare = "export::prepare"
# Where it is published under the site, in one channel (main's): /apps/docs/.
path = "docs"

[channels]
stable = false
