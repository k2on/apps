[package]
name = "harken-desktop"
workspace = "../../rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "harken's terminal peer: ratatui over the ark runtime and harken's own domain, run natively, alone or against a server."

[[bin]]
name = "harken-desktop"
path = "src/main.rs"

[dependencies]
ark = { path = "../../rust/ark" }
harken-domain = { path = "../domain" }
ratatui = "0.29"
crossterm = "0.28"
tungstenite = "0.26"
rand = "0.8"
