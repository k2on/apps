[package]
name = "harken-domain"
version = "0.1.0"
workspace = "../../rust"
edition = "2021"
description = "harken's domain in plain Rust (docs/plan-v5.md §1.16): its schema, types and functions, and its tests."

[lib]
name = "harken_domain"
path = "src/lib.rs"

[dependencies]
ark = { path = "../../rust/ark" }
ark-auth = { path = "../../rust/ark-auth" }
serde = { workspace = true }
serde_json = { workspace = true }
# The typed path to the phones (docs/plan-v5.md, Experiment: one generator):
# the domain's types as UniFFI records, its functions as UniFFI functions.
uniffi = { version = "0.32.2", default-features = false, optional = true }
ark-ffi = { path = "../../rust/ark-ffi", optional = true }
ark-macros = { path = "../../rust/ark-macros", optional = true }

[features]
ffi = ["dep:uniffi", "dep:ark-ffi", "dep:ark-macros"]

[dev-dependencies]
ark-peer = { path = "../../rust/ark-peer" }
ark-dev = { path = "../../rust/ark-dev" }
