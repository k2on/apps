[package]
name = "harken-domain"
version = "0.1.0"
workspace = "../../rust"
edition = "2021"
description = "harken's domain on ArkDB v5 (docs/plan-v5.md §1.12): the tables, the library, the playlists and the listening session, as #[ark::*] functions."

[lib]
name = "harken_domain"
path = "src/lib.rs"

[[bin]]
name = "harken-domain"
path = "src/main.rs"

[dependencies]
ark = { path = "../../rust/ark" }

[dev-dependencies]
ark-client = { path = "../../rust/ark-client" }
ark-server = { path = "../../rust/ark-server" }
ark-dev = { path = "../../rust/ark-dev" }
