[package]
name = "harken-gen-check"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Compiles what `arkc gen rust` wrote from harken.ark against ark::gen, and runs one mutator through it beside the interpreter."

[lib]
path = "src/lib.rs"

[dependencies]
ark = { path = "../../../rust/ark" }

# Its own workspace, deliberately: the file it includes is whatever `arkc gen
# rust` last wrote, and a generator regression must not take the engine
# workspace's build down with it. Build it on its own:
#
#     cargo build --manifest-path harken/domain/gen-check/Cargo.toml
[workspace]
