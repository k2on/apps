[package]
name = "harken-domain5"
version = "0.1.0"
workspace = "../../rust"
edition = "2021"
description = "harken's domain on ArkDB v5 (docs/plan-v5.md §1.12): the tables, the library, the playlists and the listening session, as #[ark::*] functions."

[lib]
name = "harken_domain5"
path = "src/lib.rs"

[[bin]]
name = "harken-domain5"
path = "src/main.rs"

[dependencies]
ark5 = { path = "../../rust/ark5" }

[dev-dependencies]
ark5-client = { path = "../../rust/ark5-client" }
ark5-server = { path = "../../rust/ark5-server" }
ark5-dev = { path = "../../rust/ark5-dev" }
