[package]
name = "harken-ffi"
version = "0.1.0"
workspace = "../../rust"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "harken's library for its phones (docs/plan-v5.md §1.16, N3): ark-ffi with harken's domain linked in, one shared library the apps load."

[lib]
name = "harken_ffi"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
ark = { path = "../../rust/ark" }
ark-ffi = { path = "../../rust/ark-ffi" }
ark-peer = { path = "../../rust/ark-peer" }
harken-domain = { path = "../domain" }
serde_json = { workspace = true }
uniffi = { version = "0.32.2", default-features = false }

[dev-dependencies]
tempfile = "3"
# The typed Kotlin and Swift the apps call the domain with, held to what the
# generator writes now (tests/gen.rs).
ark-dev = { path = "../../rust/ark-dev" }
ark-explorer = { path = "../../rust/ark-explorer", default-features = false }
