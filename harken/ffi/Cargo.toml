[package]
name = "harken-ffi"
version = "0.1.0"
workspace = "../../rust"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "harken's library for its phones (docs/plan-v5.md §1.16, N3): ark-ffi with harken's domain linked in, one shared library the apps load."

[lib]
name = "harken_ffi"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
ark = { path = "../../rust/ark" }
ark-ffi = { path = "../../rust/ark-ffi" }
# Every number, day and length as the apps write them, for the phones too
# (re-exported in lib.rs, so its functions are in this library).
ark-format = { path = "../../rust/ark-format" }
ark-format-ffi = { path = "../../rust/ark-format-ffi" }
ark-peer = { path = "../../rust/ark-peer", default-features = false }
harken-domain = { path = "../domain" }
# Where harken can be (its routes), as the phones read them.
harken-app = { path = "../app" }
harken-player = { path = "../player" }
serde_json = { workspace = true }
uniffi = { version = "0.32.2", default-features = false }

[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }
# The typed Kotlin and Swift the apps call the domain with, held to what the
# generator writes now (tests/gen.rs).
arkdb = { path = "../../rust/arkdb" }
