[package]
name = "harken-iced"
workspace = "../../rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "harken's desktop and browser client: the library, the table, the menus and the listening session, on arkui, ark-client and the domain."

[features]
# A standalone demo: no server, no sign-in, a seeded library, its own
# authority. What GitHub Pages publishes, and a separate build from the real
# client on purpose — a flag could be set by accident, a feature has to be
# asked for at build time.
demo = []

[dependencies]
harken-domain = { path = "../domain" }
ark-client = { path = "../../rust/ark-client" }
# Signing in: a loopback listener and the browser on the desktop, the page's
# own address in a browser; and the logins a device remembers.
ark-auth = { path = "../../rust/ark-auth", features = ["client"] }
arkui = { path = "../../rust/arkui" }
# `E`: the database explorer over this device's replica (`docs/plan-guards.md`
# D4), read-only but for the CRUD the domain exposes.
ark-explorer = { path = "../../rust/ark-explorer" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `smol` gives iced a timer to drive the tick. `svg` is every glyph, `image`
# a cover, `advanced` the scroll operation that keeps the cursor on screen.
# `fira-sans` is the typeface (the port leaves the vendored Inter behind).
iced = { version = "0.14", features = ["smol", "svg", "image", "advanced", "fira-sans"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGL rather than WebGPU, for reach: without it wgpu finds no backend and
# the software fallback cannot have the canvas WebGL already claimed.
iced = { version = "0.14", features = ["webgl", "svg", "image", "advanced", "fira-sans"] }
# `HtmlAudioElement` is the now-playing bar: handing a URL to the platform
# buys streaming, buffering, range requests and seeking.
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "Element", "HtmlAudioElement", "HtmlMediaElement"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
