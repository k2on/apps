[package]
name = "harken-iced"
workspace = "../../rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "harken's desktop client: the library, the table, the menus and the listening session, on arkui, ArkDB v5's client and the domain."

[features]
# A standalone demo: no server, no sign-in, a seeded library, its own
# authority. A separate build from the real client on purpose — a flag
# could be set by accident, a feature has to be asked for at build time.
demo = ["dep:harken-seed"]

[dependencies]
ark = { path = "../../rust/ark" }
harken-domain = { path = "../domain" }
# Where harken can be: its routes.
harken-app = { path = "../app" }
# The demo's library (`harken/demo`), with the `demo` feature only.
harken-seed = { path = "../demo", default-features = false, optional = true }
# The one reconciler, the phones' and the speakers', over this window's player.
harken-player = { path = "../player" }
ark-peer = { path = "../../rust/ark-peer", default-features = false }
# Signing in: a loopback listener and the system's browser; and the logins
# a device remembers.
ark-auth = { path = "../../rust/ark-auth", default-features = false }
arkui = { path = "../../ui/rust/arkui" }
# The podcast directory's answer, read (`directory.rs`).
serde = { workspace = true }
serde_json = { workspace = true }

# `smol` gives iced an executor and the clock that runs while audio plays or a
# submenu dwells — and only then (`docs/plan-reactive.md`). `svg` is every
# glyph, `image` a cover, `advanced` the scroll operation that keeps the cursor
# on screen and the recipes `tests/wake.rs` runs.
# `fira-sans` is the typeface (the port leaves the vendored Inter behind).
iced = { workspace = true }
# The sync socket natively: the token first, then frames, and the server's
# close code read (4401 is a login turned away).
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
# Searching the podcast directory, blocking on a thread of its own, as
# arkui fetches a picture.
ureq = { version = "2", default-features = false, features = ["tls"] }
# The window photographed for the apps' screenshots, when `ARK_SHOTS` asks
# (.github/screens/apps.md): this same application, run headless.
arkui-shots = { path = "../../ui/rust/shots" }

[dev-dependencies]
# The software renderer iced falls back to, built with no window: what
# `tests/bench.rs` lays a page out and draws it with.
iced_tiny_skia = { workspace = true }
