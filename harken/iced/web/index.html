<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>harken</title>
    <!-- Generated from `branding/`, and it carries both themes itself, so the
         splash below draws it as an ordinary <img> and it is the right gold
         on either page without this file naming a colour. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      /* iced picks light or dark from the system; the page behind it agrees,
         or a dark window loads over a white flash. */
      html, body {
        margin: 0;
        height: 100%;
        color-scheme: light dark;
        overflow: hidden;
      }
      /* iced appends its canvas to <body> and sizes it to 100%. */
      canvas { display: block; }
      /* The mark over the app until the app says it is staying: it adds
         `done` (`auth::reveal`), not before — a page still asking whether it
         has a server, or about to go to sign in, keeps the mark. A module
         that never loads leaves the mark, not a blank page. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        background: Canvas;
        transition: opacity 250ms ease-out;
      }
      #boot img { width: 96px; height: 96px; }
      #boot.done { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="boot"><img src="favicon.svg" alt="harken" /></div>
    <script type="module">
      // `?v=dev` is rewritten to the build's store hash, on both files: a
      // browser holding the last build never asks about either (the nix
      // store's 1970 `Last-Modified` makes them fresh for years), and a page
      // naming URLs the cache has never seen is what reaches it. The wasm is
      // named here because the glue derives it from its own URL with the
      // query dropped.
      import init from "./pkg/harken-iced.js?v=dev";
      await init({ module_or_path: new URL("pkg/harken-iced_bg.wasm?v=dev", document.baseURI) });

      // Two fingers sideways are the browser's own back and forward, which
      // knows when the fingers lift: a sideways wheel is kept from the canvas,
      // whose handler would cancel it, and so never reaches the app's own
      // swipe (`arkui::swipe`, for the desktop). Nothing in the app scrolls
      // sideways. On the window, capturing, so it is asked before the canvas.
      addEventListener(
        "wheel",
        (e) => {
          if (!e.ctrlKey && Math.abs(e.deltaX) > Math.abs(e.deltaY)) e.stopImmediatePropagation();
        },
        { capture: true, passive: true },
      );

      // The keyboard reaches the app only while its canvas has the focus, and
      // a loaded page focuses <body>; so the canvas is focused on arrival and
      // whenever the window comes back.
      const grab = () => document.querySelector("canvas")?.focus();
      addEventListener("focus", grab);
      grab();
    </script>
  </body>
</html>
