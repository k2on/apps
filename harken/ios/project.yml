# XcodeGen project for the iOS peer. `xcodegen generate` here writes
# Harken.xcodeproj; nothing under it is committed.
#
# One target, one package: the Swift runtime, its client library and the
# authoring vocabulary from ../../swift, and harken's domain — authored in
# Swift, as `arkc gen swift --only …` prints it (flake.nix clientFunctions) — from ../domain/gen/swift,
# referenced in place (never copied: a copy is a second thing to keep in
# step with the domain it spells).
name: Harken
options:
  bundleIdPrefix: dev.arkdb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ArkDB:
    path: ../../swift
targets:
  Harken:
    type: application
    platform: iOS
    sources:
      - path: Harken
      - path: ../domain/gen/swift
        name: Domain
    dependencies:
      - package: ArkDB
        product: ArkDB
      - package: ArkDB
        product: ArkDBClient
      - package: ArkDB
        product: ArkAuthoring
    info:
      path: Harken/Info.plist
      properties:
        CFBundleDisplayName: Harken
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The dev server speaks plain ws://; a development peer is allowed to.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arkdb.harken
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
