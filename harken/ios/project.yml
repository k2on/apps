# XcodeGen project for the iOS peer. `xcodegen generate` here writes
# Harken.xcodeproj; nothing under it is committed.
#
# One target over harken's library for iOS — `nix build
# .#harken-ios-xcframework -o ../ffi/ios` on a Mac: `HarkenFFI.xcframework`
# (the Rust kernel with harken's domain linked in, for a phone and the
# simulator) and `swift/`, the Swift UniFFI writes for it with the bridge's
# typed half — and the app's own sources, the generated types in
# `Harken/Gen/` among them.
name: Harken
options:
  bundleIdPrefix: dev.arkdb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Harken:
    type: application
    platform: iOS
    sources:
      - path: Harken
      - path: ../ffi/ios/swift
    dependencies:
      - framework: ../ffi/ios/HarkenFFI.xcframework
        embed: false
    info:
      path: Harken/Info.plist
      properties:
        CFBundleDisplayName: Harken
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The dev server speaks plain http:// and ws://; a development peer is allowed to.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arkdb.harken
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
