# XcodeGen project for the iOS peer. `xcodegen generate` here writes
# Harken.xcodeproj; nothing under it is committed.
#
# One target, one package: the Swift runtime and its client from
# ../../swift, and harken's module, ../domain/harken.ark — the file the
# domain crate writes and every peer runs — copied into the bundle as a
# resource, referenced in place (never copied into this tree: a copy is a
# second thing to keep in step with the domain).
name: Harken
options:
  bundleIdPrefix: dev.arkdb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ArkDB:
    path: ../../swift
targets:
  Harken:
    type: application
    platform: iOS
    sources:
      - path: Harken
      - path: ../domain/harken.ark
        buildPhase: resources
    dependencies:
      - package: ArkDB
        product: ArkDB
      - package: ArkDB
        product: ArkDBClient
    info:
      path: Harken/Info.plist
      properties:
        CFBundleDisplayName: Harken
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The dev server speaks plain http:// and ws://; a development peer is allowed to.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arkdb.harken
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
