[package]
name = "harken-player"
version = "0.1.0"
workspace = "../../rust"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "harken's players' adapters (docs/plan-v5.md §1.9): the domain's reconciler driven over a device's own peer, and the peers' configuration."

[dependencies]
ark = { path = "../../rust/ark" }
ark-peer = { path = "../../rust/ark-peer", default-features = false }
harken-domain = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
