[package]
name = "harken-server"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "harken's server on ark-server: the log with harken's procedures native, sign-in (ark-auth), a media directory authored as a peer, one listening session per account over live rooms, the house's speakers as devices, and the browser client"
workspace = "../../rust"

[[bin]]
name = "harken-server"
path = "src/main.rs"

# A peer with no screen, driven by JSON lines: what the process fleet
# (tests/fleet.rs) and the VM test run as a device (docs/plan-fleet.md §1).
# A binary of this package because `CARGO_BIN_EXE_*` reaches only the
# binaries of the crate whose tests run.
[[bin]]
name = "harken-peer"
path = "src/bin/harken-peer.rs"

[dependencies]
ark = { path = "../../rust/ark" }
# The scanner is an ark-client peer in this process; it dials the hub, never
# a socket, so it needs no TLS.
ark-client = { path = "../../rust/ark-client", default-features = false }
ark-server = { path = "../../rust/ark-server" }
# `client` for harken-peer, which signs in the way the desktop does.
ark-auth = { path = "../../rust/ark-auth", features = ["server", "client"] }
harken-domain = { path = "../domain" }
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# `lofty` reads the tags out of a file — a scanner that guessed them from the
# path would be wrong for every library not laid out the way it expected.
# `notify` is the watch, so a file added after boot does not wait for a
# rescan that may never come.
lofty = "0.25"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# Home Assistant, over its REST API: blocking, on a thread of its own. The
# same ureq ark-auth talks to an identity provider with.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde_json = { workspace = true }

[dev-dependencies]
ark-auth = { path = "../../rust/ark-auth", features = ["server", "client"] }
# The fleet stops the server with SIGTERM, which std cannot send.
libc = "0.2"
tempfile = "3"
ureq = { version = "2", default-features = false }
