[package]
name = "harken-server"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "harken's server, an ark-peer that listens: the log and the listening session (harken/domain, linked) on the hub, sign-in (ark-auth), a media directory authored as a peer, the door the house's peer signs in at, and the browser client"
workspace = "../../rust"

[[bin]]
name = "harken-server"
path = "src/main.rs"

# A peer with no screen (`harken/peer`): driven by JSON lines, what the
# process fleet (tests/fleet.rs) and the VM test run as a device
# (docs/plan-fleet.md §1); with `--house`, the house's speakers. A binary of
# this package because `CARGO_BIN_EXE_*` reaches only the binaries of the
# crate whose tests run; the server's library uses nothing of it.
[[bin]]
name = "harken-peer"
path = "src/bin/harken-peer.rs"

[dependencies]
ark = { path = "../../rust/ark" }
serde = { workspace = true }
harken-domain = { path = "../domain" }
# `harken-peer`, the binary beside the server (above).
harken-peer = { path = "../peer" }
# The server is a peer that listens; the scanner is a peer in this process
# that reaches it through its handle, never a socket.
ark-peer = { path = "../../rust/ark-peer" }
ark-auth = { path = "../../rust/ark-auth" }
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# `lofty` reads the tags out of a file — a scanner that guessed them from the
# path would be wrong for every library not laid out the way it expected.
# `notify` is the watch, so a file added after boot does not wait for a
# rescan that may never come.
lofty = "0.25"
# A picture inside a file is kept once, named by its hash, and served from
# the data directory beside `/media` — the same `ServeDir` ark-peer serves
# the media root with.
sha2 = { workspace = true }
tower-http = { version = "0.5", features = ["fs"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
serde_json = { workspace = true }

[dev-dependencies]
# The simulator, for a log written before the server starts.
ark-dev = { path = "../../rust/ark-dev" }
# The fleet stops the server with SIGTERM, which std cannot send.
libc = "0.2"
tempfile = "3"
ureq = { version = "2", default-features = false }
# The admin page's wire, read back as the page reads it.
ark-explorer = { path = "../../rust/ark-explorer", default-features = false }
