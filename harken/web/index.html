<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>harken</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header>
    <h1>harken</h1>
    <label>server <input id="server" size="32" spellcheck="false"></label>
    <label>user <input id="user" size="10" spellcheck="false"></label>
    <button id="connect">connect</button>
    <button id="alone" title="no server: this peer is its own authority">alone</button>
    <button id="stop">stop</button>
  </header>
  <main>
    <section id="library">
      <h2>Library <small class="count"></small></h2>
      <p class="note"></p>
      <p id="seed" hidden>Alone, nothing scans a library. <button title="author a few tracks through add_track, as the scanner would">add demo tracks</button></p>
      <table>
        <thead><tr><th>Title</th><th>Artist</th><th>Album</th><th class="num">Time</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <section id="playlists">
      <h2>Playlists</h2>
      <form><input id="new-name" placeholder="new playlist" autocomplete="off"><button>new</button></form>
      <p class="note"></p>
      <ul></ul>
    </section>
    <section id="items">
      <h2>Playlist</h2>
      <p class="none">Select a playlist.</p>
      <p class="empty" hidden>Nothing on it yet — press + on a track.</p>
      <p class="note"></p>
      <table>
        <thead><tr><th class="num">#</th><th>Title</th><th>Artist</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <footer id="status">not open</footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
