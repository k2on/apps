# Which crate may depend on which (ui/docs/app.md, Layers). Read by
# tools/layers.py over `cargo metadata` (rust/Cargo.toml's workspace) and
# held by `checks.layers`: every member is in exactly one layer, and each of
# its dependencies — normal and build, optional or not, never dev — is a
# crate of a layer it may use, or an external crate its layer allows.
#
# Lowest first. A layer may use its own crates, the layers it lists in
# `uses`, and the external crates in `external` (`"*"`: any). The kernel and
# the core are pure: no I/O, no clock, no thread, no platform — clippy.toml
# beside each of their crates holds that inside the code too.

[layers.kernel]
# The database's kernel: the log, the format, the hash.
crates = ["ark", "ark-macros"]
uses = []
external = ["serde", "serde_json", "sha2", "memcomparable", "postcard", "proc-macro2", "quote", "syn"]

[layers.core]
# The domains: what a household's budget and a listener's library are, and
# their rules. Nothing of how they are drawn, stored, routed or carried.
crates = ["money-core", "harken-domain"]
uses = ["kernel"]
external = ["serde", "serde_json"]

[layers.runtime]
# What an app is written against: the runtime and its commands, routes as
# paths, the words numbers and days are written in, the #[view] macro.
crates = ["ark-app", "ark-router", "ark-router-macros", "ark-format", "arkui-macros"]
uses = ["kernel", "core"]
external = ["proc-macro2", "quote", "syn"]

[layers.app]
# An app: its screens' state, messages, update and page records.
crates = ["money-app"]
uses = ["kernel", "core", "runtime"]
external = ["serde_json"]

[layers.adapters]
# Everything that touches the world: the peer and its disk, sign-in, the
# bridge to the phones, the toolkits, the device modules, the servers, the
# shells and what generates code. They may use anything below them.
crates = [
  "ark-peer", "arkdb", "ark-auth", "ark-ffi",
  "ark-module", "ark-haptics", "ark-clipboard", "ark-share", "ark-camera",
  "ark-media-player", "ark-notifications", "ark-secure-store",
  "ark-ui-gen", "arkui", "arkui-glyphs", "arkui-web", "arkui-serve", "arkui-shots",
  "money-iced", "money-server", "money-web",
  "harken-server", "harken-player", "harken-iced", "harken-seed", "harken-ffi",
]
uses = ["kernel", "core", "runtime", "app"]
external = ["*"]

# Today's violations, each `"<crate> -> <dependency>"` with what removes
# it. The check fails on a violation not listed here, and on a line here
# that is no longer a violation: delete the line in the change that fixes it.
[allow]
"money-core -> ark-auth" = "the household's roles are the domain's; sign-in is an adapter's"
"money-core -> ark-peer" = "the view keys (ark_peer::store::ViewKey) move to the kernel, or the keys to money-app"
"money-core -> ark-format" = "display text moves to money-app"
"money-core -> ark-ffi" = "the FFI records are generated in the adapter"
"money-core -> uniffi" = "the FFI records are generated in the adapter"
"money-core -> anyhow" = "money-seed's command line (feature cli) moves to an adapter crate"
"harken-domain -> ark-auth" = "the roles are the domain's; sign-in is an adapter's"
"harken-domain -> ark-peer" = "the view keys move to the kernel, or the keys to the adapter"
"harken-domain -> ark-router" = "routes move to the adapter that draws them"
"harken-domain -> ark-ffi" = "the FFI records are generated in the adapter"
"harken-domain -> uniffi" = "the FFI records are generated in the adapter"
"ark-format -> uniffi" = "the FFI records are generated in the adapter"
"ark-app -> ark-peer" = "the store an app reads (ark_peer::store) is behind a port of the runtime's"
"ark-app -> ark-module" = "the operations' plumbing (ark-module) is the runtime's own"
"money-app -> ark-peer" = "the store is read through ark-app's Data"
"money-app -> ark-haptics" = "the modules' operations are ports of the runtime's layer"
"money-app -> ark-clipboard" = "the modules' operations are ports of the runtime's layer"
"money-app -> ark-share" = "the modules' operations are ports of the runtime's layer"
"money-app -> ark-module" = "the phones' bridge (src/ffi) moves to an adapter crate"
"money-app -> ark-ffi" = "the phones' bridge (src/ffi) moves to an adapter crate"
"money-app -> uniffi" = "the phones' bridge (src/ffi) moves to an adapter crate"
"money-app -> tract-onnx" = "the receipt's page finder (src/ffi/page.rs) moves to an adapter crate"
"money-app -> ark-ui-gen" = "screens() (feature gen) moves to an adapter crate"
"money-app -> arkui" = "the iced views (feature iced) move to an adapter crate"
"money-app -> arkui-web" = "the browser's views (feature web) move to an adapter crate"
