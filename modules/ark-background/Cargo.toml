[package]
name = "ark-background"
workspace = "../../rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The periodic background sync, as an Ark module: the port's fake and the phones' foreign trait (BGTaskScheduler and NSBackgroundActivityScheduler; JobScheduler beside it, swift/ and kotlin/). Off until an app asks, and an app asks only once the person turned it on."

# A device module (ui/docs/app.md, The Device): what it is to an app's
# projects is its module.toml. An app takes it on by depending on this
# crate, directly or through another; ui/prebuild.py and nix/ark-app.nix
# find it so, and no app lists it anywhere else.
[package.metadata.ark]
module = "module.toml"

[dependencies]
ark-module = { path = "../../ui/rust/module" }
uniffi = { version = "0.32.2", default-features = false, optional = true }

[features]
# The trait as a UniFFI foreign trait, for the phones.
ffi = ["dep:uniffi"]
