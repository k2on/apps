[package]
name = "ark-dpc"
workspace = "../../rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The device's policy, as an Ark module: what an app that is the phone's device owner (its device policy controller) holds the phone to: an always-on VPN, restrictions, apps that cannot be removed, permissions. The trait, its calls, the plan from a policy to its changes and its fake; Android's implementation beside it (kotlin/)."

[dependencies]
ark-module = { path = "../../ui/rust/module" }
uniffi = { version = "0.32.2", default-features = false, optional = true }

[features]
# The trait as a UniFFI foreign trait, for the phones.
ffi = ["dep:uniffi"]
