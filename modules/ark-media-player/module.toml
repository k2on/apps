# What an app takes on when its modules.toml lists media-player (ui/docs/app.md,
# The Device; README.md says why each is asked). ui/prebuild.py reads it.
crate = "ark-media-player"

# Its operations, each with the type of what comes of it (ark_module::Op):
# ui/prebuild.py checks each is an `impl Op` in the crate with this Output.
[ops]
MediaOp = "()"

# How the phone makes its player and hands it to the process (ark-ffi's
# `devices`, ui/prebuild.py): AVPlayer with its placeholder artwork in the
# app's palette (`{accent}`, app.toml's), and Media3 over the media session
# service below — made once for the process, by the Application
# (`kotlin-scope`, `context` the Application), so an activity made again
# (a rotation, a theme or a size changed) never makes a second player.
[phone]
register = "registerMediaPlayer"
swift = "PhoneMediaPlayer(squares: .{accent})"
kotlin = "dev.arkui.modules.PhoneMediaPlayer(context)"
kotlin-scope = "process"

# The browser's: an <audio> element and the Media Session API (`Browser`,
# none on a page with no <audio>), registered by the app's generated page.
[web]
device = "ark_media_player::Browser::new()"
port = "ark_media_player::MediaPlayer"
optional = true

# The Linux desktop's: rodio over symphonia and MPRIS (`Desktop`), arkui's
# feature of the same name, registered by the window's devices.
[desktop]
feature = "media-player"

# Playing on with the screen locked and the app in the background: only for
# an app whose app.toml says `[background] playback = true` (ui/prebuild.py).
[ios.playback]
background-modes = ["audio"]

[android]
# The wake lock that keeps a stream from stopping with the screen
# (ExoPlayer's network wake mode).
permissions = ["android.permission.WAKE_LOCK"]
dependencies = [
  "androidx.media3:media3-exoplayer:1.5.1",
  "androidx.media3:media3-session:1.5.1",
]

# The service in the foreground while it plays, and its kind: only with
# `[background] playback = true`.
[android.playback]
permissions = [
  "android.permission.FOREGROUND_SERVICE",
  "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
]

# The media session service (kotlin/.../ArkMediaService.kt): what the
# notification, the lock screen, a headset, a car and a watch reach. A car
# finds it by the library actions, the platform's and Media3's.
[[android.services]]
name = "dev.arkui.modules.ArkMediaService"
exported = true
foreground = "mediaPlayback"
foreground-when = "playback"
actions = [
  "androidx.media3.session.MediaLibraryService",
  "android.media.browse.MediaBrowserService",
  "androidx.media3.session.MediaSessionService",
]
