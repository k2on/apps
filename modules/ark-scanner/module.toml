# What an app takes on when its crate depends on ark-scanner (ui/docs/app.md,
# The Device; README.md says why each is asked). ui/prebuild.py reads it.
# It asks nothing of a platform itself: its frames and its shutter are
# ark-camera's, which an app that scans lists beside it.
crate = "ark-scanner"

# Its operations, each with the type of what comes of it (ark_module::Op):
# ui/prebuild.py checks each is an `impl Op` in the crate or its port with
# this Output.
[ops]
ScanPage = "Option<Vec<u8>>"
PickPhoto = "Option<Vec<u8>>"

# Registered over the camera (ark-ffi's `devices`), after the devices: no
# device of its own on either phone.
[phone]
register = "registerScanner"

[ios.info]

[android]
permissions = []
