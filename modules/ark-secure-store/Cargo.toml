[package]
name = "ark-secure-store"
workspace = "../../rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Secrets kept by the system, as an Ark module: its port's fake, the phones' foreign trait and the Linux desktop's Secret Service (feature `desktop`); the keychain (iPhone, iPad, Mac) and the Android keystore beside it (swift/, kotlin/)."

# A device module (ui/docs/app.md, The Device): what it is to an app's
# projects is its module.toml. An app takes it on by depending on this
# crate, directly or through another; ui/prebuild.py and nix/ark-app.nix
# find it so, and no app lists it anywhere else.
[package.metadata.ark]
module = "module.toml"

[dependencies]
ark-module = { path = "../../ui/rust/module" }
uniffi = { version = "0.32.2", default-features = false, optional = true }

# The Linux desktop's: the Secret Service on the session bus, over zbus
# (already the desktop's, for MPRIS and accessibility).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, optional = true, features = ["blocking-api", "async-io"] }

[features]
# The trait as a UniFFI foreign trait, for the phones.
ffi = ["dep:uniffi"]
# `SecretService`: the desktop's keyring, for an iced window on Linux.
desktop = ["dep:zbus"]
