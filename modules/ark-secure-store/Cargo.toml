[package]
name = "ark-secure-store"
workspace = "../../rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Secrets kept by the system (the keychain, the Android keystore), as an Ark module: the trait, its calls and its fake; no native implementation yet."

[dependencies]
ark-module = { path = "../../ui/rust/module" }
uniffi = { version = "0.32.2", default-features = false, optional = true }

[features]
# The trait as a UniFFI foreign trait, for the phones.
ffi = ["dep:uniffi"]
