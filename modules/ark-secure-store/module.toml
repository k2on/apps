# What an app takes on when its modules.toml lists secure-store (ui/docs/app.md,
# The Device; README.md says why each is asked). ui/prebuild.py reads it.
crate = "ark-secure-store"

# Its operations, each with the type of what comes of it (ark_module::Op):
# ui/prebuild.py checks each is an `impl Op` in the crate with this Output.
[ops]
SecureStoreOp = "Option<String>"

[ios.info]

[android]
permissions = []
