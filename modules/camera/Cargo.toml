[package]
name = "ark-camera"
workspace = "../../rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The camera, as an Ark module: a QR code scanned, a photo taken, answered later through a reply. The trait, its calls and its fake; no native implementation yet."

[dependencies]
ark-module = { path = "../../ui/rust/module" }
uniffi = { version = "0.32.2", default-features = false, optional = true }

[features]
# The trait as a UniFFI foreign trait, for the phones.
ffi = ["dep:uniffi", "ark-module/ffi"]
