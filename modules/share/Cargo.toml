[package]
name = "ark-share"
workspace = "../../rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The system's share sheet, as an Ark module: the trait, its call and its fake; the iPhone's and the Mac's implementation beside it (swift/)."

[dependencies]
ark-module = { path = "../../ui/rust/module" }
uniffi = { version = "0.32.2", default-features = false, optional = true }

[features]
# The trait as a UniFFI foreign trait, for the phones.
ffi = ["dep:uniffi", "ark-module/ffi"]
