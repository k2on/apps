[package]
name = "money-app"
version = "0.1.0"
workspace = "../../rust"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "money as an Ark app (ui/docs/app.md): its screens' state, messages, update and views in Rust, run by ark-app on every platform; the views are drawn natively by iced, Leptos, SwiftUI and Compose."

[lib]
name = "money_app"
path = "src/lib.rs"

[dependencies]
ark = { path = "../../rust/ark" }
ark-app = { path = "../../ui/rust/app" }
# The device modules money lists (money/app.toml).
ark-haptics = { path = "../../modules/haptics" }
ark-clipboard = { path = "../../modules/clipboard" }
ark-share = { path = "../../modules/share" }
ark-peer = { path = "../../rust/ark-peer", default-features = false }
ark-format = { path = "../../rust/ark-format" }
money-domain = { path = "../domain" }
uniffi = { version = "0.32.2", default-features = false, optional = true }
# The phones (`ffi`, src/ffi): the bridge, the module plumbing as UniFFI's,
# the demo's household (`money_demo`), and every number, day and length as
# the apps write them (re-exported, so its functions are in the library).
ark-ffi = { path = "../../rust/ark-ffi", optional = true }
ark-module = { path = "../../ui/rust/module", optional = true }
money-seed = { path = "../seed", default-features = false, optional = true }
serde_json = { workspace = true, optional = true }
# Where a receipt is in a camera frame (`page`, src/ffi/page.rs).
tract-onnx = { version = "0.22", optional = true }
ark-ui-gen = { path = "../../ui/rust/gen", optional = true }
arkui = { path = "../../ui/rust/arkui", optional = true }
arkui-web = { path = "../../ui/rust/web", optional = true }

[features]
# The state's records and messages as UniFFI's, for the phones (money/ffi).
# money for the phones (src/ffi), which nix's generated `money-ffi` links
# into their library (nix/ark-app.nix).
ffi = [
  "dep:uniffi", "dep:ark-ffi", "dep:ark-module", "dep:money-seed", "dep:serde_json",
  "money-domain/ffi", "ark-format/ffi", "ark-module/ffi", "ark-haptics/ffi", "ark-clipboard/ffi", "ark-share/ffi",
]
# Where a receipt is in a camera frame: the corner model on a runtime in
# Rust (src/ffi/page.rs), so the phone links none of its own. Android's
# (money/app.toml's `[ffi]`): the iPhone's build leaves it out, as
# VisionKit finds the page there.
page = ["ffi", "dep:tract-onnx"]
# `screens()`: the views as the phones' generator takes them.
gen = ["dep:ark-ui-gen"]
# `accounts::iced(&page)`: the views as iced draws them.
iced = ["dep:arkui", "arkui/app"]
# `accounts::web(&page)`: the views as the browser draws them.
web = ["dep:arkui-web"]

[dev-dependencies]
ark-peer = { path = "../../rust/ark-peer", default-features = false }
money-seed = { path = "../seed", default-features = false }
tempfile = "3"
# The scanner's pages, read (tests/page.rs).
image = { version = "0.25", default-features = false, features = ["png"] }
