[package]
name = "money-bridge"
version = "0.1.0"
workspace = "../../rust"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "money for its phones: the bridge (ark-ffi) over money's domain and its screens' runtime, and every record and message that crosses it as a UniFFI twin written here (ark::twins!), so money-core and money-app stay free of UniFFI. nix's generated money-ffi links it into the phones' library."

[lib]
name = "money_bridge"
path = "src/lib.rs"

[dependencies]
ark = { path = "../../rust/ark" }
ark-app = { path = "../../ui/rust/app" }
ark-ffi = { path = "../../rust/ark-ffi" }
ark-peer = { path = "../../rust/ark-peer", default-features = false }
# Every number, day and length as the apps write them, in the library
# (its bindings are `ark_format`'s).
ark-format = { path = "../../rust/ark-format" }
ark-format-ffi = { path = "../../rust/ark-format-ffi" }
# The login's keychain and keystore (ark-ffi's `LoginKeep` takes them).
# The other modules money lists are registered by the app library through
# ark-ffi (its `devices`).
ark-secure-store = { path = "../../modules/ark-secure-store", features = ["ffi"] }
money-core = { path = "../core", features = ["demo"] }
# The demo's household on a peer (`money_demo`).
money-seed = { path = "../demo" }
money-app = { path = "../app" }
uniffi = { version = "0.32.2", default-features = false }
serde_json = { workspace = true }

[features]
# Where a receipt is in a camera frame: the scanner's corner model on a
# runtime in Rust (ark-ffi's `model`, ark-scanner's), so the phone links none
# of its own. Android's (money/app.toml's `[ffi]`), whose camera gives the
# eyes a colour square; the iPhone's finds the page by its bright region.
model = ["ark-ffi/model"]

[dev-dependencies]
tempfile = "3"
