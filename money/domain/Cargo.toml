[package]
name = "money-domain"
version = "0.1.0"
workspace = "../../rust"
edition = "2021"
description = "money's domain in plain Rust (docs/plan-v5.md §1.16): a household's budget — accounts, categories, the month's assignments, transactions and the Plaid import — and its tests."

[lib]
name = "money_domain"
path = "src/lib.rs"

[dependencies]
ark = { path = "../../rust/ark" }
ark-auth = { path = "../../rust/ark-auth", default-features = false }
# The views an app holds (`views`), as `ark_peer::store` keys them.
ark-peer = { path = "../../rust/ark-peer", default-features = false }
# Its routes, spelled as paths (`src/routes.rs`).
ark-router = { path = "../../rust/ark-router" }
serde = { workspace = true }
serde_json = { workspace = true }
# Typed views for the phones (docs/plan-v5.md, Landed: typed views): the
# rows of the views the phones read typed, as UniFFI records.
uniffi = { version = "0.32.2", default-features = false, optional = true }
ark-ffi = { path = "../../rust/ark-ffi", optional = true }

[features]
ffi = ["dep:uniffi", "dep:ark-ffi"]
