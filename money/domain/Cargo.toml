[package]
name = "money-domain"
version = "0.1.0"
workspace = "../../rust"
edition = "2021"
description = "money's domain in plain Rust (docs/plan-v5.md §1.16): a household's budget — accounts, categories, the month's assignments, transactions and the Plaid import — and its tests."

[lib]
name = "money_domain"
path = "src/lib.rs"

[dependencies]
ark = { path = "../../rust/ark" }
ark-auth = { path = "../../rust/ark-auth", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
ark-peer = { path = "../../rust/ark-peer", default-features = false }
