[package]
name = "money-iced"
workspace = "../../rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "money's desktop client: a household's budget in iced, on arkui, ArkDB v5's peer and the domain — signed in to a money server, or (`demo`) seeded and its own authority."

[features]
# A standalone demo: no server, no sign-in, a seeded household, its own
# authority. A separate build from the real client on purpose — a flag
# could be set by accident, a feature has to be asked for at build time.
demo = []

[dependencies]
ark = { path = "../../rust/ark" }
# The domain, and (`demo`) the demo's household and the bank its "Sync" asks.
money-core = { path = "../core", features = ["demo"] }
# The demo's household on a peer (money/seed).
money-seed = { path = "../seed" }
ark-peer = { path = "../../rust/ark-peer", default-features = false }
# Signing in: a loopback listener and the system's browser; and the logins
# a device remembers.
ark-auth = { path = "../../rust/ark-auth", default-features = false }
arkui = { path = "../../ui/rust/arkui", features = ["app"] }
# The screens run in Rust once for every platform (ui/docs/app.md), and
# their runtime.
money-app = { path = "../app" }
ark-app = { path = "../../ui/rust/app" }
# The desktop's modules (money/app.toml): the clipboard, queued for iced's own task.
ark-clipboard = { path = "../../modules/ark-clipboard", features = ["desktop"] }

# `smol` gives iced an executor; `svg` is every glyph, `image` a
# receipt's photo, `advanced` the focus operation a form's first field is given
# the keys by.
# `fira-sans` is the typeface, as harken's.
iced = { workspace = true }
# The window photographed for the apps' screenshots, when `ARK_SHOTS` asks
# (.github/screens/apps.md): this same application, run headless.
arkui-shots = { path = "../../ui/rust/shots" }

# The live window's test runs a money server in the process and signs in
# to it, as the window would (`src/tests.rs`).
[dev-dependencies]
money-server = { path = "../server" }
tokio = { version = "1", features = ["rt-multi-thread"] }
tempfile = "3"
# The budget drawn to a picture, to look at (`tests::the_budget_drawn`).
iced_test = { workspace = true }
