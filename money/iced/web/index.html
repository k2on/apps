<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>money</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      /* iced picks light or dark from the system; the page behind it agrees,
         or a dark window loads over a white flash. */
      html, body {
        margin: 0;
        height: 100%;
        color-scheme: light dark;
        overflow: hidden;
      }
      /* iced appends its canvas to <body> and sizes it to 100%. */
      canvas { display: block; }
    </style>
  </head>
  <body>
    <script type="module">
      // `?v=dev` is rewritten to the build's store hash, on both files, as
      // harken's page does: a browser holding the last build is sent URLs its
      // cache has never seen.
      import init from "./pkg/money-iced.js?v=dev";
      await init({ module_or_path: new URL("pkg/money-iced_bg.wasm?v=dev", document.baseURI) });

      // The keyboard reaches the app only while its canvas has the focus.
      const grab = () => document.querySelector("canvas")?.focus();
      addEventListener("focus", grab);
      grab();
    </script>
  </body>
</html>
