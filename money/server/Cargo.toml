[package]
name = "money-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "money's server, an ark-peer that listens: the household's budget (money/core) on the hub, sign-in (ark-auth), the browser client, and the bank importer, which asks Plaid for each bank's news and authors it as banks.import."
workspace = "../../rust"

[[bin]]
name = "money-server"
path = "src/main.rs"

# A device with no window, signed in to a dev server by name: another
# device for a test or a script (src/peer.rs).
[[bin]]
name = "money-peer"
path = "src/peer.rs"

[dependencies]
ark = { path = "../../rust/ark" }
money-core = { path = "../core" }
# An amount as a person types it (`money-peer`).
ark-format = { path = "../../rust/ark-format" }
# The server is a peer that listens; the importer is a peer in this process
# that reaches it through its handle, never a socket.
ark-peer = { path = "../../rust/ark-peer", features = ["server"] }
ark-auth = { path = "../../rust/ark-auth" }
# The wake the household's devices that are not connected are sent
# (ark_peer's push): money's own words, nothing of the rows.
ark-push = { path = "../../rust/ark-push" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# A paper receipt's photo, sent over the socket as base64 (`paper`).
base64 = "0.22"
# The browser Costco is read in, over the DevTools protocol's WebSocket:
# plain, blocking, on the importer's thread. ark-peer's already.
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
# Plaid, over its HTTP API: blocking, on the importer's thread. The same
# ureq ark-auth talks to an identity provider with.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# `/healthz` says what domain this is, in front of ark-peer's own.
axum = "0.7"

[dev-dependencies]
tempfile = "3"
# The demo's household, seeded into a data directory as money-seed does it
# (tests/seed.rs).
money-core = { path = "../core", features = ["demo"] }
money-seed = { path = "../demo" }
