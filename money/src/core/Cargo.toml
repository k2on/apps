[package]
name = "money-core"
version = "0.1.0"
workspace = "../../../rust"
edition = "2021"
description = "money's core in plain Rust (docs/plan-v5.md §1.16): the domain of a household's budget — accounts, categories, the month's assignments, transactions and the Plaid import — its tests, and behind `demo` the demo's household (money/src/demo writes it to disk)."

[lib]
name = "money_core"
path = "src/lib.rs"

[dependencies]
ark = { path = "../../../rust/ark" }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# The demo's household (`demo`, docs/seed.md): three months of a family's
# budget up to a day, which the demo window, the phones' demo and a seeded
# server's data directory open on. Off by default, so a client or a server
# carries none of it unless it asks.
demo = []
# The kernel's push table (`ark::auth::Push`) in the schema, and
# `session.push` registered. Off by default: the servers deployed before
# it serve the schema without it (ui/docs/app.md, Servers Already
# Deployed), and the new clients must be that schema. On again with
# ark-peer's, ark-ffi's and ark-app's `push` (docs/releasing.md).
push = []
