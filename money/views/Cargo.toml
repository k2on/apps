[package]
name = "money-views"
version = "0.1.0"
workspace = "../../rust"
edition.workspace = true
license.workspace = true
description = "money's screens as the phones' generator takes them (`screens()`): money-app's #[view]s recorded, with their names in Swift and Kotlin. nix's generated money-gen links it with ark-ui-gen."

[lib]
name = "money_views"
path = "src/lib.rs"

[dependencies]
money-app = { path = "../app" }
ark-app = { path = "../../ui/rust/app" }
ark-ui-gen = { path = "../../ui/rust/gen" }
