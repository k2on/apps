[package]
name = "money-web"
workspace = "../../rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "money in the browser: the same money-app shell and screens as every platform, drawn by arkui-web (Leptos over the DOM), over the demo household in wasm with no server."

[[bin]]
name = "money-web"
path = "src/main.rs"

[dependencies]
ark-app = { path = "../../ui/rust/app" }
ark-peer = { path = "../../rust/ark-peer", default-features = false }
ark-format = { path = "../../rust/ark-format" }
arkui-web = { path = "../../ui/rust/web" }
leptos = { version = "0.8", default-features = false, features = ["csr"] }
money-app = { path = "../app", features = ["web"] }
# The domain, and (`demo`) its household: three months of a family's budget up to today.
money-core = { path = "../core", features = ["demo"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element"] }
