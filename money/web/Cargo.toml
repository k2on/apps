[package]
name = "money-web"
workspace = "../../rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "money in the browser: the same money-app shell and screens as every platform, drawn by arkui-web (Leptos over the DOM), a replica of the household's budget on its server, signed in and synced as every device is — or, with ?demo, the demo household in wasm with no server."

[lib]
name = "money_web"
path = "src/lib.rs"

# The page's module: the SPA.
[[bin]]
name = "money-web"
path = "src/main.rs"

[dependencies]
ark-app = { path = "../../ui/rust/app" }
ark-peer = { path = "../../rust/ark-peer", default-features = false }
ark-format = { path = "../../rust/ark-format" }
arkui-web = { path = "../../ui/rust/web", default-features = false }
leptos = { version = "0.8", default-features = false }
money-app = { path = "../app", features = ["web"] }
# The domain, and (`demo`) its household: three months of a family's budget up to today.
money-core = { path = "../core", features = ["demo"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Location"] }
# Signing in (the machine every shell walks, and the page's half of the
# sign-in routes) and the replica's socket (ark-peer's, the page's own
# WebSocket).
ark = { path = "../../rust/ark" }
ark-auth = { path = "../../rust/ark-auth", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[features]
default = ["csr"]
csr = ["arkui-web/csr", "leptos/csr"]
# Written natively (the static site's and the server's mode, which money
# ships neither of: ui/docs/app.md): what the tests draw its pages with.
ssr = ["arkui-web/ssr", "leptos/ssr"]
