# Revelation (revelation/README.md): the Bible as one scroll, zoomed like a
# map. Kotlin alone, no Rust and none of ArkDB, so no crate and no kernel;
# its native project is generated as every app's is (ui/docs/app.md,
# "Generated, Not Committed"): `nix run .#revelation-prebuild`.

name = "Revelation"
# us.koon.revelation
id = "revelation"
version = "0.1"
# ArkUI's own, nobody's: revelation draws nothing of ArkUI's.
accent = "blue"
platforms = ["android"]
modules = []
summary = "The Bible as one scroll, zoomed like a map"

[icon]
# The whole Bible zoomed all the way out: one thin white line on the dark
# page; the page the adaptive icon's ground.
svg = "icon.svg"

[android]
package = "dev.revelation.android"
min-sdk = 26
target-sdk = 35
keystore = "native/android/debug.keystore"
# Its own first frame: the page black before the text is laid out, the
# bars drawn over (native/android/res/values/themes.xml).
theme = "@style/Theme.Revelation"
# A rotation lays the text out again at the new width inside the same view
# (BibleView.onSizeChanged) rather than recreating the activity and parsing
# the text twice.
config-changes = ["orientation", "screenSize", "screenLayout", "smallestScreenSize", "keyboardHidden"]
# No ArkUI and no kernel: Compose and Material alone.
dependencies = [
  "platform:androidx.compose:compose-bom:2024.12.01",
  "androidx.compose.ui:ui",
  "androidx.compose.material3:material3",
  "androidx.activity:activity-compose:1.9.3",
  "androidx.core:core-ktx:1.15.0",
  "androidx.profileinstaller:profileinstaller:1.3.1",
]
test-dependencies = ["junit:junit:4.13.2"]
# Its tests parse the whole Bible (BibleTests).
test-heap = "2g"

[fdroid]
metadata = "fdroid/metadata/us.koon.revelation.yml"
