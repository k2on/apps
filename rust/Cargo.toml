[workspace]
resolver = "2"
members = ["ark", "ark-macros", "ark-peer", "ark-dev", "ark-auth", "arkui", "ark-explorer", "../harken/domain", "../harken/server", "../harken/iced"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sha2 = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
memcomparable = "0.2"

# Test binaries with full debug info are over 100 MB each, and the disk a
# session builds on is a fixed allowance. Line tables keep file and line in
# a panic's backtrace, which is what a test failure is read by.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
