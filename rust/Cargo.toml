[workspace]
resolver = "2"
members = ["ark", "ark-client", "ark-server", "ark-auth", "arkui", "../harken/domain", "../harken/server", "../harken/iced"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sha2 = { version = "0.10", default-features = false }
serde_json = "1"

# Test binaries with full debug info are over 100 MB each, and the disk a
# session builds on is a fixed allowance. Line tables keep file and line in
# a panic's backtrace, which is what a test failure is read by.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
