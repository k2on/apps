[package]
name = "ark-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "An Ark app's runtime: its state, its messages and its update in Rust, the loop that runs them over the views the store keeps, and the number a native shell watches. UI-free and wasm-friendly."

[dependencies]
# The views an app reads (`ark_peer::store`), as every shell holds them.
ark-peer = { path = "../ark-peer", default-features = false }
# What an update asks of the device.
ark-modules = { path = "../ark-modules" }
