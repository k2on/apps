[package]
name = "ark-auth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Who an ArkDB peer is: OpenID Connect on the server as the one relying party, the sessions it issues (a login on one device, revocable, kept in a file), dev auth, and how a desktop program or a page gets a login."

[features]
default = []
# The relying party, the session store, the routes as an axum Router, and
# what the sync server asks at every Hello.
server = ["dep:ark", "dep:axum", "dep:tokio", "dep:tower-http", "dep:sha2", "dep:getrandom", "dep:ureq"]
# Getting a login: a loopback listener and the system browser natively, the
# page's own address in a browser; and remembering it.
client = ["dep:ureq", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
ark = { path = "../ark", optional = true }
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["rt", "sync"], optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
sha2 = { workspace = true, features = ["std"], optional = true }
getrandom = { version = "0.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Headers", "History", "Location", "Request", "RequestInit", "Response", "Storage", "Window"] }

[dev-dependencies]
ark-auth = { path = ".", features = ["server", "client"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
ureq = { version = "2", default-features = false }
