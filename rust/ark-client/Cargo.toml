[package]
name = "ark-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A Rust peer on ArkDB, for any app's module: replicas persisted on disk or in the browser, mutate and query by name, maintained views, the sync socket with reconnect and keepalive, and live rooms on the same socket. Desktop and wasm32."

[features]
default = ["tls"]
# `wss://` natively (rustls with ring). The browser brings its own TLS.
tls = ["tungstenite/rustls-tls-webpki-roots", "dep:rustls"]

[dependencies]
ark = { path = "../ark" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["BinaryType", "CloseEvent", "ErrorEvent", "MessageEvent", "Storage", "WebSocket", "Window"] }

[dev-dependencies]
tempfile = "3"
