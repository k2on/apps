[package]
name = "ark-dev"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "ArkDB v5's development tools (docs/plan-v5.md D1): the simulator over the real hub and client, the trace recorder and player, the fuzzer, the vector writer, and the typed Kotlin and Swift of a domain (`ark-dev gen`)."

[dependencies]
ark = { path = "../ark" }
ark-peer = { path = "../ark-peer" }
# A domain as the admin page describes it (`Catalog`): what `ark-dev gen` reads.
ark-explorer = { path = "../ark-explorer", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
# `ark-dev gen` from a domain's source (`gen::source`): its files parsed,
# lines kept for what it refuses, and ark-auth's part read as it is built.
syn = { version = "2", default-features = false, features = ["clone-impls", "full", "derive", "parsing", "printing", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
ark-auth = { path = "../ark-auth" }
# UniFFI's own Kotlin and Swift for a domain's twins (`gen::twins`), from
# metadata made of its source rather than read out of a built library.
uniffi_bindgen = { version = "=0.32.2", default-features = false }
uniffi_meta = "=0.32.2"
camino = "1"
