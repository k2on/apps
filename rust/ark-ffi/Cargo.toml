[package]
name = "ark-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "ArkDB's peer for an app in another language (docs/plan-v5.md §1.16, N3): ark-peer's app kit through UniFFI, values as JSON. A domain is linked in by the app's own crate (harken/ffi)."

[dependencies]
ark = { path = "../ark" }
ark-peer = { path = "../ark-peer", default-features = false }
ark-auth = { path = "../ark-auth", default-features = false, features = ["ffi"] }
# The first run's pages (`first_run_app!`): ark-app's records.
ark-app = { path = "../../ui/rust/app" }
# The login kept in the secure store (`keep`): the port, and the phones'
# foreign trait the keychain and the Android keystore implement.
ark-module = { path = "../../ui/rust/module" }
ark-secure-store = { path = "../../modules/ark-secure-store", features = ["ffi"] }
# The phone's device modules an app takes on, registered as the process's
# (`devices`): each one's foreign trait, which its swift/ and kotlin/
# implement, and the scanner over the camera. Each is a feature, which the
# app's generated library (nix/ark-app.nix) turns on for the modules its
# crate depends on, so another app's library carries none of their types
# (harken's `Look` is its own).
ark-haptics = { path = "../../modules/ark-haptics", features = ["ffi"], optional = true }
ark-clipboard = { path = "../../modules/ark-clipboard", features = ["ffi"], optional = true }
ark-share = { path = "../../modules/ark-share", features = ["ffi"], optional = true }
ark-camera = { path = "../../modules/ark-camera", features = ["ffi"], optional = true }
ark-scanner = { path = "../../modules/ark-scanner", optional = true }
# A wake from the notifications (a push, a notice's button) and the
# endpoint they hand out written as the session's push row (`wake`).
ark-notifications = { path = "../../modules/ark-notifications", features = ["ffi"] }
# The periodic sync's foreign trait (`NativeBackground`), so every app's
# library carries it: an app that declares `[background]` in app.toml needs
# nothing more of its bridge for the phones' job and task (ui/swift's ArkApp,
# ui/kotlin/app).
ark-background = { path = "../../modules/ark-background", features = ["ffi"] }
ark-push = { path = "../ark-push" }
serde_json = { workspace = true }
uniffi = { version = "0.32.2", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }

# `uniffi-bindgen`, which writes the Kotlin and Swift for an app's library
# (`cargo run -p ark-ffi --features bindgen --bin uniffi-bindgen -- generate
# --library libharken_ffi.so --language kotlin --out-dir …`), finding each
# crate's `uniffi.toml` through `cargo metadata` in the workspace. The
# flake's is its own crate (nix/uniffi-bindgen), which runs no cargo: it is
# told the crates' directories (`--config` with `[crate-roots]`).
[features]
# The device modules (`devices`), each by its module's name.
haptics = ["dep:ark-haptics"]
clipboard = ["dep:ark-clipboard"]
share = ["dep:ark-share"]
camera = ["dep:ark-camera"]
scanner = ["camera", "dep:ark-scanner"]
# The scanner's corner model (ark-scanner's): Android's camera gives its
# eyes a colour square, which the model reads; the iPhone and the Mac find
# the page by its bright region, so without it.
model = ["scanner", "ark-scanner/model"]
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dev-dependencies]
arkdb = { path = "../arkdb" }
tempfile = "3"
serde = { workspace = true }
