[package]
name = "ark-modules"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "What an Ark app asks of the device, Expo's way: haptics, the clipboard and share sheet, the camera, a media player, local notifications and the keychain, each one Rust trait the platform implements (Swift, Kotlin, iced, the browser) and a fake for tests."

# No UI and no platform of its own: the traits, the calls an app's update
# makes of them (`Call`, `Answer`), the registry a shell fills at startup
# (`Modules`) and the fakes. Each platform's implementation is in its
# ArkUI library (swift/ArkUI, kotlin/arkui, rust/arkui) or, for the
# browser, in the app's web crate over web-sys.

[dependencies]
uniffi = { version = "0.32.2", default-features = false, optional = true }

[features]
# The traits as UniFFI foreign traits, the calls as its enums: what the
# phones implement and register (`#[uniffi::export(with_foreign)]`).
ffi = ["dep:uniffi"]
