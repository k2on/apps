[package]
name = "ark-peer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The ArkDB v5 peer (docs/plan-v5.md §1.7, §1.9, §1.11): the two machines with one disk, as a device that dials a server and as a server that listens — the link with redial, the hub's connections, the views a UI drives and the functions it calls by name, the sync socket, the admin page and sign-in."

[dependencies]
ark = { path = "../ark" }
serde = { workspace = true }
serde_json = { workspace = true }
ark-auth = { path = "../ark-auth", default-features = false }

# The server side (`serve`, `web`): a server's, which a phone or a browser
# never links.
[features]
default = ["server"]
server = ["ark-auth/server", "dep:anyhow", "dep:axum", "dep:tokio", "dep:tower-http"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `wss://` natively: rustls with ring and Mozilla's roots, the TLS the
# sign-in client (ureq) already links. The browser brings its own.
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
anyhow = { version = "1", optional = true }
axum = { version = "0.7", features = ["ws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"], optional = true }
tower-http = { version = "0.5", features = ["fs"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "BinaryType", "Event", "Storage"] }

[dev-dependencies]
tempfile = "3"
ark-dev = { path = "../ark-dev" }
