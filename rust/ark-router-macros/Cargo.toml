[package]
name = "ark-router-macros"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The router's derive: an app's Route enum as paths (#[derive(Routes)]), used through ark_router::Routes."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", default-features = false, features = ["clone-impls", "derive", "full", "parsing", "printing", "proc-macro"] }
