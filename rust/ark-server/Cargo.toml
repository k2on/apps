[package]
name = "ark-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "An ArkDB sync server for any app's module, on axum: the authority with its procedures native and its log on disk, the sync socket with keepalive, live rooms with hooks an app registers, sign-in routes, /healthz, /media, and a static web build served with the build as its validator."

[dependencies]
ark = { path = "../ark" }
ark-client = { path = "../ark-client", default-features = false }
ark-auth = { path = "../ark-auth", features = ["server"] }
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower-http = { version = "0.5", features = ["fs"] }

[dev-dependencies]
ark-auth = { path = "../ark-auth", features = ["server", "client"] }
tempfile = "3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.24"
ureq = { version = "2", default-features = false }
