[package]
name = "ark-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The ArkDB v5 hub (docs/plan-v5.md §1.7, §1.9, §1.11): one authority per space, connections routed, the log on disk, live devices, the sync socket on axum, sign-in and a web build."

[dependencies]
ark = { path = "../ark" }
ark-client = { path = "../ark-client" }
ark-auth = { path = "../ark-auth", features = ["server"] }
# The admin page's wire (`admin`): the explorer without its window.
ark-explorer = { path = "../ark-explorer", default-features = false }
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower-http = { version = "0.5", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
ark-dev = { path = "../ark-dev" }
ark-auth = { path = "../ark-auth", features = ["server", "client"] }
