[package]
name = "ark"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The ArkDB v5 kernel: bytes under types, the store, the chained log and the one peer machine, as docs/plan-v5.md Part 1 defines them."

[dependencies]
sha2 = { workspace = true }
ark-macros = { path = "../ark-macros" }
serde = { workspace = true }
serde_json = { workspace = true }
memcomparable = { workspace = true }
postcard = { workspace = true, optional = true }

[features]
# The value format (docs/plan-v5.md §1.16, `ark::format`): what rows,
# entries, frames, journal records and the hashed bytes are written in.
# postcard by default; `values-json` writes JSON instead, whatever else is
# on (`--features ark/values-json`). Keys are memcomparable under either,
# and JSON is the explorer's and the vectors' human form under both.
default = ["values-postcard"]
values-postcard = ["dep:postcard"]
values-json = []
