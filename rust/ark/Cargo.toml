[package]
name = "ark"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The ArkDB runtime: the value model, the canonical encoding, the store, the standard library, the interpreter, the log, the peer and the protocol, as spec/ defines them."
# The binaries are named below: discovery would build `src/bin/vectors.rs`
# a second time, as `vectors` beside `ark-vectors`.
autobins = false

[dependencies]
sha2 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

# The conformance vectors, written by this crate (spec/README.md, "The
# vectors").
[[bin]]
name = "ark-vectors"
path = "src/bin/vectors.rs"

# Everything about a module rather than about running one: verify, hash,
# check, vectors.
[[bin]]
name = "arkc"
path = "src/bin/arkc.rs"

# The three Unicode tables of §5, from the UCD. Run by hand when the pinned
# Unicode version moves.
[[bin]]
name = "gen-unicode"
path = "src/bin/gen-unicode.rs"
