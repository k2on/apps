[package]
name = "ark5-macros"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The ArkDB v5 macros: #[derive(Node)], a Rust type as a value of plan-v5 §1.1's five constructors."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }
