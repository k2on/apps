[package]
name = "arkdb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "ArkDB's tools, one command (`arkdb`): a system's events read (`tail`, `trace`, `peer`; docs/plan-observe.md), the fuzzer (`fuzz`), the typed Kotlin and Swift of a domain (`gen`); and the simulator over the real hub and client, the trace recorder and player and the vector writer its tests run."

[dependencies]
ark = { path = "../ark" }
ark-peer = { path = "../ark-peer" }
serde = { workspace = true }
serde_json = { workspace = true }
