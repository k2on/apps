[package]
name = "arkui-macros"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "ArkUI's macros: `#[view]`, a screen laid out once in Rust and drawn by every toolkit (docs/ark-app.md). UI only; the database's macros are ark-macros'."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", default-features = false, features = ["clone-impls", "derive", "full", "parsing", "printing", "proc-macro", "visit-mut"] }
