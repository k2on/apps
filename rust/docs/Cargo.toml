[package]
name = "docs"
version = "0.1.0"
description = "arkui's documentation as an iced app: every component drawn by arkui itself, and the catalogue of what harken draws with it."
edition.workspace = true
license.workspace = true

# An iced app rather than a page of HTML, so every component on it is the
# component, drawn by the renderer the apps use: a picture of a menu in a web
# page could drift from the menu, and this cannot. In a browser it is one wasm
# module on one canvas (`web/`, `nix build .#docs`); natively a window
# (`cargo run -p docs`), and `--json` prints the catalogue instead.

[dependencies]
arkui = { path = "../arkui" }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { version = "0.14", features = ["smol", "svg", "image", "advanced", "fira-sans"] }
# The phones' manifest, fetched on a thread of its own (`screens::fetch`).
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { version = "0.14", features = ["webgl", "svg", "image", "advanced", "fira-sans"] }
# `console` for a panic; the rest is `fetch` for the phones' manifest.
web-sys = { version = "0.3", features = ["console", "Window", "Request", "RequestInit", "RequestCache", "Response"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
