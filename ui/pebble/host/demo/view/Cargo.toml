[package]
name = "now-playing-view"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The demo watchapp's screen, laid out once in Rust: a `#[view]` of arkui's primitives, recorded at build time and written out as Pebble's layers (ark-ui-gen's `pebble`), and drawn by every other toolkit the same way."

[dependencies]
ark-app = { path = "../../../../rust/app" }
ark-kernel = { path = "../../../../../rust/kernel", default-features = false }
ark-ui-gen = { path = "../../../../rust/gen" }
now-playing = { path = "../app" }

[lib]
bench = false
