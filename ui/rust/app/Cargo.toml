[package]
name = "ark-app"
workspace = "../../../rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "An Ark app's runtime: its state, its messages and its update in Rust, the loop that runs them over the views the store keeps, and the number a native shell watches. UI-free and wasm-friendly."

[dependencies]
# The views an app reads, through the kernel's port (`ark::views`).
ark = { path = "../../../rust/ark" }
# What an update asks of the device: the calls, answers and registry every
# module shares (each module is a crate of its own, modules/<name>).
ark-module = { path = "../module" }
# `#[view]`.
arkui-macros = { path = "../arkui-macros" }

[dev-dependencies]
# The tests' store, a peer's.
ark-peer = { path = "../../../rust/ark-peer", default-features = false }
# The tests' counter asks for a haptic and a scan.
ark-haptics = { path = "../../../modules/ark-haptics" }
ark-camera = { path = "../../../modules/ark-camera" }
# A wake-up's test tells the person through the notifications' fake.
ark-notifications = { path = "../../../modules/ark-notifications" }
ark-background = { path = "../../../modules/ark-background" }
