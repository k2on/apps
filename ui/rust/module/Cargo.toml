[package]
name = "ark-module"
workspace = "../../../rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "What every Ark device module shares: an operation as data with its typed output, why one gave nothing, a reply for later, and the registry a shell fills at startup. The modules themselves are packages of their own (modules/<name>)."

# No platform and no UniFFI (the runtime's layer, layers.toml): the ports an
# app asks through (haptics, clipboard, share) are here; each module crate
# (modules/haptics, …) implements its port — its fake, the desktop's, the
# browser's, the phones' foreign trait — and a shell registers what it has.

