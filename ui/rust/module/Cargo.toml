[package]
name = "ark-module"
workspace = "../../../rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "What every Ark device module shares: an operation as data with its typed output, why one gave nothing, a reply for later, and the registry a shell fills at startup. The modules themselves are packages of their own (modules/<name>)."

# No module and no platform: each module crate (modules/haptics, …) brings
# its trait, its operations and its fake, and an app registers what it uses.

[dependencies]
uniffi = { version = "0.32.2", default-features = false, optional = true }

[features]
# The module error as a UniFFI type, for the modules' foreign traits.
ffi = ["dep:uniffi"]
