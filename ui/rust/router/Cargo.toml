[package]
name = "ark-router"
workspace = "../../../rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Where an app can be: its routes read from its src/app folder (routes!), each spelled as one path every shell uses — the address bar, a deep link, a notification's target, a restored back stack."

# No UI: a domain spells its `Route` enum with this (`harken/src/core`'s and
# `money/src/core`'s `routes.rs`), and arkui's router writes that path into
# the address bar.

[dependencies]
# `#[derive(Routes)]`, which writes a route enum's paths.
ark-router-macros = { path = "../router-macros" }
