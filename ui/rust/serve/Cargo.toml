[package]
name = "arkui-serve"
workspace = "../../../rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "An app's pages written by its own server (arkui-web's `ssr` mode): each request drawn as the ark-auth session's Who over a replica the hub feeds in this process, each form taken by the app's `update` and authored through the domain's mutators, with a same-site CSRF token and an idempotency token. A capability no app turns on today (ui/docs/app.md, \"The Browser's Modes\")."

# Knows nothing of any domain: it writes the page every app's is
# (arkui-web's `WebHost`) over a replica of the server's hub, and the app's
# look.

[dependencies]
ark = { path = "../../../rust/ark" }
ark-auth = { path = "../../../rust/ark-auth" }
ark-peer = { path = "../../../rust/ark-peer", features = ["server"] }
arkui-web = { path = "../web", default-features = false, features = ["ssr"] }
ark-format = { path = "../../../rust/ark-format" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
# The fixtures are apps' parts of their hosts, as every app's is; one is
# over money's domain, its roles and its views as they are.
ark-app = { path = "../app" }
money-core = { path = "../../../money/core" }
ureq = { version = "2", default-features = false }
tempfile = "3"
