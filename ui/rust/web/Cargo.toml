[package]
name = "arkui-web"
workspace = "../../../rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "ArkUI in the browser: an ark-app View drawn by Leptos over the real DOM — the shell (sidebar, tab bars, toolbar, search, inspector), sheets, dialogs, menus, tables and figures — in the theme's CSS, with the desktop's keyboard."

# Knows nothing about any domain, as arkui: an app hands it its view, its
# messages and its hosted screens.

[dependencies]
ark-app = { path = "../app" }
# Where a page is: its address, the route model every app declares.
ark-router = { path = "../router" }
ark-format = { path = "../../../rust/ark-format" }
arkui-glyphs = { path = "../glyphs" }
# The DOM. How the page is made is the build's (ui/docs/app.md, "The
# Browser's Modes"): `csr` draws it in the browser alone (the SPA, the
# default); `ssr` writes a page's HTML natively (the prerenderer, the
# server); `hydrate` takes over HTML written so, in the browser. No server
# functions: the app's own server answers the forms.
leptos = { version = "0.8", default-features = false }
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "MouseEvent", "Event", "EventTarget", "DomRect", "Location", "UrlSearchParams", "MediaQueryList", "CssStyleDeclaration", "Node", "History", "FocusEvent", "PointerEvent", "ScrollIntoViewOptions", "ScrollLogicalPosition", "Navigator", "NodeList", "HtmlDocument"] }

[features]
default = ["csr"]
csr = ["leptos/csr"]
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr"]
